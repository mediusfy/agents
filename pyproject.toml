[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openclaw"
version = "0.1.0"
description = "Multi-Agent SDLC Ecosystem"
authors = [{name = "Drew Jocham"}]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9.0,<3.0",
    "pydantic-ai>=1.0.0,<2.0",
    "pydantic-settings>=2.5.0,<3.0",
    "httpx>=0.27.0,<0.29",
    "pyyaml>=6.0,<7.0",
    "chromadb>=0.4.0,<0.6",
    "sentence-transformers>=2.2.0,<3.0",
    "duckduckgo-search>=5.0.0,<7.0",
    "yfinance>=0.2.0,<0.6",
    "tenacity>=8.0.0,<9.0",
    "langchain>=0.2.0,<0.4",
    "langchain-community>=0.2.0,<0.4",
    "langchain-chroma>=0.1.0,<0.2",
    "dagster>=1.7.0,<2.0",
    "dagster-webserver>=1.7.0,<2.0",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.11,<2.0",
    "pre-commit>=3.8,<4.0",
    "types-pyyaml>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests (fast, no external deps)",
    "integration: Integration tests (require LLM mocking or external services)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG", "C4", "T20"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*.py" = ["ARG001"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = false
check_untyped_defs = false
ignore_missing_imports = true
exclude = [
    "src/openclaw/agents/non_technical/",
    ".venv/",
]
