[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openclaw"
version = "0.1.0"
description = "Multi-Agent Ecosystem"
authors = [{name = "Drew"}]
dependencies = [
    "pydantic>=2.9.0",
    "pydantic-ai>=0.0.1",
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "chromadb>=0.4.0",
    "sentence-transformers>=2.2.0",
    "duckduckgo-search>=5.0.0",
    "yfinance>=0.2.0",
    "tenacity>=8.0.0",
    "langchain>=0.2.0",
    "langchain-community>=0.2.0",
    "langchain-chroma>=0.1.0",
    "dagster>=1.7.0",
    "dagster-webserver>=1.7.0"
]

[tool.setuptools.packages.find]
where = ["src"]
