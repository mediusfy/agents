[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "orchestration"
version = "0.1.0"
description = "Multi-Agent SDLC Ecosystem"
authors = [{name = "Drew Jocham"}]
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "asyncpg>=0.31.0,<0.32.0",
    "beautifulsoup4>=4.12,<5.0",
    "certifi",
    # Pinned below 2.2: numpy>=2.2 ships PEP 695 `type` statement syntax in its
    # stubs, which mypy rejects under this project's `python_version = "3.11"`
    # config. Transitively pulled in via yfinance -> pandas, so this needs to
    # be a direct top-level constraint, not just on the `vector` extra's numpy.
    "numpy>=1.26,<2.2",
    "duckduckgo-search>=5.0.0,<7.0",
    "fastapi",
    "yfinance>=0.2.0,<0.6",
    "google-generativeai",
    "httpx>=0.27.0,<0.29",
    "logfire",
    "mcp>=1.0.0",
    "openai",
    "pip-system-certs",
    "pydantic>=2.9.0,<3.0",
    "pydantic-agents[vector] @ git+ssh://git@github.com/mediusfy/pydantic_agents.git@v0.1.3",
    "pydantic-ai>=1.0.0,<2.0",
    "pydantic-ai-slim[anthropic,deepseek,google,logfire,openai]>=1.61.0",
    "pydantic-settings>=2.5.0,<3.0",
    "pyyaml>=6.0,<7.0",
    "tenacity>=8.0.0,<9.0",
    "uvicorn",
    "langchain>=0.3.0,<0.4.0",
    "langchain-openai>=0.3.0,<0.4.0",
    "langgraph>=0.2.0,<0.3.0",
    "langchain-community>=0.3.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.11,<2.0",
    "pre-commit>=3.8,<4.0",
    "types-pyyaml>=6.0",
]
# Vector deps are owned by pydantic-agents[vector]; this extra is kept so
# existing `.[dev,vector]` installs keep working.
vector = []
ingest = [
    "langchain-community>=0.3,<0.4",
    "langchain-text-splitters>=0.3,<0.4",
    "pypdf>=4.0,<5.0",
]
agy = []  # reserved for future bridge-only deps
crewai = ["crewai>=0.109.0"]
autogen = ["pyautogen>=0.7.0,<0.8.0"]

[project.scripts]
orchestration-agy = "orchestration.agy_bridge.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests (fast, no external deps)",
    "integration: Integration tests (require LLM mocking or external services)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG", "C4", "T20"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*.py" = ["ARG001", "ARG002"]
"src/orchestration/validators.py" = ["T201"]
"src/orchestration/gates.py" = ["T201"]
"src/orchestration/live_trace.py" = ["T201"]
"src/orchestration/tools/*.py" = ["ARG001", "E501"]
"src/orchestration/agents/*.py" = ["ARG001", "E501"]
"src/orchestration/agents/non_technical/*.py" = ["ARG001", "E501"]
"src/orchestration/models/core.py" = ["UP042"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
# No python_version pin: mypy follows the running interpreter. CI lints on 3.11,
# which keeps 3.11 compatibility enforced, while 3.12 venvs can parse numpy>=2.5
# stubs (they use PEP 695 `type` statements that mypy rejects under a 3.11 target).
strict = false
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = false
check_untyped_defs = false
ignore_missing_imports = true
exclude = [
    "src/orchestration/agents/non_technical/",
    ".venv/",
    "generated-app/",
    "archive/",
]

# pydantic_ai's Agent type system is complex and generates false positives
# for `.data` access on run results, `token_usage`, and `ctx` params on tools.
# Only agent and tool files with heavy pydantic_ai integration get broad exemptions.
[[tool.mypy.overrides]]
module = [
    "orchestration.agents.*",
    "orchestration.tools.*",
]
ignore_errors = true
