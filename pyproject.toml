[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openclaw"
version = "0.1.0"
description = "Multi-Agent SDLC Ecosystem"
authors = [{name = "Drew Jocham"}]
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "asyncpg>=0.30.0,<1.0",
    "beautifulsoup4>=4.12,<5.0",
    "certifi",
    "duckduckgo-search>=5.0.0,<7.0",
    "fastapi",
    "google-generativeai",
    "httpx>=0.27.0,<0.29",
    "langchain-community>=0.2.0,<0.4",
    "langchain-text-splitters",
    "logfire",
    "mcp>=1.0.0",
    "openai",
    "numpy>=1.24,<2.0",
    "pip-system-certs",
    "pydantic>=2.9.0,<3.0",
    "pydantic-ai>=1.0.0,<2.0",
    "pydantic-ai-slim[anthropic,deepseek,google,logfire,openai]>=1.61.0",
    "pydantic-settings>=2.5.0,<3.0",
    "pypdf",
    "pyyaml>=6.0,<7.0",
    "redis>=5.0,<6.0",
    "sentence-transformers>=2.2.0,<3.0",
    "tenacity>=8.0.0,<9.0",
    "tokenizers!=0.20.3",
    "uvicorn",
    "yfinance>=0.2.0,<0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.11,<2.0",
    "pre-commit>=3.8,<4.0",
    "types-pyyaml>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests (fast, no external deps)",
    "integration: Integration tests (require LLM mocking or external services)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG", "C4", "T20"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*.py" = ["ARG001", "ARG002"]
"src/openclaw/gates.py" = ["T201"]
"src/openclaw/live_trace.py" = ["T201"]
"src/openclaw/validators.py" = ["T201"]
"src/openclaw/vector_db.py" = ["T201"]
"src/openclaw/tools/*.py" = ["ARG001", "E501"]
"src/openclaw/agents/*.py" = ["ARG001", "E501"]
"src/openclaw/agents/non_technical/*.py" = ["ARG001", "E501"]
"src/openclaw/memory_consolidator.py" = ["E501"]
"src/openclaw/models/core.py" = ["UP042"]
"src/openclaw/memory.py" = ["ARG002"]
"src/openclaw/vector_db_stub.py" = ["ARG002"]
"scripts/*.py" = ["T201", "E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = false
check_untyped_defs = false
ignore_missing_imports = true
exclude = [
    "src/openclaw/agents/non_technical/",
    ".venv/",
    "generated-app/",
]

# pydantic_ai's Agent type system is complex and generates false positives
# for `.data` access on run results, `token_usage`, and `ctx` params on tools.
# Only agent and tool files with heavy pydantic_ai integration get broad exemptions.
[[tool.mypy.overrides]]
module = [
    "openclaw.agents.*",
    "openclaw.tools.*",
]
ignore_errors = true
