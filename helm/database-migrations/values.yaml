image:
  repository: ghcr.io/openclaw/database-migrations
  tag: latest
  pullPolicy: Always

migrations:
  - name: 001_create_entities
    sql: |
      CREATE TABLE IF NOT EXISTS entities (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        name VARCHAR(255) NOT NULL,
        type VARCHAR(50) NOT NULL DEFAULT 'generic',
        status VARCHAR(20) NOT NULL DEFAULT 'active',
        region VARCHAR(20) NOT NULL DEFAULT 'us-east-1',
        data JSONB DEFAULT '{}',
        version INTEGER NOT NULL DEFAULT 1,
        deleted_at TIMESTAMPTZ,
        created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
      );
      CREATE INDEX IF NOT EXISTS idx_entities_region ON entities(region);
      CREATE INDEX IF NOT EXISTS idx_entities_status ON entities(status);
      CREATE INDEX IF NOT EXISTS idx_entities_deleted_at ON entities(deleted_at);
  - name: 002_create_outbox
    sql: |
      CREATE TABLE IF NOT EXISTS outbox (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        aggregate_type VARCHAR(100) NOT NULL,
        aggregate_id UUID NOT NULL,
        event_type VARCHAR(100) NOT NULL,
        payload JSONB NOT NULL DEFAULT '{}',
        idempotency_key VARCHAR(255) UNIQUE,
        published BOOLEAN NOT NULL DEFAULT FALSE,
        created_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
      );
      CREATE INDEX IF NOT EXISTS idx_outbox_published ON outbox(published);
      CREATE INDEX IF NOT EXISTS idx_outbox_idempotency ON outbox(idempotency_key);
  - name: 003_create_idempotency
    sql: |
      CREATE TABLE IF NOT EXISTS idempotency_keys (
        key_hash BYTEA PRIMARY KEY,
        response JSONB NOT NULL,
        expires_at TIMESTAMPTZ NOT NULL,
        created_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
      );
      CREATE INDEX IF NOT EXISTS idx_idempotency_expires ON idempotency_keys(expires_at);

postgresql:
  host: entity-management-postgresql
  port: 5432
  database: entitymgmt
  username: entitymgmt
  existingSecret: entity-management-db-creds
