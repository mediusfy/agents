apiVersion: v2
name: entity-management
description: OpenClaw Entity Management Service - CRUD with transactional outbox, multi-region data residency
type: application
version: 1.0.0
appVersion: "1.0.0"
kubeVersion: ">= 1.28.0-0"
home: https://github.com/openclaw/entity-management
sources:
  - https://github.com/openclaw/entity-management
maintainers:
  - name: OpenClaw SRE
    email: sre@openclaw.io
keywords:
  - entity-management
  - crud
  - outbox
  - multi-region

dependencies:
  - name: postgresql
    version: ~> 15.0
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
    alias: postgresql
  - name: nats
    version: ~> 1.2.0
    repository: https://nats-io.github.io/k8s/helm/charts/
    condition: nats.enabled
    alias: nats
