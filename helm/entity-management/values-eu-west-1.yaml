# =============================================================================
# Entity Management - eu-west-1 (DR / GDPR Region)
# =============================================================================
global:
  region: eu-west-1
  environment: production

config:
  region: eu-west-1
  allowedRegions: "us-east-1,us-west-2,eu-west-1,eu-central-1"
  idempotencyTTLHours: 168

postgresql:
  enabled: true
  architecture: replication
  auth:
    database: entitymgmt
    username: entitymgmt
  primary:
    persistence:
      size: 100Gi
      storageClass: gp3
    resources:
      requests:
        cpu: "2"
        memory: "4Gi"
      limits:
        cpu: "4"
        memory: "8Gi"
  readReplicas:
    count: 1
    resources:
      requests:
        cpu: "1"
        memory: "2Gi"
      limits:
        cpu: "2"
        memory: "4Gi"

replicaCount: 2
autoscaling:
  minReplicas: 2
  maxReplicas: 10

pdb:
  minAvailable: 1

ingress:
  hosts:
    - host: entity-mgmt.eu-west-1.api.openclaw.io
      paths:
        - path: /
          pathType: Prefix
