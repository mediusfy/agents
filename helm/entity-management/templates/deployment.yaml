apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "entity-management.fullname" . }}
  labels:
    {{- include "entity-management.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  minReadySeconds: {{ .Values.minReadySeconds | default 10 }}
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "entity-management.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "entity-management.selectorLabels" . | nindent 8 }}
        {{- if .Values.opentelemetry.enabled }}
        instrumentation.opentelemetry.io/inject-sdk: "true"
        {{- end }}
      annotations:
        prometheus.io/scrape: "{{ .Values.service.annotations.prometheus.io/scrape | default "true" }}"
        prometheus.io/port: "{{ .Values.service.annotations.prometheus.io/port | default "8080" }}"
        {{- if .Values.opentelemetry.enabled }}
        sidecar.opentelemetry.io/inject: "true"
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "entity-management.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.config.httpPort | default 8080 }}
              protocol: TCP
          env:
            - name: HTTP_PORT
              value: "{{ .Values.config.httpPort | default 8080 }}"
            - name: LOG_LEVEL
              value: "{{ .Values.config.logLevel | default "info" }}"
            - name: ENTITYMGMT_DEFAULT_REGION
              value: "{{ .Values.config.region }}"
            - name: ENTITYMGMT_ALLOWED_REGIONS
              value: "{{ .Values.config.allowedRegions }}"
            - name: ENTITYMGMT_IDEMPOTENCY_TTL_HOURS
              value: "{{ .Values.config.idempotencyTTLHours | default 168 }}"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalSecrets.enabled | ternary "entity-management-db" "entity-management-db" }}
                  key: url
            - name: NATS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalSecrets.enabled | ternary "entity-management-nats" "entity-management-nats" }}
                  key: url
            {{- if .Values.opentelemetry.enabled }}
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: "{{ .Values.opentelemetry.tracesEndpoint }}"
            - name: OTEL_EXPORTER_OTLP_METRICS_ENDPOINT
              value: "{{ .Values.opentelemetry.metricsEndpoint }}"
            - name: OTEL_SERVICE_NAME
              value: entity-management
            {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          startupProbe:
            {{- toYaml .Values.startupProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
