# =============================================================================
# OpenClaw Entity Management - Helm Values
# =============================================================================
# Production-grade configuration. Override per environment.
# =============================================================================

# -- Global settings
global:
  region: us-east-1
  environment: production

# =============================================================================
# Image Configuration
# =============================================================================
image:
  repository: ghcr.io/openclaw/entity-management
  tag: latest
  pullPolicy: Always
  digest: ""

imagePullSecrets:
  - name: ghcr-credentials

# =============================================================================
# Service Account (IRSA)
# =============================================================================
serviceAccount:
  create: true
  name: entity-management-sa
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT_ID:role/openclaw-production-entity-mgmt"
  automountServiceAccountToken: true

# =============================================================================
# Environment Configuration
# =============================================================================
config:
  httpPort: 8080
  logLevel: "info"
  region: "us-east-1"
  allowedRegions: "us-east-1,us-west-2,eu-west-1,eu-central-1"
  idempotencyTTLHours: 168

# =============================================================================
# Secrets (via External Secrets Operator)
# =============================================================================
externalSecrets:
  enabled: true
  refreshInterval: "1h"
  secrets:
    - name: database-url
      remoteRef:
        key: openclaw/entity-management/database-url
    - name: nats-url
      remoteRef:
        key: openclaw/entity-management/nats-url

# =============================================================================
# PostgreSQL (Bitnami sub-chart)
# =============================================================================
postgresql:
  enabled: true
  architecture: replication
  auth:
    database: entitymgmt
    username: entitymgmt
    existingSecret: entity-management-db-creds
  primary:
    persistence:
      size: 50Gi
      storageClass: gp3
    resources:
      requests:
        cpu: "1"
        memory: "2Gi"
      limits:
        cpu: "2"
        memory: "4Gi"
  readReplicas:
    count: 2
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "1"
        memory: "2Gi"

# =============================================================================
# NATS (sub-chart)
# =============================================================================
nats:
  enabled: true
  cluster:
    enabled: true
    replicas: 3
  nats:
    jetstream:
      enabled: true
      fileStore:
        pvc:
          size: 10Gi
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "1"
        memory: "2Gi"

# =============================================================================
# Deployment
# =============================================================================
replicaCount: 3
minReadySeconds: 10

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

resources:
  requests:
    cpu: "500m"
    memory: "512Mi"
  limits:
    cpu: "1"
    memory: "1Gi"

# =============================================================================
# Probes
# =============================================================================
livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 10
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 2

startupProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 3
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 30

# =============================================================================
# Security
# =============================================================================
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  readOnlyRootFilesystem: true
  privileged: false
  runAsNonRoot: true
  runAsUser: 1001

# =============================================================================
# Networking
# =============================================================================
service:
  type: ClusterIP
  port: 8080
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"

ingress:
  enabled: true
  className: "alb"
  annotations:
    alb.ingress.kubernetes.io/scheme: internal
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
  hosts:
    - host: entity-mgmt.local
      paths:
        - path: /
          pathType: Prefix

# =============================================================================
# Autoscaling (HPA based on custom metrics)
# =============================================================================
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 4
          periodSeconds: 15
        - type: Percent
          value: 100
          periodSeconds: 15
      selectPolicy: Max

# =============================================================================
# PodDisruptionBudget
# =============================================================================
pdb:
  enabled: true
  minAvailable: 2
  maxUnavailable: ""

# =============================================================================
# Topology Spread
# =============================================================================
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway

# =============================================================================
# Pod Affinity / Anti-Affinity
# =============================================================================
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - entity-management
          topologyKey: topology.kubernetes.io/zone

# =============================================================================
# Network Policy
# =============================================================================
networkPolicy:
  enabled: true
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
      ports:
        - port: 5432
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nats
      ports:
        - port: 4222
          protocol: TCP
        - port: 6222
          protocol: TCP

# =============================================================================
# ServiceMonitor (Prometheus Operator)
# =============================================================================
serviceMonitor:
  enabled: true
  interval: 30s
  scrapeTimeout: 10s
  metricRelabelings:
    - sourceLabels: [__name__]
      regex: "(http_requests_total|http_request_duration_seconds|entity_.*)"
      action: keep

# =============================================================================
# Node Selector & Tolerations
# =============================================================================
nodeSelector:
  node.kubernetes.io/role: application

tolerations:
  - key: node.kubernetes.io/type
    operator: Equal
    value: application
    effect: NoSchedule
  - key: karpenter.sh/capacity-type
    operator: Equal
    value: spot
    effect: NoSchedule

# =============================================================================
# Tracing & Metrics
# =============================================================================
opentelemetry:
  enabled: true
  tracesEndpoint: "http://otel-collector.monitoring:4318/v1/traces"
  metricsEndpoint: "http://otel-collector.monitoring:4318/v1/metrics"
