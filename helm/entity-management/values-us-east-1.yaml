# =============================================================================
# Entity Management - us-east-1 (Primary Region)
# =============================================================================
global:
  region: us-east-1
  environment: production

config:
  region: us-east-1
  allowedRegions: "us-east-1,us-west-2,eu-west-1,eu-central-1"
  idempotencyTTLHours: 168

postgresql:
  enabled: true
  architecture: replication
  auth:
    database: entitymgmt
    username: entitymgmt
  primary:
    persistence:
      size: 100Gi
      storageClass: gp3
    resources:
      requests:
        cpu: "2"
        memory: "4Gi"
      limits:
        cpu: "4"
        memory: "8Gi"
  readReplicas:
    count: 2
    resources:
      requests:
        cpu: "1"
        memory: "2Gi"
      limits:
        cpu: "2"
        memory: "4Gi"

replicaCount: 3
autoscaling:
  minReplicas: 3
  maxReplicas: 20

pdb:
  minAvailable: 2

ingress:
  hosts:
    - host: entity-mgmt.us-east-1.api.openclaw.io
      paths:
        - path: /
          pathType: Prefix
