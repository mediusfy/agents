# =============================================================================
# Multi-Region Failover Plan - OpenClaw (ENTITYMGMT-11)
# =============================================================================
# Active-Active setup: us-east-1 (primary), eu-west-1 (DR/GDPR)
# Failover is managed via ArgoCD ApplicationSet + Global DNS (Route53)
# =============================================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: failover-plan
  namespace: entity-management
  labels:
    app.kubernetes.io/name: entity-management
    app.kubernetes.io/component: failover
data:
  # ---- Active Region Configuration ----
  primary-region: "us-east-1"
  dr-region: "eu-west-1"
  
  # ---- RTO / RPO Targets ----
  # Recovery Time Objective: 5 minutes
  # Recovery Point Objective: 1 second (synchronous DB replication)
  rto-seconds: "300"
  rpo-seconds: "1"
  
  # ---- Health Check Endpoints ----
  health-endpoint: "/healthz"
  readiness-endpoint: "/readyz"
  
  # ---- Traffic Routing ----
  # Primary: us-east-1 (100% traffic)
  # DR: eu-west-1 (0% traffic, warm standby)
  # On failover: swap routing
  route53-policy: "WEIGHTED"
  primary-weight: "100"
  dr-weight: "0"
  
  # ---- Database Replication ----
  # PostgreSQL: streaming replication us-east-1 -> eu-west-1
  # Cross-region read replicas in eu-west-1
  db-replication-mode: "ASYNC"
  db-replication-slot: "entitymgmt_eu_west_1"
  
  # ---- NATS JetStream Cross-Region ----
  # NATS leaf node connections for cross-region event forwarding
  nats-leafnode-primary: "nats://nats.entity-management.svc:6222"
  nats-leafnode-dr: "nats://nats.entity-management.eu-west-1.svc:6222"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: failover-script
  namespace: entity-management
data:
  promote-dr.sh: |
    #!/bin/bash
    # ---- Promote eu-west-1 to primary ----
    # 1. Promote DR database to primary
    kubectl exec -n entity-management deployment/postgresql-primary -- \
      pg_ctl promote
    
    # 2. Update ExternalSecrets to point DR endpoints
    kubectl patch externalsecret entity-management-secrets \
      -n entity-management --type=merge \
      -p '{"spec":{"data":[{"secretKey":"database-url","remoteRef":{"key":"openclaw/entity-management/database-url-eu-west-1"}}]}}'
    
    # 3. Update DNS weights
    aws route53 change-resource-record-sets --hosted-zone-id ZONE_ID \
      --change-batch '{
        "Changes": [
          {"Action":"UPSERT","ResourceRecordSet":{"Name":"entity-mgmt.openclaw.io","Type":"CNAME","SetIdentifier":"eu-west-1","Weight":100,"TTL":60,"ResourceRecords":[{"Value":"eu-west-1-lb.openclaw.io"}]}},
          {"Action":"UPSERT","ResourceRecordSet":{"Name":"entity-mgmt.openclaw.io","Type":"CNAME","SetIdentifier":"us-east-1","Weight":0,"TTL":60,"ResourceRecords":[{"Value":"us-east-1-lb.openclaw.io"}]}}
        ]
      }'
    
    # 4. Notify SRE
    echo "FAILOVER: eu-west-1 promoted to primary at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
