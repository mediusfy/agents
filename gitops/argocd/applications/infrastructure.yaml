# =============================================================================
# ArgoCD Application: Cluster Infrastructure
# =============================================================================
# Core cluster addons: External Secrets, Ingress Controller, Monitoring, etc.
# =============================================================================

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-infrastructure
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: openclaw

  source:
    repoURL: https://github.com/openclaw/infrastructure
    targetRevision: HEAD
    path: gitops/cluster-addons
    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
spec:
  project: openclaw
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: "0.10.0"
    helm:
      values: |
        installCRDs: true
        serviceAccount:
          create: true
          name: external-secrets
        webhook:
          port: 9443
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-stack
  namespace: argocd
spec:
  project: openclaw
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: "62.0.0"
    helm:
      values: |
        prometheus:
          prometheusSpec:
            retention: 15d
            resources:
              requests:
                cpu: "500m"
                memory: "2Gi"
        grafana:
          adminPassword: ""
          persistence:
            enabled: true
            size: 10Gi
        alertmanager:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
