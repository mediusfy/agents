# Redis Configuration for ENT-02 Entity Caching
# ==============================================================
# Purpose: Cache entity instances and schema lookups to avoid
# repeated database queries for read-heavy API endpoints (list/get).
#
# Caching strategy:
# - Entity instances: TTL 5min (entities can be created/updated frequently)
# - Entity list results: TTL 2min (list results are paginated and short-lived)
# - Schema definitions: TTL 1h (schemas change infrequently)
# - Region/zone mappings: TTL 1h (immutable, but cached for performance)

# Memory management
maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistence
appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Key naming convention
# ======================
# entity:{entity_id}                         -> Entity JSON (full instance)
# entity:schema:{schema_id}:v{version}       -> Schema definition with fields
# entity:schema:slug:{slug}                  -> Schema lookup by slug
# entity:list:{schema_id}:{status}:{page}    -> Paginated entity list
# entity:list:region:{region}:{page}         -> Entities by region
# entity:count:{schema_id}:{status}          -> Entity count by schema+status
# entity:zone:{data_residency_zone}          -> Entities by data residency zone
# entity:version:{entity_id}                 -> Current version for cache invalidation
# schema:active                              -> Set of all active schema IDs

# Eviction policy explanation:
# allkeys-lru (Least Recently Used) eviction ensures that the most
# frequently accessed entities remain cached while less popular ones
# are evicted first. The TTLs above provide a safety net.

# Security
requirepass "${REDIS_ENTITY_PASSWORD}"
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command CONFIG ""

# Logging
loglevel notice
logfile /var/log/redis/entity-cache.log

# Performance
timeout 300
tcp-keepalive 60
lfu-log-factor 10
lfu-decay-time 1

# Keyspace notifications (enabled for cache invalidation across instances)
notify-keyspace-events Ex

# Invalidation strategy:
# ======================
# Write-through: On entity create/update/delete, invalidate:
#   1. DEL entity:{entity_id}
#   2. DEL entity:list:{schema_id}:*  (pattern-based, or track in a set)
#   3. DEL entity:version:{entity_id}
#
# Version-based cache busting for schema changes:
# When a schema is updated (new version), all cached entities for that
# schema should be invalidated. Use the schema version as a key suffix.
