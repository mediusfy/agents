

# Redis Configuration for FINOPS-03 Showback/Show-Charge Caching
# ==============================================================
# Purpose: Cache generated reports and cost aggregation data to 
# avoid recomputing expensive billing queries on every API call.
# 
# Caching strategy:
# - Report data: TTL 24h (reports are generated monthly, no need to refresh often)
# - Cost aggregations: TTL 1h (intermediate calculations for projections)
# - Team/service metadata: TTL 1h (infrequently changing)
# - Published report URLs (CSV/PDF): TTL matching the signed URL expiry

# Memory management
maxmemory 512mb
maxmemory-policy allkeys-lru

# Persistence
appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Key naming convention
# showback:report:{team_id}:{billing_period}    -> Showback report JSON
# charge:report:{team_id}:{billing_period}      -> Show-charge report JSON
# showback:breakdown:{report_id}:{type}          -> Line items by breakdown type
# cost:aggregation:{team_id}:{period}:{dimension} -> Aggregated cost data
# cost:projection:{team_id}:{next_period}        -> Projected cost data
# report:url:{publication_id}                    -> Signed download URL
# metadata:team:{team_id}                        -> Team metadata
# metadata:service:{service_id}                  -> Service metadata

# Security
requirepass "${REDIS_FINOPS_PASSWORD}"
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command CONFIG ""

# Logging
loglevel notice
logfile /var/log/redis/finops-showback.log

# Performance
timeout 300
tcp-keepalive 60
lfu-log-factor 10
lfu-decay-time 1

# Keyspace notifications (enabled for cache invalidation)
notify-keyspace-events Ex
