

# =============================================================================
# Redis Configuration — CLUSTER-01 ClusterConnect Caching Layer
# =============================================================================
#
# Purpose: Cache cluster connection metadata, health statuses, and tag
#   lookups to reduce database load during rapid UI polling and health checks.
#
# Key naming convention:
#   clusterconnect:{cluster_id}:{sub_key}
#
# Cache strategies:
#   1. Cluster list (active, non-deleted) — cache-aside, TTL 60s
#   2. Individual cluster metadata — cache-aside, TTL 300s
#   3. Cluster health status — write-through, TTL 30s
#   4. Cluster tags — cache-aside, TTL 600s
#   5. Connection audit log (recent) — cache-aside, TTL 120s
# =============================================================================

# Memory limit (shared across all bounded contexts)
maxmemory 512mb

# Eviction policy: allkeys-lru (least recently used)
# ClusterConnect data is primarily cached with TTLs; LRU eviction handles
# memory pressure gracefully.
maxmemory-policy allkeys-lru

# Persistence — AOF for durability of health-check state
appendonly yes
appendfsync everysec

# Key expiry defaults (application-layer overridable)
# clusterconnect:list:*              TTL 60s
# clusterconnect:{id}:metadata       TTL 300s
# clusterconnect:{id}:health         TTL 30s
# clusterconnect:{id}:tags           TTL 600s
# clusterconnect:audit:recent        TTL 120s

# ---------------------------------------------------------------------------
# Cache key templates (documentation reference for the app team)
# ---------------------------------------------------------------------------
# Active cluster list (paginated):
#   clusterconnect:list:{cloud_provider}:{region}:{page}
#   -> JSON array of { id, name, display_name, status }
#
# Cluster detail:
#   clusterconnect:{cluster_id}:metadata
#   -> JSON { id, name, provider, region, endpoint, version, status, tags }
#
# Health status:
#   clusterconnect:{cluster_id}:health
#   -> JSON { status, response_time_ms, checked_at }
#
# Tags for a cluster:
#   clusterconnect:{cluster_id}:tags
#   -> JSON { "key1": "val1", "key2": "val2" }
#
# Recent audit log entries:
#   clusterconnect:audit:recent
#   -> JSON array of recent { event_type, cluster_id, occurred_at }
#
# Group membership cache:
#   clusterconnect:group:{group_id}:clusters
#   -> JSON array of cluster IDs in this group

# ---------------------------------------------------------------------------
# Invalidation events
# ---------------------------------------------------------------------------
# The application layer MUST invalidate cache on these domain events:
# - ClusterRegistered         -> DEL clusterconnect:list:*
# - ClusterRemoved            -> DEL clusterconnect:list:*, clusterconnect:{id}:*
# - ClusterConnectionStatusChanged -> DEL clusterconnect:{id}:metadata, clusterconnect:{id}:health
# - ClusterCredentialsRotated -> DEL clusterconnect:{id}:metadata
# - ClusterHealthChecked      -> SET clusterconnect:{id}:health (write-through)
# - ClusterGroupAssigned      -> DEL clusterconnect:group:{group_id}:clusters


# Redis Cache Configuration for ClusterConnect (CLUSTERCONNECT-01)
# 
# Purpose: Cache cluster connection metadata, health status, and provider info
# to reduce database load and improve API response times.
#
# Cache Key Patterns:
#   cluster:status:{cluster_id}        → cluster_connection_status (TTL: 30s)
#   cluster:health:{cluster_id}        → latest health check (TTL: 60s)
#   cluster:provider:{provider_id}     → cloud provider info (TTL: 3600s)
#   cluster:summary:{tenant_id}        → aggregated cluster summary (TTL: 60s)
#   cluster:tags:{cluster_id}          → tag list for cluster (TTL: 120s)

maxmemory 256mb
maxmemory-policy allkeys-lru
appendonly yes
appendfsync everysec

# Eviction: least-recently-used since cluster metadata is frequently accessed
# with varying TTLs. LRU ensures hot clusters stay cached.

# Security
requirepass ${REDIS_CLUSTERCONNECT_PASSWORD}
rename-command FLUSHDB  ""
rename-command FLUSHALL ""
rename-command CONFIG   ""

# Connection
timeout 30
tcp-keepalive 60
