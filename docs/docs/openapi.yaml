openapi: 3.1.0
info:
  title: Rufkis SRE Platform API
  description: |
    API for the Rufkis SRE Platform covering four strategic themes:
    - GitOps-Native Remediation
    - Automated FinOps ROI
    - Autonomous Agent Triage
    - Local-First SRE Workspace
  version: 1.0.0
  contact:
    name: Rufkis Team
    url: https://github.com/rufkis/sre-platform
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: https://api.rufkis.io/v1
    description: Production API
  - url: https://staging-api.rufkis.io/v1
    description: Staging API
  - url: http://localhost:8080/v1
    description: Local development

tags:
  - name: GitOps - Remediations
    description: Automated incident response via GitOps pull requests
  - name: GitOps - Runbooks
    description: Declarative runbook definitions stored in Git
  - name: GitOps - Audit
    description: Audit trail and rollback via Git history
  - name: GitOps - Policies
    description: Policy-as-Code for remediation approval gates
  - name: FinOps - Anomalies
    description: Real-time cloud cost anomaly detection
  - name: FinOps - Recommendations
    description: Automated cost optimization with projected ROI
  - name: FinOps - Showback
    description: Showback/show-charge reporting per team per service
  - name: FinOps - Tradeoffs
    description: Cost vs. reliability trade-off visualization
  - name: Triage - Classification
    description: AI-powered incident triage and severity classification
  - name: Triage - RCA
    description: Automated root cause analysis suggestions
  - name: Triage - SelfHealing
    description: Self-healing runbook execution via autonomous agents
  - name: Triage - Escalation
    description: Escalation logic with human-in-the-loop
  - name: Workspace - Sync
    description: Local-first workspace sync and offline capabilities
  - name: Workspace - P2P
    description: Peer-to-peer sync between team member workspaces
  - name: Health
    description: Health check endpoints

paths:
  # ============================================================================
  # HEALTH
  # ============================================================================
  /health:
    get:
      tags: [Health]
      summary: Health check
      operationId: healthCheck
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  # ============================================================================
  # GITOPS - REMEDIATIONS
  # ============================================================================
  /gitops/remediations:
    post:
      tags: [GitOps - Remediations]
      summary: Create a remediation PR
      description: >
        Creates a GitOps pull request containing runbook-specific changes
        for an incident. The remediation workflow maps the classified incident
        to a runbook, renders the changes as a Git diff, and submits a PR
        to the runbooks repository.
      operationId: createRemediation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRemediationRequest"
      responses:
        "201":
          description: Remediation PR created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemediationResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Duplicate remediation PR (already exists for this incident+runbook)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      x-code-samples:
        - lang: curl
          source: |
            curl -X POST https://api.rufkis.io/v1/gitops/remediations \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              -d '{
                "incident_id": "inc-20260603-001",
                "runbook_id": "rb-database-failover",
                "environment": "production",
                "region": "us-east-1",
                "variables": {
                  "db_cluster": "prod-db-01",
                  "failover_target": "us-east-1b"
                }
              }'

    get:
      tags: [GitOps - Remediations]
      summary: List remediation PRs
      operationId: listRemediations
      parameters:
        - name: incident_id
          in: query
          schema: { type: string }
          description: Filter by incident ID
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, approved, merged, rejected, rolled_back]
          description: Filter by PR status
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: List of remediation PRs
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/RemediationResponse"
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer

  /gitops/remediations/{remediation_id}:
    get:
      tags: [GitOps - Remediations]
      summary: Get remediation PR details
      operationId: getRemediation
      parameters:
        - name: remediation_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Remediation PR details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemediationResponse"
        "404":
          description: Remediation not found

  /gitops/remediations/{remediation_id}/rollback:
    post:
      tags: [GitOps - Remediations]
      summary: Rollback a remediation
      description: Creates a revert PR for a previously merged remediation
      operationId: rollbackRemediation
      parameters:
        - name: remediation_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: Reason for rollback
                requested_by:
                  type: string
      responses:
        "201":
          description: Rollback PR created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemediationResponse"
        "400":
          description: Invalid rollback request

  # ============================================================================
  # GITOPS - RUNBOOKS
  # ============================================================================
  /gitops/runbooks:
    get:
      tags: [GitOps - Runbooks]
      summary: List runbooks
      operationId: listRunbooks
      parameters:
        - name: service
          in: query
          schema: { type: string }
        - name: severity
          in: query
          schema:
            type: string
            enum: [P0, P1, P2, P3, P4]
        - name: environment
          in: query
          schema:
            type: string
            enum: [production, staging, development]
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: List of runbooks
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/RunbookResponse"
                  total:
                    type: integer

  /gitops/runbooks/{runbook_id}:
    get:
      tags: [GitOps - Runbooks]
      summary: Get runbook details
      operationId: getRunbook
      parameters:
        - name: runbook_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Runbook details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunbookResponse"
        "404":
          description: Runbook not found

  /gitops/runbooks/validate:
    post:
      tags: [GitOps - Runbooks]
      summary: Validate a runbook YAML definition
      operationId: validateRunbook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                runbook_yaml:
                  type: string
                  description: Raw YAML content of the runbook
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        path:
                          type: string
                        message:
                          type: string
                        severity:
                          type: string
                          enum: [error, warning]
                  warnings:
                    type: array
                    items:
                      type: string

  # ============================================================================
  # GITOPS - AUDIT
  # ============================================================================
  /gitops/audit:
    get:
      tags: [GitOps - Audit]
      summary: Query remediation audit trail
      operationId: queryAuditTrail
      parameters:
        - name: incident_id
          in: query
          schema: { type: string }
        - name: start_date
          in: query
          schema: { type: string, format: date-time }
        - name: end_date
          in: query
          schema: { type: string, format: date-time }
        - name: approver
          in: query
          schema: { type: string }
        - name: service
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: Audit trail entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditEntry"
                  total:
                    type: integer

  /gitops/audit/{incident_id}:
    get:
      tags: [GitOps - Audit]
      summary: Get complete audit history for an incident
      operationId: getIncidentAudit
      parameters:
        - name: incident_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Complete audit history for the incident
          content:
            application/json:
              schema:
                type: object
                properties:
                  incident_id:
                    type: string
                  entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditEntry"
                  git_history:
                    type: array
                    items:
                      $ref: "#/components/schemas/GitCommitInfo"

  # ============================================================================
  # GITOPS - POLICIES
  # ============================================================================
  /gitops/policies/evaluate:
    post:
      tags: [GitOps - Policies]
      summary: Evaluate a PR against policy-as-code
      operationId: evaluatePolicy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PolicyEvaluationRequest"
      responses:
        "200":
          description: Policy evaluation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyEvaluationResponse"

  /gitops/policies:
    get:
      tags: [GitOps - Policies]
      summary: List defined policies
      operationId: listPolicies
      responses:
        "200":
          description: List of policies
          content:
            application/json:
              schema:
                type: object
                properties:
                  policies:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        description:
                          type: string
                        severity:
                          type: string
                          enum: [mandatory, advisory]
                        rego_source:
                          type: string

  # ============================================================================
  # FINOPS - ANOMALIES
  # ============================================================================
  /finops/anomalies/scan:
    post:
      tags: [FinOps - Anomalies]
      summary: Trigger a cost anomaly scan
      operationId: scanAnomalies
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnomalyScanRequest"
      responses:
        "200":
          description: Anomaly scan results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnomalyScanResponse"
      x-code-samples:
        - lang: curl
          source: |
            curl -X POST https://api.rufkis.io/v1/finops/anomalies/scan \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              -d '{
                "providers": ["aws", "gcp", "azure"],
                "regions": ["eu-west-1", "us-east-1", "ap-southeast-1"],
                "baseline_days": 7,
                "threshold_std_dev": 3
              }'

  /finops/anomalies:
    get:
      tags: [FinOps - Anomalies]
      summary: List cost anomalies
      operationId: listAnomalies
      parameters:
        - name: provider
          in: query
          schema:
            type: string
            enum: [aws, gcp, azure]
        - name: region
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema:
            type: string
            enum: [open, acknowledged, resolved, false_positive]
        - name: severity
          in: query
          schema:
            type: string
            enum: [critical, high, medium, low]
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: List of anomalies
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AnomalyResponse"
                  total:
                    type: integer

  /finops/anomalies/{anomaly_id}:
    get:
      tags: [FinOps - Anomalies]
      summary: Get anomaly details
      operationId: getAnomaly
      parameters:
        - name: anomaly_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Anomaly details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnomalyResponse"

  # ============================================================================
  # FINOPS - RECOMMENDATIONS
  # ============================================================================
  /finops/recommendations:
    get:
      tags: [FinOps - Recommendations]
      summary: List cost optimization recommendations
      operationId: listRecommendations
      parameters:
        - name: provider
          in: query
          schema:
            type: string
            enum: [aws, gcp, azure]
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, implemented, dismissed]
        - name: min_roi_score
          in: query
          schema: { type: number, minimum: 0, maximum: 1 }
        - name: sort_by
          in: query
          schema:
            type: string
            enum: [projected_savings, roi_score, complexity]
            default: roi_score
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: List of recommendations
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/RecommendationResponse"
                  total:
                    type: integer
                  total_projected_savings_monthly:
                    type: number
                    description: Sum of all projected monthly savings in USD

    post:
      tags: [FinOps - Recommendations]
      summary: Trigger a new optimization scan
      operationId: triggerOptimizationScan
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                providers:
                  type: array
                  items:
                    type: string
                    enum: [aws, gcp, azure]
                regions:
                  type: array
                  items:
                    type: string
                scan_type:
                  type: string
                  enum: [full, incremental]
                  default: incremental
      responses:
        "200":
          description: Scan triggered
          content:
            application/json:
              schema:
                type: object
                properties:
                  scan_id:
                    type: string
                    format: uuid
                  status:
                    type: string
                    enum: [running, completed, failed]
                  estimated_completion:
                    type: string
                    format: date-time

  /finops/recommendations/{recommendation_id}:
    get:
      tags: [FinOps - Recommendations]
      summary: Get recommendation details
      operationId: getRecommendation
      parameters:
        - name: recommendation_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Recommendation details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecommendationResponse"

    patch:
      tags: [FinOps - Recommendations]
      summary: Update recommendation status
      operationId: updateRecommendationStatus
      parameters:
        - name: recommendation_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [implemented, dismissed]
                notes:
                  type: string
      responses:
        "200":
          description: Status updated

  # ============================================================================
  # FINOPS - SHOWBACK
  # ============================================================================
  /finops/showback:
    get:
      tags: [FinOps - Showback]
      summary: List showback reports
      operationId: listShowbackReports
      parameters:
        - name: team_id
          in: query
          schema: { type: string }
        - name: service_id
          in: query
          schema: { type: string }
        - name: billing_month
          in: query
          schema:
            type: string
            pattern: "^\\d{4}-\\d{2}$"
            description: "YYYY-MM format"
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: List of showback reports
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ShowbackReport"
                  total:
                    type: integer

  /finops/showback/current:
    get:
      tags: [FinOps - Showback]
      summary: Get current month showback summary
      operationId: getCurrentShowback
      parameters:
        - name: team_id
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Current showback summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShowbackReport"

  /finops/showback/export:
    get:
      tags: [FinOps - Showback]
      summary: Export showback report
      operationId: exportShowback
      parameters:
        - name: report_id
          in: query
          required: true
          schema: { type: string }
        - name: format
          in: query
          schema:
            type: string
            enum: [pdf, csv]
            default: csv
      responses:
        "200":
          description: Exported file
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            text/csv:
              schema:
                type: string

  # ============================================================================
  # FINOPS - TRADE-OFFS
  # ============================================================================
  /finops/tradeoffs:
    get:
      tags: [FinOps - Tradeoffs]
      summary: Get cost vs reliability trade-off data
      operationId: getTradeoffData
      parameters:
        - name: start_date
          in: query
          schema: { type: string, format: date }
        - name: end_date
          in: query
          schema: { type: string, format: date }
        - name: services
          in: query
          schema:
            type: array
            items: { type: string }
          explode: true
          description: Filter by service names
      responses:
        "200":
          description: Trade-off data points
          content:
            application/json:
              schema:
                type: object
                properties:
                  data_points:
                    type: array
                    items:
                      $ref: "#/components/schemas/TradeoffDataPoint"
                  quadrants:
                    type: object
                    properties:
                      under_funded:
                        type: array
                        items: { type: string }
                      optimal:
                        type: array
                        items: { type: string }
                      over_engineered:
                        type: array
                        items: { type: string }
                      at_risk:
                        type: array
                        items: { type: string }
                  generated_at:
                    type: string
                    format: date-time

  /finops/tradeoffs/config:
    get:
      tags: [FinOps - Tradeoffs]
      summary: Get SLO and cost budget configurations
      operationId: getTradeoffConfig
      responses:
        "200":
          description: Trade-off configurations
          content:
            application/json:
              schema:
                type: object
                properties:
                  services:
                    type: array
                    items:
                      $ref: "#/components/schemas/TradeoffConfig"

    post:
      tags: [FinOps - Tradeoffs]
      summary: Create or update trade-off configuration
      operationId: upsertTradeoffConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TradeoffConfig"
      responses:
        "200":
          description: Configuration saved

  # ============================================================================
  # TRIAGE - CLASSIFICATION
  # ============================================================================
  /triage/classify:
    post:
      tags: [Triage - Classification]
      summary: Classify an incident
      description: >
        AI-powered incident triage that classifies severity (P0-P4) with
        confidence score and assigns ownership to the appropriate SRE team.
      operationId: classifyIncident
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClassifyIncidentRequest"
      responses:
        "200":
          description: Classification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassificationResponse"
      x-code-samples:
        - lang: curl
          source: |
            curl -X POST https://api.rufkis.io/v1/triage/classify \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              -d '{
                "alert_id": "alt-20260603-042",
                "source": "prometheus",
                "title": "High error rate on payment-service",
                "description": "HTTP 500 errors exceeding 5% in the last 5 minutes on payment-service instances",
                "raw_payload": {
                  "service": "payment-service",
                  "namespace": "production",
                  "metric": "http_requests_error_rate",
                  "value": 5.7,
                  "threshold": 1.0,
                  "instance": "payment-service-abc123"
                },
                "source_url": "https://prometheus.example.com/alerts/abc123"
              }'

  /triage/classifications/{classification_id}:
    get:
      tags: [Triage - Classification]
      summary: Get classification details
      operationId: getClassification
      parameters:
        - name: classification_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Classification details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassificationResponse"

  # ============================================================================
  # TRIAGE - RCA
  # ============================================================================
  /triage/rca:
    post:
      tags: [Triage - RCA]
      summary: Trigger root cause analysis for an incident
      operationId: triggerRCA
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                incident_id:
                  type: string
                classification_id:
                  type: string
                  format: uuid
                context:
                  type: object
                  properties:
                    time_range_minutes:
                      type: integer
                      default: 60
                    include_logs:
                      type: boolean
                      default: true
                    include_metrics:
                      type: boolean
                      default: true
                    include_traces:
                      type: boolean
                      default: true
                    include_recent_changes:
                      type: boolean
                      default: true
      responses:
        "200":
          description: RCA analysis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RCAResponse"

  /triage/rca/{incident_id}:
    get:
      tags: [Triage - RCA]
      summary: Get RCA results for an incident
      operationId: getRCA
      parameters:
        - name: incident_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: RCA results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RCAResponse"
        "404":
          description: RCA results not found

  # ============================================================================
  # TRIAGE - SELF-HEALING
  # ============================================================================
  /triage/self-healing/execute:
    post:
      tags: [Triage - SelfHealing]
      summary: Execute self-healing runbook
      operationId: executeSelfHealing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                incident_id:
                  type: string
                classification_id:
                  type: string
                  format: uuid
                dry_run:
                  type: boolean
                  default: true
                  description: Execute dry-run first before actual remediation
      responses:
        "200":
          description: Self-healing execution result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SelfHealingResponse"

  /triage/self-healing/status/{execution_id}:
    get:
      tags: [Triage - SelfHealing]
      summary: Get self-healing execution status
      operationId: getSelfHealingStatus
      parameters:
        - name: execution_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Execution status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SelfHealingResponse"

  # ============================================================================
  # TRIAGE - ESCALATION
  # ============================================================================
  /triage/escalations:
    post:
      tags: [Triage - Escalation]
      summary: Trigger escalation
      operationId: triggerEscalation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                incident_id:
                  type: string
                classification_id:
                  type: string
                  format: uuid
                reason:
                  type: string
                  enum:
                    - p0_incident
                    - self_healing_failure
                    - low_confidence_classification
                    - manual_escalation
                tier:
                  type: integer
                  default: 1
                  description: "Escalation tier (1=engineer, 2=team lead, 3=SRE manager)"
      responses:
        "200":
          description: Escalation triggered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EscalationResponse"

  /triage/escalations/{escalation_id}:
    get:
      tags: [Triage - Escalation]
      summary: Get escalation status
      operationId: getEscalation
      parameters:
        - name: escalation_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Escalation details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EscalationResponse"

  /triage/escalations/policy:
    get:
      tags: [Triage - Escalation]
      summary: Get escalation policy
      operationId: getEscalationPolicy
      responses:
        "200":
          description: Escalation policy configuration
          content:
            application/json:
              schema:
                type: object
                properties:
                  tiers:
                    type: array
                    items:
                      type: object
                      properties:
                        level:
                          type: integer
                        name:
                          type: string
                        on_call_schedule:
                          type: string
                        timeout_minutes:
                          type: integer
                        notification_channels:
                          type: array
                          items:
                            type: string
                            enum: [pagerduty, slack, email, sms]
                  rules:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        condition:
                          type: string
                        target_tier:
                          type: integer

    put:
      tags: [Triage - Escalation]
      summary: Update escalation policy
      operationId: updateEscalationPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tiers:
                  type: array
                  items:
                    type: object
                rules:
                  type: array
                  items:
                    type: object
      responses:
        "200":
          description: Policy updated

  # ============================================================================
  # WORKSPACE - SYNC
  # ============================================================================
  /workspace/sync:
    post:
      tags: [Workspace - Sync]
      summary: Sync local changes to cloud backend
      description: >
        Progressively syncs local workspace changes to the cloud backend.
        Changes are processed in priority order: incident timeline updates,
        runbook changes, then configuration changes.
      operationId: syncChanges
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncRequest"
      responses:
        "200":
          description: Sync initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResponse"
      x-code-samples:
        - lang: curl
          source: |
            curl -X POST https://api.rufkis.io/v1/workspace/sync \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              -d '{
                "workspace_id": "ws-sre-team-alpha",
                "changes": [
                  {
                    "type": "incident_update",
                    "incident_id": "inc-20260603-001",
                    "crdt_ops": [...],
                    "timestamp": "2026-06-03T02:20:00Z"
                  },
                  {
                    "type": "runbook_update",
                    "runbook_id": "rb-database-failover",
                    "crdt_ops": [...],
                    "timestamp": "2026-06-03T02:21:00Z"
                  }
                ],
                "last_sync_token": "sync-token-abc123"
              }'

  /workspace/sync/status:
    get:
      tags: [Workspace - Sync]
      summary: Get sync status
      operationId: getSyncStatus
      parameters:
        - name: workspace_id
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Sync status
          content:
            application/json:
              schema:
                type: object
                properties:
                  workspace_id:
                    type: string
                  pending_changes:
                    type: integer
                  last_sync:
                    type: string
                    format: date-time
                  sync_history:
                    type: array
                    items:
                      $ref: "#/components/schemas/SyncHistoryEntry"
                  connectivity:
                    type: string
                    enum: [online, offline, degraded]

  /workspace/sync/pause:
    post:
      tags: [Workspace - Sync]
      summary: Pause sync
      operationId: pauseSync
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                workspace_id:
                  type: string
      responses:
        "200":
          description: Sync paused

  /workspace/sync/resume:
    post:
      tags: [Workspace - Sync]
      summary: Resume sync
      operationId: resumeSync
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                workspace_id:
                  type: string
      responses:
        "200":
          description: Sync resumed

  # ============================================================================
  # WORKSPACE - P2P
  # ============================================================================
  /workspace/p2p/peers:
    get:
      tags: [Workspace - P2P]
      summary: List connected P2P peers
      operationId: listPeers
      parameters:
        - name: workspace_id
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: List of connected peers
          content:
            application/json:
              schema:
                type: object
                properties:
                  peers:
                    type: array
                    items:
                      $ref: "#/components/schemas/PeerInfo"

  /workspace/p2p/signal:
    post:
      tags: [Workspace - P2P]
      summary: Exchange WebRTC signaling data
      operationId: p2pSignal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                workspace_id:
                  type: string
                peer_id:
                  type: string
                signal_data:
                  type: object
                  description: WebRTC signaling payload (offer, answer, ICE candidate)
      responses:
        "200":
          description: Signaling data processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  signal_data:
                    type: object

  /workspace/p2p/sync-status:
    get:
      tags: [Workspace - P2P]
      summary: Get P2P sync status per peer
      operationId: getP2PSyncStatus
      parameters:
        - name: workspace_id
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: P2P sync status
          content:
            application/json:
              schema:
                type: object
                properties:
                  peers:
                    type: array
                    items:
                      type: object
                      properties:
                        peer_id:
                          type: string
                        peer_name:
                          type: string
                        connection_state:
                          type: string
                          enum: [connected, connecting, disconnected]
                        last_synced:
                          type: string
                          format: date-time
                        sync_lag_items:
                          type: integer

components:
  schemas:
    # ==========================================================================
    # COMMON
    # ==========================================================================
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, degraded]
        version:
          type: string
        uptime_seconds:
          type: integer
        services:
          type: object
          additionalProperties:
            type: string
            enum: [up, down, degraded]

    ErrorResponse:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          description: Error code
        message:
          type: string
          description: Human-readable error message
        details:
          type: object
          description: Additional error context
        request_id:
          type: string
          format: uuid

    # ==========================================================================
    # GITOPS - REMEDIATIONS
    # ==========================================================================
    CreateRemediationRequest:
      type: object
      required: [incident_id, runbook_id, environment]
      properties:
        incident_id:
          type: string
          description: Unique incident identifier
          example: inc-20260603-001
        runbook_id:
          type: string
          description: Runbook identifier to execute
          example: rb-database-failover
        environment:
          type: string
          enum: [production, staging, development]
          description: Target environment
        region:
          type: string
          description: Cloud region
          example: us-east-1
        variables:
          type: object
          description: Runbook template variables
          additionalProperties: true
          example:
            db_cluster: prod-db-01
            failover_target: us-east-1b

    RemediationResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        incident_id:
          type: string
        runbook_id:
          type: string
        environment:
          type: string
        region:
          type: string
        pr_url:
          type: string
          format: uri
          description: URL to the created Pull Request
        pr_number:
          type: integer
        repository:
          type: string
          description: Git repository path
        branch:
          type: string
          description: PR branch name
        status:
          type: string
          enum: [pending, approved, merged, rejected, rolled_back]
        created_by:
          type: string
          description: Agent or user who initiated the remediation
        created_at:
          type: string
          format: date-time
        merged_at:
          type: string
          format: date-time
        rollback_pr_url:
          type: string
          format: uri
        diff_summary:
          type: string
          description: Summary of changes in the PR
        policy_evaluation:
          $ref: "#/components/schemas/PolicyEvaluationResponse"

    AuditEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        incident_id:
          type: string
        remediation_id:
          type: string
          format: uuid
        action:
          type: string
          enum:
            - pr_created
            - pr_approved
            - pr_merged
            - pr_rejected
            - rollback_created
            - rollback_merged
        actor:
          type: string
          description: Who performed the action
        actor_type:
          type: string
          enum: [user, agent, system]
        timestamp:
          type: string
          format: date-time
        details:
          type: object
          additionalProperties: true
        git_commit_sha:
          type: string
        git_commit_message:
          type: string

    GitCommitInfo:
      type: object
      properties:
        commit_sha:
          type: string
        author:
          type: string
        committer:
          type: string
        message:
          type: string
        timestamp:
          type: string
          format: date-time
        files_changed:
          type: array
          items:
            type: string
        additions:
          type: integer
        deletions:
          type: integer

    # ==========================================================================
    # GITOPS - RUNBOOKS
    # ==========================================================================
    RunbookResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        version:
          type: string
        service:
          type: string
        severity:
          type: array
          items:
            type: string
            enum: [P0, P1, P2, P3, P4]
        environments:
          type: array
          items:
            type: string
            enum: [production, staging, development]
        trigger_conditions:
          type: object
          properties:
            metric:
              type: string
            operator:
              type: string
              enum: [gt, lt, gte, lte, eq]
            threshold:
              type: number
            duration_seconds:
              type: integer
        steps:
          type: array
          items:
            type: object
            properties:
              step_number:
                type: integer
              name:
                type: string
              action:
                type: string
              parameters:
                type: object
              rollback_step:
                type: string
        rollback_procedure:
          type: object
          properties:
            steps:
              type: array
              items:
                type: object
            estimated_time_seconds:
              type: integer
        approval_requirements:
          type: object
          properties:
            min_approvers:
              type: integer
            required_roles:
              type: array
              items:
                type: string
            auto_approve:
              type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        git_source:
          type: object
          properties:
            repository:
              type: string
            path:
              type: string
            commit_sha:
              type: string

    # ==========================================================================
    # GITOPS - POLICIES
    # ==========================================================================
    PolicyEvaluationRequest:
      type: object
      required: [pr_id, repository, branch]
      properties:
        pr_id:
          type: integer
        repository:
          type: string
        branch:
          type: string
        severity:
          type: string
          enum: [P0, P1, P2, P3, P4]
        service:
          type: string
        environment:
          type: string
          enum: [production, staging, development]
        changed_files:
          type: array
          items:
            type: string

    PolicyEvaluationResponse:
      type: object
      properties:
        passed:
          type: boolean
        required_approvers:
          type: array
          items:
            type: object
            properties:
              user_id:
                type: string
              role:
                type: string
              required:
                type: boolean
        policies_evaluated:
          type: array
          items:
            type: object
            properties:
              policy_id:
                type: string
              name:
                type: string
              result:
                type: string
                enum: [pass, fail, skip]
              message:
                type: string
        tags:
          type: array
          items:
            type: string
        summary:
          type: string

    # ==========================================================================
    # FINOPS - ANOMALIES
    # ==========================================================================
    AnomalyScanRequest:
      type: object
      properties:
        providers:
          type: array
          items:
            type: string
            enum: [aws, gcp, azure]
          default: ["aws", "gcp", "azure"]
        regions:
          type: array
          items:
            type: string
          description: List of cloud regions to scan
        baseline_days:
          type: integer
          default: 7
          minimum: 1
          maximum: 90
        threshold_std_dev:
          type: number
          default: 3
          minimum: 1
          maximum: 10

    AnomalyScanResponse:
      type: object
      properties:
        scan_id:
          type: string
          format: uuid
        anomalies_found:
          type: integer
        anomalies:
          type: array
          items:
            $ref: "#/components/schemas/AnomalyResponse"
        scan_completed_at:
          type: string
          format: date-time

    AnomalyResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        provider:
          type: string
          enum: [aws, gcp, azure]
        region:
          type: string
        service:
          type: string
        metric_name:
          type: string
        current_value:
          type: number
        baseline_mean:
          type: number
        baseline_std_dev:
          type: number
        z_score:
          type: number
        deviation_pct:
          type: number
          description: Percentage deviation from baseline
        severity:
          type: string
          enum: [critical, high, medium, low]
        status:
          type: string
          enum: [open, acknowledged, resolved, false_positive]
        detected_at:
          type: string
          format: date-time
        resource_ids:
          type: array
          items:
            type: string
        cost_impact_daily:
          type: number
          description: Estimated daily cost impact in USD

    # ==========================================================================
    # FINOPS - RECOMMENDATIONS
    # ==========================================================================
    RecommendationResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        provider:
          type: string
          enum: [aws, gcp, azure]
        region:
          type: string
        resource_id:
          type: string
        resource_type:
          type: string
          description: Type of resource (e.g., EC2, RDS, GCE, Blob Storage)
        current_cost_monthly:
          type: number
        recommended_action:
          type: string
          description: Description of the optimization action
        action_category:
          type: string
          enum:
            - right_sizing
            - reserved_instance
            - spot_instance
            - storage_tiering
            - unused_resource
            - commitment_discount
        projected_savings_monthly:
          type: number
        implementation_cost:
          type: number
          description: Estimated cost to implement the change
        roi_score:
          type: number
          minimum: 0
          maximum: 1
          description: ROI confidence score (0-1)
        roi_30day:
          type: number
          description: Projected 30-day savings
        roi_60day:
          type: number
          description: Projected 60-day savings
        roi_90day:
          type: number
          description: Projected 90-day savings
        complexity:
          type: string
          enum: [low, medium, high]
        status:
          type: string
          enum: [pending, implemented, dismissed]
        generated_at:
          type: string
          format: date-time

    # ==========================================================================
    # FINOPS - SHOWBACK
    # ==========================================================================
    ShowbackReport:
      type: object
      properties:
        id:
          type: string
          format: uuid
        team_id:
          type: string
        team_name:
          type: string
        billing_month:
          type: string
          pattern: "^\\d{4}-\\d{2}$"
        generated_at:
          type: string
          format: date-time
        total_cost:
          type: number
        cost_by_provider:
          type: object
          properties:
            aws:
              type: number
            gcp:
              type: number
            azure:
              type: number
        cost_by_region:
          type: object
          additionalProperties:
            type: number
        cost_by_service:
          type: object
          additionalProperties:
            type: number
        cost_trend:
          type: array
          items:
            type: object
            properties:
              month:
                type: string
              cost:
                type: number
        top_cost_drivers:
          type: array
          items:
            type: object
            properties:
              resource_id:
                type: string
              service:
                type: string
              cost:
                type: number
              pct_of_total:
                type: number

    # ==========================================================================
    # FINOPS - TRADEOFFS
    # ==========================================================================
    TradeoffDataPoint:
      type: object
      properties:
        service:
          type: string
        monthly_cost:
          type: number
        error_budget_burn_rate:
          type: number
          description: Current burn rate of error budget (0-1)
        slo_target:
          type: number
          description: Target SLO percentage (e.g., 99.9)
        current_sli:
          type: number
          description: Current SLI percentage
        quadrant:
          type: string
          enum: [under_funded, optimal, over_engineered, at_risk]
        cost_budget:
          type: number
        cost_variance_pct:
          type: number

    TradeoffConfig:
      type: object
      properties:
        service:
          type: string
        slo_target:
          type: number
          description: Target SLO as percentage (e.g., 99.9)
        cost_budget_monthly:
          type: number
        cost_budget_currency:
          type: string
          default: USD
        error_budget_period_days:
          type: integer
          default: 30
        risk_tolerance:
          type: string
          enum: [low, medium, high]
        tags:
          type: object
          additionalProperties:
            type: string

    # ==========================================================================
    # TRIAGE - CLASSIFICATION
    # ==========================================================================
    ClassifyIncidentRequest:
      type: object
      required: [alert_id, source, title, description]
      properties:
        alert_id:
          type: string
          description: Unique alert/incident identifier from the monitoring source
          example: alt-20260603-042
        source:
          type: string
          description: Monitoring source
          enum: [prometheus, datadog, grafana, cloudwatch, azure_monitor, webhook, manual]
        title:
          type: string
          maxLength: 500
          description: Alert title
        description:
          type: string
          maxLength: 5000
          description: Detailed alert description
        raw_payload:
          type: object
          description: Raw alert payload for deep analysis
          additionalProperties: true
        source_url:
          type: string
          format: uri
          description: Link to the original alert in the monitoring tool
        labels:
          type: object
          additionalProperties:
            type: string
          description: Alert labels/tags

    ClassificationResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        alert_id:
          type: string
        severity:
          type: string
          enum: [P0, P1, P2, P3, P4]
        severity_confidence:
          type: number
          minimum: 0
          maximum: 1
        severity_rationale:
          type: string
        assigned_team:
          type: string
        assigned_team_confidence:
          type: number
          minimum: 0
          maximum: 1
        alternative_teams:
          type: array
          items:
            type: object
            properties:
              team:
                type: string
              confidence:
                type: number
        suggested_runbooks:
          type: array
          items:
            type: string
        classification_model:
          type: string
          description: Model version used for classification
        classified_at:
          type: string
          format: date-time
        processing_time_ms:
          type: integer

    # ==========================================================================
    # TRIAGE - RCA
    # ==========================================================================
    RCAResponse:
      type: object
      properties:
        incident_id:
          type: string
        analysis_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [running, completed, failed]
        root_causes:
          type: array
          items:
            type: object
            properties:
              rank:
                type: integer
              title:
                type: string
              description:
                type: string
              confidence:
                type: number
                minimum: 0
                maximum: 1
              evidence:
                type: array
                items:
                  type: object
                  properties:
                    source:
                      type: string
                      enum: [logs, metrics, traces, git_changes, config]
                    snippet:
                      type: string
                    timestamp:
                      type: string
                      format: date-time
                    severity:
                      type: string
              suggested_remediation:
                type: string
              related_runbooks:
                type: array
                items:
                  type: string
        analysis_metadata:
          type: object
          properties:
            context_window_minutes:
              type: integer
            sources_analyzed:
              type: array
              items:
                type: string
            log_lines_analyzed:
              type: integer
            trace_spans_analyzed:
              type: integer
            changes_reviewed:
              type: integer
            processing_time_ms:
              type: integer
            model_version:
              type: string

    # ==========================================================================
    # TRIAGE - SELF-HEALING
    # ==========================================================================
    SelfHealingResponse:
      type: object
      properties:
        execution_id:
          type: string
          format: uuid
        incident_id:
          type: string
        status:
          type: string
          enum: [dry_run_completed, executing, completed, failed, requires_approval]
        runbook_id:
          type: string
        match_confidence:
          type: number
          minimum: 0
          maximum: 1
        dry_run_results:
          type: object
          properties:
            passed:
              type: boolean
            steps_executed:
              type: integer
            steps_failed:
              type: integer
            details:
              type: array
              items:
                type: object
        remediation_pr:
          $ref: "#/components/schemas/RemediationResponse"
        rollback_plan:
          type: object
          properties:
            steps:
              type: array
              items:
                type: object
            estimated_time_seconds:
              type: integer
        timeline_entries:
          type: array
          items:
            type: object
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time

    # ==========================================================================
    # TRIAGE - ESCALATION
    # ==========================================================================
    EscalationResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        incident_id:
          type: string
        tier:
          type: integer
        status:
          type: string
          enum: [paging, acknowledged, timeout, escalated, resolved]
        paged_users:
          type: array
          items:
            type: object
            properties:
              user_id:
                type: string
              name:
                type: string
              role:
                type: string
              channel:
                type: string
              acknowledged_at:
                type: string
                format: date-time
        reason:
          type: string
        incident_context:
          type: object
          properties:
            classification:
              $ref: "#/components/schemas/ClassificationResponse"
            rca:
              $ref: "#/components/schemas/RCAResponse"
            suggested_steps:
              type: array
              items:
                type: string
        created_at:
          type: string
          format: date-time
        acknowledged_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time

    # ==========================================================================
    # WORKSPACE - SYNC
    # ==========================================================================
    SyncRequest:
      type: object
      required: [workspace_id, changes]
      properties:
        workspace_id:
          type: string
          description: Unique workspace identifier
        changes:
          type: array
          items:
            $ref: "#/components/schemas/SyncChange"
        last_sync_token:
          type: string
          description: Token from last sync for incremental sync

    SyncChange:
      type: object
      properties:
        type:
          type: string
          enum: [incident_update, runbook_update, config_update, annotation]
        incident_id:
          type: string
        runbook_id:
          type: string
        crdt_ops:
          type: array
          description: CRDT operations (Y.js format)
          items:
            type: object
        timestamp:
          type: string
          format: date-time
        priority:
          type: integer
          description: Lower number = higher priority (1=highest)

    SyncResponse:
      type: object
      properties:
        sync_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [syncing, completed, partially_completed, failed]
        changes_accepted:
          type: integer
        changes_rejected:
          type: integer
        sync_token:
          type: string
          description: Token for next incremental sync
        conflicts:
          type: array
          items:
            type: object
            properties:
              change_id:
                type: string
              conflict_type:
                type: string
              resolution:
                type: string

    SyncHistoryEntry:
      type: object
      properties:
        sync_id:
          type: string
          format: uuid
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        changes_count:
          type: integer
        status:
          type: string
          enum: [completed, partially_completed, failed]
        bytes_transferred:
          type: integer

    # ==========================================================================
    # WORKSPACE - P2P
    # ==========================================================================
    PeerInfo:
      type: object
      properties:
        peer_id:
          type: string
        peer_name:
          type: string
        connection_state:
          type: string
          enum: [connected, connecting, disconnected]
        connected_at:
          type: string
          format: date-time
        last_heartbeat:
          type: string
          format: date-time
        capabilities:
          type: array
          items:
            type: string
          description: Peer capabilities (e.g., runbook_editor, dashboard)
        region:
          type: string
