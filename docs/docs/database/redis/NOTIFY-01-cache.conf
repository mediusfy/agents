

# ============================================================================
# Redis Configuration — NOTIFY-01 Notification Cache
# Bounded Context: NotificationIngestion
# ============================================================================
#
# This cache stores recently created notification records to serve
# fast GET lookups by ID, reducing load on PostgreSQL for read-heavy
# scenarios (e.g., polling clients, dashboard widgets).
#
# Cache Invalidation Strategy:
#   - TTL-based expiry: 5 minutes
#   - On notification creation (POST /api/notify), the response includes
#     the ID, and the handler may optionally SET the cache.
#   - On any UPDATE to notification status, the cache entry is DELETED
#     to ensure consistency.
#
# Key Pattern:
#   notification:{id}   — e.g., "notification:a1b2c3d4-...-e5f6"
#
# Value Format:
#   JSON serialization of the notification record:
#   {
#     "id": "uuid",
#     "message": "string",
#     "priority": "low|medium|high",
#     "source": "string|null",
#     "status": "string",
#     "submittedAt": "ISO-8601",
#     "createdAt": "ISO-8601",
#     "updatedAt": "ISO-8601"
#   }
# ============================================================================

# Memory limits
maxmemory 128mb
maxmemory-policy allkeys-lru

# Persistence (RDB snapshot for recovery — AOF unnecessary for cache tier)
save 300 1
save 60 100
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename notify-cache.rdb
dir /data/redis/notify

# TTL-based key expiration
# Each notification key is set with EXPIRE 300 (5 min)

# Performance tuning
tcp-keepalive 60
timeout 30
lfu-log-factor 10
lfu-decay-time 1

# Max client connections
maxclients 1000

# Slow log
slowlog-log-slower-than 10000
slowlog-max-len 128
