# =============================================================================
# Redis Configuration: GITOPS-04 Policy Engine Cache
# =============================================================================
# This Redis instance serves as a caching layer for the Policy-as-Code engine.
# It caches:
#   1. Active policy rules (from git sync) - reduces DB load on evaluation
#   2. Recent PR evaluations - avoid re-evaluating unchanged PRs
#   3. Approval gate status - fast lookups for CI/CD pipeline
#   4. Rate limiting for policy evaluation requests
# =============================================================================

# --- Memory Management ---
maxmemory 512mb
maxmemory-policy allkeys-lru
maxmemory-samples 10

# --- Persistence ---
# Use RDB snapshots only (no AOF) since this is a cache that can be rebuilt
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename policy-engine-cache.rdb
dir /data/redis

# --- Security ---
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command CONFIG ""
rename-command DEBUG ""
requirepass ${REDIS_PASSWORD}

# --- Networking ---
bind 0.0.0.0
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# --- Key Expiry & Eviction ---
# Default TTL applied at the application layer, but set a global maxmemory policy
# for safety. Keys should be set with appropriate EXPIRE by the application.

# --- Key Naming Conventions ---
# Policy rules cache:
#   policy:rules:all                  -> Set of all active rule IDs
#   policy:rule:{slug}                -> Individual rule details (JSON)
#   policy:rules:env:{environment}    -> Rules matching an environment (Set)
#   policy:rules:service:{service}    -> Rules matching a service (Set)
#   policy:rules:severity:{severity}  -> Rules matching a severity (Set)
#
# Evaluation cache:
#   eval:{vendor}:{repo}:{pr}         -> Recent evaluation result (TTL: 5 min)
#   eval:recent                        -> Sorted set of recent evaluations
#
# Approval gate cache:
#   gate:{vendor}:{repo}:{pr}         -> Current gate status (TTL: 30 min)
#   gate:pending                       -> Set of pending gates for monitoring
#
# Rate limiting:
#   ratelimit:eval:{client_ip}         -> Rate limit counter (TTL: 1 min)
#   ratelimit:eval:{client_ip}:window  -> Rate limit window tracking

# --- Advanced Configuration ---
lfu-log-factor 10
lfu-decay-time 1

# --- Logging ---
loglevel notice
logfile /var/log/redis/policy-engine.log
syslog-enabled no

# --- Client Output Buffering ---
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# --- Lazy Freeing ---
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes

# --- Keyspace Events (for pub/sub notifications) ---
# Enable keyspace events for key expiry notifications
notify-keyspace-events "Ex"

# --- Active Defragmentation ---
activedefrag yes
active-defrag-threshold-lower 10
active-defrag-threshold-upper 100
active-defrag-cycle-min 1
active-defrag-cycle-max 25

# --- Cluster Mode (disabled for standalone) ---
# cluster-enabled no
# cluster-config-file nodes.conf
