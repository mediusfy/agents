# =============================================================================
# Redis Cache Configuration — CLUSTERCONNECT-02
# Unified Cluster List with Connection Status Indicators
# =============================================================================

# This Redis instance serves as a high-speed read cache for the unified cluster
# list endpoint. It caches the aggregated cluster list with connection status
# indicators to reduce load on the primary PostgreSQL database.

# --- Memory Management ---
maxmemory 512mb
maxmemory-policy allkeys-lru

# --- Persistence ---
appendonly yes
appendfsync everysec

# --- Networking ---
bind 0.0.0.0
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# --- Security ---
# Rename dangerous commands for production
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command CONFIG ""

# --- Key Expiry Defaults ---
# Default TTL for cluster list cache entries (in seconds)
# 60s = fresh data; the health-check scheduler writes new statuses every 5m
# The cache is invalidated on status transitions via the application layer

# --- Cache Key Conventions ---
# cluster:list:all          -> Full cluster list (sorted JSON)
# cluster:list:{status}     -> Filtered list by status (e.g. CONNECTED, DEGRADED)
# cluster:{id}:detail       -> Single cluster detail with latest health
# cluster:{id}:health:recent -> Recent health checks for a cluster
# cluster:stats:status      -> Aggregated status counts (e.g. 5 CONNECTED, 2 DEGRADED...)
# cluster:hash:by-slug      -> Hash map slug -> cluster ID for fast lookups

# --- Slow Log ---
slowlog-log-slower-than 10000
slowlog-max-len 128

# --- Client Output Buffer ---
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# --- Advanced Config ---
activerehashing yes
hz 10
