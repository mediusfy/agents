

# Redis Cache Configuration for Board View (BOARD-01)
# 
# This configuration optimizes caching for the monday.com-style board view
# for Kubernetes resources. The caching strategy focuses on:
#   1. Board layout/definition caching (low churn, high read frequency)
#   2. Group membership (item list per group) with pagination
#   3. Column value aggregations (status counts, numeric summaries)
#   4. Item detail lookups

# =============================================================================
# GENERAL REDIS SETTINGS
# =============================================================================
maxmemory 512mb
maxmemory-policy allkeys-lru
appendonly yes
appendfsync everysec
activerehashing yes

# =============================================================================
# BOARD VIEW CACHE KEY NAMESPACES
# =============================================================================
# 
# Key Prefix Convention:
#   board:{board_id}:              Board layout & metadata
#   board:{board_id}:groups        Ordered list of groups for a board
#   board:{board_id}:columns       Ordered list of columns for a board
#   board:{board_id}:group:{group_id}:items  Items in a group (sorted set)
#   board:{board_id}:item:{item_id}          Single item with all column values
#   board:{board_id}:status_counts           Aggregated status counts per group
#

# =============================================================================
# CACHE TTL CONFIGURATIONS (seconds)
# =============================================================================

# Board layout (structure, columns, groups) - low churn, cache long
# TTL: 300 seconds (5 minutes) - updated when user modifies board structure
# Invalidation: on board structure mutation (add/remove/reorder columns/groups)

# Group item lists - higher churn as K8s resources update
# TTL: 60 seconds (1 minute) - refreshed periodically
# Invalidation: on resource state changes via watch events

# Individual item details - highest churn
# TTL: 30 seconds - reflects near-real-time K8s state
# Invalidation: on resource update events

# Status/aggregation counts
# TTL: 30 seconds - computed from item states
# Invalidation: on any item state change within the board

# =============================================================================
# REDIS COMMAND PATTERNS FOR BOARD VIEW
# =============================================================================
#
# SET board:{board_id} '{"id":"...","name":"Cluster Overview","filter_config":{...}}' EX 300
# LRANGE board:{board_id}:groups 0 -1
# LRANGE board:{board_id}:columns 0 -1
# ZRANGE board:{board_id}:group:{group_id}:items 0 49 BYSCORE
# GET board:{board_id}:item:{item_id}
# ZCARD board:{board_id}:group:{group_id}:items    -- count items in group
# ZCOUNT board:{board_id}:group:{group_id}:items 0 +inf -- count with filter

# =============================================================================
# PUB/SUB CHANNELS (for cache invalidation)
# =============================================================================
#
# Channel: board:{board_id}:invalidate
#   - Published when board structure changes
#   - Subscribers clear their cached board layout data
#
# Channel: board:{board_id}:items:update
#   - Published when board items change (K8s resource updates)
#   - Subscribers refresh item list caches
