# =============================================================================
# Redis Cache Configuration for CLUSTER-02: Cluster Health Monitoring
# =============================================================================
# This config extends the baseline clusterconnect-cache.conf from CLUSTER-01,
# adding caching layers for live health status, heartbeat data, and
# certificate expiry information.

# --- Memory & Eviction Policy ---
maxmemory 512mb
maxmemory-policy allkeys-lru

# --- Persistence ---
appendonly yes
appendfsync everysec

# --- Connection ---
timeout 300
tcp-keepalive 60

# --- Cluster Health Status Cache (TTL: 10 seconds) ---
# Powers the dashboard's live health indicator.
# Key format: cluster:health:{cluster_id}
# Value: JSON object with current health_status, is_reachable, latency, etc.
# TTL of 10s means the dashboard polls and gets updated data quickly.
# 
# Example:
#   SET cluster:health:a1b2c3d4 '{"status":"healthy","reachable":true,"latency_ms":42,"last_seen":"2026-06-02T19:00:00Z"}' EX 10

# --- Cluster Heartbeat Cache (TTL: 30 seconds) ---
# Caches the most recent heartbeat for each cluster.
# Key format: cluster:heartbeat:{cluster_id}
# Value: JSON object with agent_version, node_count, pod_count, cpu/mem usage
#
# Example:
#   SET cluster:heartbeat:a1b2c3d4 '{"agent":"rufkis-agent/1.2.3","nodes":5,"pods":42,"cpu":34.5,"mem":55.2}' EX 30

# --- Health Score Cache (TTL: 60 seconds) ---
# Pre-computed health scores for dashboard display.
# Key format: cluster:healthscore:{cluster_id}:{window}
# Window options: 5m, 15m, 1h, 24h
#
# Example:
#   SET cluster:healthscore:a1b2c3d4:5m '{"uptime":99.87,"avg_latency":45,"checks":120,"failures":1}' EX 60

# --- Certificate Expiry Cache (TTL: 300 seconds) ---
# Cached certificate status to avoid repeated DB queries.
# Key format: cluster:cert:{cluster_id}
# Value: JSON with expiry dates and severity
#
# Example:
#   SET cluster:cert:a1b2c3d4 '{"status":"valid","expires_at":"2026-09-01T00:00:00Z","days_left":91,"severity":"info"}' EX 300

# --- Global Health Dashboard Cache (TTL: 15 seconds) ---
# Aggregated view of all cluster health statuses.
# Key format: dashboard:health
# Value: JSON array of all cluster status summaries
#
# Example:
#   SET dashboard:health '[{"id":"a1b2c3d4","name":"prod-us-east","status":"healthy","latency":42},{"id":"e5f6g7h8","name":"staging-eu-west","status":"degraded","latency":230}]' EX 15

# --- Health Check Config Cache (TTL: 300 seconds) ---
# Cached check configurations to avoid DB lookups during health checks.
# Key format: cluster:checkconfig:{cluster_id}
# Value: JSON array of check configurations
#
# Example:
#   SET cluster:checkconfig:a1b2c3d4 '[{"protocol":"https","endpoint":"https://api.cluster.example.com","port":443,"interval":30,"timeout":5000}]' EX 300

# --- Cluster Health Summary Sorted Set ---
# Used for leaderboard-style queries (healthiest/unhealthiest clusters).
# Key: cluster:health:by:status
# Members: cluster_id, Score: 0=healthy, 1=degraded, 2=unhealthy, 3=unknown
#
# Example:
#   ZADD cluster:health:by:status 0 a1b2c3d4
#   ZADD cluster:health:by:status 2 e5f6g7h8
#   ZRANGE cluster:health:by:status 0 3  -> returns unhealthy clusters first

# --- Cluster Health Event Stream ---
# Pub/Sub channel for real-time health status changes.
# Channel: cluster:health:events
# Payload: JSON with cluster_id, old_status, new_status, timestamp
#
# Publishing:
#   PUBLISH cluster:health:events '{"cluster_id":"a1b2c3d4","from":"healthy","to":"degraded","at":"2026-06-02T19:00:00Z"}'
#
# Subscribing (dashboard WebSocket):
#   SUBSCRIBE cluster:health:events

# =============================================================================
# Cache Key Convention & TTL Summary
# =============================================================================
# | Prefix                    | TTL    | Purpose                             |
# |---------------------------|--------|-------------------------------------|
# | cluster:health:{id}       | 10s    | Live health indicator               |
# | cluster:heartbeat:{id}    | 30s    | Latest heartbeat telemetry          |
# | cluster:healthscore:{id}  | 60s    | Aggregated health scores            |
# | cluster:cert:{id}         | 300s   | Certificate expiry info             |
# | dashboard:health          | 15s    | Global health dashboard             |
# | cluster:checkconfig:{id}  | 300s   | Health check configurations         |
# | cluster:health:by:status  | N/A    | Sorted set of all clusters by status|
# =============================================================================
