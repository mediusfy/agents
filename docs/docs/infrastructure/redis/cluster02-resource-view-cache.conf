# Redis Configuration: cluster02-resource-view-cache.conf
# CLUSTER-02: Unified Cross-Cluster Resource View
#
# Purpose: In-memory cache for aggregated resource views, reducing read load
# on PostgreSQL materialized views and resource tables.
#
# Cache Layers:
#   1. Resource List Cache (TTL: 30s) - Paginated resource listings with filters
#   2. Resource Detail Cache (TTL: 60s) - Individual resource details
#   3. Materialized View Cache (TTL: 120s) - Pre-computed aggregation summaries
#   4. Label Index Cache (TTL: 300s) - Label-based lookup results
#   5. Namespace Cache (TTL: 120s) - Namespace listings per cluster

# ============================================================================
# General Configuration
# ============================================================================
port 6380                          # Use non-standard port to differentiate from app cache
bind 127.0.0.1
daemonize no
loglevel notice
logfile /var/log/redis/cluster02-resource-view.log

# ============================================================================
# Memory & Eviction
# ============================================================================
maxmemory 512mb
maxmemory-policy allkeys-lru       # LRU eviction since we cache computed results
maxmemory-samples 10

# ============================================================================
# Persistence (minimal - cache is ephemeral, reconstructible from DB)
# ============================================================================
save ""                            # No RDB snapshots - this is a disposable cache
appendonly no                      # No AOF - data is always reconstructible

# ============================================================================
# Performance Tuning
# ============================================================================
io-threads 4
io-threads-do-reads yes
tcp-backlog 511
timeout 300
tcp-keepalive 300

# ============================================================================
# Key Design Conventions
# ============================================================================
# Key patterns used by the application:
#
#   resource:list:{cluster_id}:{kind}:{namespace_id}:{hash_of_filters}
#     - Cached paginated resource listings
#     - TTL: 30 seconds
#
#   resource:detail:{resource_id}
#     - Cached individual resource with labels, annotations, conditions
#     - TTL: 60 seconds
#
#   resource:summary:{cluster_id}
#     - Cross-cluster resource summary (cached matview data)
#     - TTL: 120 seconds
#
#   resource:namespace:{cluster_id}
#     - Namespace list per cluster
#     - TTL: 120 seconds
#
#   resource:label-index:{label_key}:{label_value_hash}
#     - Pre-computed label query results
#     - TTL: 300 seconds
#
#   resource:search:{search_term_hash}:{filters_hash}
#     - Full-text search results cache
#     - TTL: 60 seconds
#
#   resource:stats:global
#     - Global cross-cluster statistics
#     - TTL: 120 seconds

# ============================================================================
# Notifications (for cache invalidation)
# ============================================================================
notify-keyspace-events "gx"        # Enable generic events and expired key events

# ============================================================================
# Client Configuration
# ============================================================================
maxclients 10000
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit pubsub 32mb 8mb 60
