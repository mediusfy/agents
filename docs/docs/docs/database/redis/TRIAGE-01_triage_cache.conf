

# Redis configuration for TRIAGE-01: AI-Powered Incident Triage Cache
#
# This Redis instance is used to cache:
# 1. Service topology graph (services + dependencies) for fast lookup by the triage agent
# 2. Recent classification history by service for pattern matching
# 3. Confidence statistics by severity for monitoring

# Memory limits
maxmemory 512mb
maxmemory-policy allkeys-lru

# Persistence — we can afford some loss on cache data since it's rebuilt from Postgres
appendonly yes
appendfsync everysec

# Performance
io-threads 4
io-threads-do-reads yes

# Connection
timeout 300
tcp-keepalive 60

# Notifications (keyspace events needed for cache invalidation listeners)
notify-keyspace-events KEA

# Security
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command DEBUG ""

# Keys naming convention:
# triage:topology:services          -> Hash  {service_id -> service_json}
# triage:topology:deps:{service_id} -> Set   [dependent_service_ids]
# triage:classifications:recent:{service_id} -> SortedSet (score=timestamp, member=classification_json)
# triage:confidence:stats:{severity} -> Hash  {avg_confidence, count, low_conf_count}
# triage:incident:{incident_id}     -> String (full incident+classification summary, TTL 24h)
