# FINOPS-01: Redis Configuration for Cost Anomaly Detection
# ==========================================================================
# This config supports:
#   1. Dedup cache - TTL-based deduplication keys for 1-hour anomaly suppression
#   2. Dashboard fan-out - Pub/Sub channels for real-time SRE dashboard updates
#   3. Rate limiting - Throttle telemetry ingestion per provider/region
#   4. Ad-hoc caching - Baseline lookups, recent anomaly queries
# ==========================================================================

# --- Memory Management ---
maxmemory 512mb
maxmemory-policy allkeys-lru
maxmemory-samples 10

# --- Persistence ---
appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# --- Networking ---
bind 0.0.0.0
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# --- Security ---
# Require authentication in production
# requirepass finops-redis-prod-<random>

# --- Keyspace Notifications (for Pub/Sub) ---
notify-keyspace-events Kxgs

# --- Connection Management ---
maxclients 10000
maxmemory-clients 5%

# --- Slow Log ---
slowlog-log-slower-than 10000
slowlog-max-len 128

# --- Eviction Policy Details ---
# allkeys-lru: evicts least recently used keys when memory is full
# This is appropriate since all cached data is recomputable from PostgreSQL

# ==========================================================================
# KEY NAMESPACE CONVENTIONS
# ==========================================================================
#
# Dedup Cache (TTL: 3600s = 1 hour)
#   finops:dedup:<fingerprint>          -> anomaly_id (SET on first detect, EXPIRE 3600)
#   finops:dedup:<fingerprint>:count    -> duplicate_count (INCR on duplicates)
#
# Baseline Cache (TTL: 300s = 5 minutes)
#   finops:baseline:<provider>:<region>:<service>:<metric> -> JSON of baseline stats
#
# Anomaly Cache (TTL: 3600s = 1 hour)
#   finops:anomaly:recent                -> ZSET of recent anomaly IDs (score = detected_at timestamp)
#   finops:anomaly:recent:by_region:<zone> -> ZSET per residency zone
#
# Rate Limiting (TTL: 60s sliding window)
#   finops:ratelimit:<provider>:<region> -> counter (INCR, EXPIRE 60)
#
# Pub/Sub Channels
#   finops:channel:anomaly:new           -> Published when a new anomaly is detected
#   finops:channel:anomaly:suppressed    -> Published when a duplicate is suppressed
#   finops:channel:telemetry:ingested    -> Published when raw telemetry is ingested
#   finops:channel:baseline:updated      -> Published when a baseline is refreshed
#   finops:channel:dashboard:sre:<team>  -> Per-team SRE dashboard channel

# ==========================================================================
# APPLICATION-SIDE LUA SCRIPTS (registered at startup)
# ==========================================================================
#
# Script 1: finops_dedup_check
# Checks if a fingerprint exists (within TTL) and either returns existing
# anomaly_id or sets a new key with the given anomaly_id.
#
# KEYS[1] = dedup key (finops:dedup:<fingerprint>)
# KEYS[2] = dedup count key (finops:dedup:<fingerprint>:count)
# ARGV[1] = anomaly_id
# ARGV[2] = ttl_seconds (3600)
#
# Returns: 0 if new (first seen), existing anomaly_id if duplicate
# EVALSHA <script_sha> 2 finops:dedup:abc123 finops:dedup:abc123:count new_anomaly_uuid 3600
#
# Script 2: finops_baseline_get_or_refresh
# Gets cached baseline or signals a refresh if stale/missing.
# KEYS[1] = baseline cache key
# ARGV[1] = provider|region|service|metric
# ARGV[2] = max_age_seconds (300)
# Returns: cached JSON or null (trigger recompute)
