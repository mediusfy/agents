openapi: "3.1.0"
info:
  title: Rufkis SRE Platform API
  description: |
    The Rufkis SRE Platform API provides programmatic access to incident management,
    runbook automation, GitOps-native remediation, automated FinOps ROI analysis,
    autonomous agent triage, policy enforcement, and local-first SRE workspace management.

    ## Core Themes

    - **GitOps-Native Remediation**: Declarative remediation pipelines managed via Git repositories.
    - **Automated FinOps ROI**: Real-time cost analytics, savings recommendations, and report generation.
    - **Autonomous Agent Triage**: AI-driven incident triage with escalation recommendations.
    - **Local-First SRE Workspace**: Offline-capable workspace config, plugins, and sync management.

    ## Authentication

    All API requests require a Bearer token passed via the `Authorization` header.
    Tokens are issued per workspace and scoped to specific permissions.

    ## Rate Limiting

    The API enforces rate limits per authentication token.
    Rate limit headers are returned with every response.
  version: "1.0.0"
  contact:
    name: Rufkis SRE Platform Team
    email: sre-platform@rufkis.io
    url: https://docs.rufkis.io
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://api.rufkis.io
    description: Production server
  - url: https://api.staging.rufkis.io
    description: Staging server

security:
  - bearerAuth: []

paths:
  # ============================================================================
  # INCIDENTS
  # ============================================================================
  /api/v1/incidents:
    get:
      tags:
        - Incidents
      summary: List all incidents
      description: |
        Returns a paginated list of incidents filtered by the provided query parameters.
        Supports filtering by status, severity, assignee, and time range.
      operationId: incidents_list
      parameters:
        - name: status
          in: query
          description: Filter by incident status
          required: false
          schema:
            type: string
            enum:
              - open
              - acknowledged
              - investigating
              - resolved
              - closed
        - name: severity
          in: query
          description: Filter by severity level
          required: false
          schema:
            type: string
            enum:
              - critical
              - major
              - minor
              - warning
              - info
        - name: assignee_id
          in: query
          description: Filter by assignee user ID
          required: false
          schema:
            type: string
            format: uuid
        - name: runbook_id
          in: query
          description: Filter by associated runbook ID
          required: false
          schema:
            type: string
            format: uuid
        - name: created_after
          in: query
          description: Filter incidents created after this timestamp (ISO 8601)
          required: false
          schema:
            type: string
            format: date-time
        - name: created_before
          in: query
          description: Filter incidents created before this timestamp (ISO 8601)
          required: false
          schema:
            type: string
            format: date-time
        - name: search
          in: query
          description: Full-text search across title and description
          required: false
          schema:
            type: string
        - name: page
          in: query
          description: Page number (1-indexed)
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          description: Number of items per page
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: A paginated list of incidents
          headers:
            X-RateLimit-Remaining:
              schema:
                type: integer
              description: Remaining API requests in the current rate limit window
            X-RateLimit-Reset:
              schema:
                type: integer
              description: Unix timestamp when the rate limit resets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags:
        - Incidents
      summary: Create a new incident
      description: |
        Creates a new incident record. The incident will be automatically
        evaluated against active policies and may trigger automated runbooks
        or triage workflows.
      operationId: incidents_create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncidentCreateRequest"
      responses:
        "201":
          description: The created incident
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Incident"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/incidents/{incident_id}:
    get:
      tags:
        - Incidents
      summary: Get an incident by ID
      description: Returns the full incident details including timeline events and notes.
      operationId: incidents_get
      parameters:
        - name: incident_id
          in: path
          required: true
          description: The unique identifier of the incident
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Incident details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Incident"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalServerError"
    patch:
      tags:
        - Incidents
      summary: Update an incident
      description: |
        Partially updates an incident. Fields not provided in the request body
        will remain unchanged. Use this to acknowledge, update status, reassign,
        or change severity.
      operationId: incidents_update
      parameters:
        - name: incident_id
          in: path
          required: true
          description: The unique identifier of the incident
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentUpdateRequest"
      responses:
        "200":
          description: The updated incident
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Incident"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/incidents/{incident_id}/notes:
    get:
      tags:
        - Incidents
      summary: List incident notes
      description: Returns all notes attached to an incident in chronological order.
      operationId: incidents_list_notes
      parameters:
        - name: incident_id
          in: path
          required: true
          description: The unique identifier of the incident
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: A list of incident notes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IncidentNote"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags:
        - Incidents
      summary: Add a note to an incident
      description: Appends a new note to the incident's timeline.
      operationId: incidents_create_note
      parameters:
        - name: incident_id
          in: path
          required: true
          description: The unique identifier of the incident
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncidentNoteCreateRequest"
      responses:
        "201":
          description: The created note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentNote"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/incidents/{incident_id}/triage:
    post:
      tags:
        - Incidents
        - Triage
      summary: Trigger autonomous triage on an incident
      description: |
        Triggers the autonomous agent triage engine for the specified incident.
        The agent will analyze the incident context, correlate with historical
        data, and produce recommendations for severity, assignee, runbook
        attachment, and suggested remediation steps.
      operationId: incidents_trigger_triage
      parameters:
        - name: incident_id
          in: path
          required: true
          description: The unique identifier of the incident to triage
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TriageTriggerRequest"
      responses:
        "200":
          description: Triage analysis completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriageResult"
        "202":
          description: Triage request accepted and is being processed asynchronously
          content:
            application/json:
              schema:
                type: object
                properties:
                  triage_id:
                    type: string
                    format: uuid
                    description: The ID of the queued triage analysis
                  status:
                    type: string
                    enum:
                      - queued
                      - processing
                    description: Current processing status
                required:
                  - triage_id
                  - status
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # ============================================================================
  # RUNBOOKS
  # ============================================================================
  /api/v1/runbooks:
    get:
      tags:
        - Runbooks
      summary: List all runbooks
      description: Returns a paginated list of runbooks with optional filtering.
      operationId: runbooks_list
      parameters:
        - name: status
          in: query
          description: Filter by runbook status
          required: false
          schema:
            type: string
            enum:
              - active
              - draft
              - archived
        - name: category
          in: query
          description: Filter by runbook category
          required: false
          schema:
            type: string
        - name: search
          in: query
          description: Full-text search across name and description
          required: false
          schema:
            type: string
        - name: page
          in: query
          description: Page number (1-indexed)
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          description: Number of items per page
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: A paginated list of runbooks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunbookListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags:
        - Runbooks
      summary: Create a new runbook
      description: |
        Creates a new runbook. Runbooks define automated response procedures
        that can be triggered manually or automatically by policies.
      operationId: runbooks_create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunbookCreateRequest"
      responses:
        "201":
          description: The created runbook
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Runbook"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/runbooks/{runbook_id}:
    get:
      tags:
        - Runbooks
      summary: Get a runbook by ID
      description: Returns the full runbook definition including all steps.
      operationId: runbooks_get
      parameters:
        - name: runbook_id
          in: path
          required: true
          description: The unique identifier of the runbook
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Runbook details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Runbook"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalServerError"
    put:
      tags:
        - Runbooks
      summary: Update a runbook
      description: Fully replaces a runbook definition. All steps must be provided.
      operationId: runbooks_update
      parameters:
        - name: runbook_id
          in: path
          required: true
          description: The unique identifier of the runbook
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunbookUpdateRequest"
      responses:
        "200":
          description: The updated runbook
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Runbook"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags:
        - Runbooks
      summary: Delete a runbook
      description: Permanently deletes a runbook. Cannot be undone.
      operationId: runbooks_delete
      parameters:
        - name: runbook_id
          in: path
          required: true
          description: The unique identifier of the runbook
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Runbook deleted successfully
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/runbooks/{runbook_id}/execute:
    post:
      tags:
        - Runbooks
      summary: Execute a runbook
      description: |
        Triggers immediate execution of a runbook. If the runbook requires
        input parameters, they must be provided in the request body.
      operationId: runbooks_execute
      parameters:
        - name: runbook_id
          in: path
          required: true
          description: The unique identifier of the runbook to execute
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                incident_id:
                  type: string
                  format: uuid
                  description: Associate this execution with an incident
                parameters:
                  type: object
                  description: Runbook input parameters (varies per runbook)
                  example:
                    target_service: api-gateway
                    region: us-east-1
                reason:
                  type: string
                  description: Human-readable reason for execution
                  example: "Auto-remediation of elevated error rate"
      responses:
        "200":
          description: Runbook execution completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunbookExecution"
        "202":
          description: Runbook execution accepted and is running asynchronously
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunbookExecution"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/runbooks/{runbook_id}/history:
    get:
      tags:
        - Runbooks
      summary: Get runbook execution history
      description: Returns a paginated list of past executions for a runbook.
      operationId: runbooks_list_executions
      parameters:
        - name: runbook_id
          in: path
          required: true
          description: The unique identifier of the runbook
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          description: Filter by execution status
          required: false
          schema:
            type: string
            enum:
              - pending
              - running
              - succeeded
              - failed
              - cancelled
        - name: page
          in: query
          description: Page number (1-indexed)
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          description: Number of items per page
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: A paginated list of runbook executions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunbookExecutionListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # ============================================================================
  # REMEDIATIONS
  # ============================================================================
  /api/v1/remediations:
    get:
      tags:
        - Remediations
      summary: List all remediations
      description: |
        Returns a paginated list of remediation definitions.
        Remediations are GitOps-native, declarative pipelines stored as code.
      operationId: remediations_list
      parameters:
        - name: status
          in: query
          description: Filter by remediation status
          required: false
          schema:
            type: string
            enum:
              - active
              - inactive
              - draft
              - deprecated
        - name: source_repo
          in: query
          description: Filter by Git source repository URL
          required: false
          schema:
            type: string
        - name: page
          in: query
          description: Page number (1-indexed)
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          description: Number of items per page
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: A paginated list of remediations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemediationListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags:
        - Remediations
      summary: Create a new remediation
      description: |
        Creates a new remediation definition. Remediations are GitOps-native;
        the specification can reference a Git repository for the source of truth.
      operationId: remediations_create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemediationCreateRequest"
      responses:
        "201":
          description: The created remediation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Remediation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/remediations/{remediation_id}:
    get:
      tags:
        - Remediations
      summary: Get a remediation by ID
      description: Returns the full remediation definition and current state.
      operationId: remediations_get
      parameters:
        - name: remediation_id
          in: path
          required: true
          description: The unique identifier of the remediation
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Remediation details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Remediation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalServerError"
    put:
      tags:
        - Remediations
      summary: Update a remediation
      description: Fully replaces a remediation definition.
      operationId: remediations_update
      parameters:
        - name: remediation_id
          in: path
          required: true
          description: The unique identifier of the remediation
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemediationUpdateRequest"
      responses:
        "200":
          description: The updated remediation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Remediation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags:
        - Remediations
      summary: Delete a remediation
      description: Permanently deletes a remediation definition.
      operationId: remediations_delete
      parameters:
        - name: remediation_id
          in: path
          required: true
          description: The unique identifier of the remediation
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Remediation deleted successfully
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/remediations/{remediation_id}/execute:
    post:
      tags:
        - Remediations
      summary: Execute a remediation
      description: |
        Triggers immediate execution of a remediation pipeline.
        Supports both synchronous and asynchronous execution modes.
      operationId: remediations_execute
      parameters:
        - name: remediation_id
          in: path
          required: true
          description: The unique identifier of the remediation to execute
          schema:
            type: string
            format: uuid
        - name: async
          in: query
          description: If true, execution runs asynchronously (returns 202)
          required: false
          schema:
            type: boolean
            default: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                incident_id:
                  type: string
                  format: uuid
                  description: Associate with an incident
                parameters:
                  type: object
                  description: Remediation-specific input parameters
                commit_sha:
                  type: string
                  description: Git commit SHA to pin the remediation version
              required:
                - incident_id
      responses:
        "200":
          description: Remediation execution completed synchronously
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemediationExecution"
        "202":
          description: Remediation execution accepted (async mode)
          content:
            application/json:
              schema:
                type: object
                properties:
                  execution_id:
                    type: string
                    format: uuid
                  status:
                    type: string
                    enum: [queued, running]
                required:
                  - execution_id
                  - status
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/remediations/{remediation_id}/history:
    get:
      tags:
        - Remediations
      summary: Get remediation execution history
      description: Returns the execution history for a specific remediation.
      operationId: remediations_list_executions
      parameters:
        - name: remediation_id
          in: path
          required: true
          description: The unique identifier of the remediation
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          description: Filter by execution status
          required: false
          schema:
            type: string
            enum:
              - queued
              - running
              - succeeded
              - failed
              - rolled_back
        - name: page
          in: query
          description: Page number (1-indexed)
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          description: Number of items per page
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: A paginated list of remediation executions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemediationExecutionListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/remediations/{remediation_id}/rollback:
    post:
      tags:
        - Remediations
      summary: Rollback a remediation execution
      description: |
        Initiates a rollback of the last successful execution of a remediation.
        Rollback logic is defined within the remediation pipeline itself
        (GitOps-native approach).
      operationId: remediations_rollback
      parameters:
        - name: remediation_id
