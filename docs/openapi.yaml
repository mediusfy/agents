    TriageResult:
      type: object
      description: An autonomous agent triage analysis result
      properties:
        id:
          type: string
          format: uuid
        incident_id:
          type: string
          format: uuid
          description: The incident that was triaged
        status:
          type: string
          enum:
            - queued
            - processing
            - completed
            - failed
          description: Current analysis status
          example: "completed"
        agent_version:
          type: string
          description: Version of the triage agent used
          example: "2.1.0"
        analysis_duration_ms:
          type: integer
          description: Time taken for analysis in milliseconds
          example: 2340
        recommendations:
          type: array
          items:
            $ref: "#/components/schemas/TriageRecommendation"
        suggested_severity:
          type: string
          enum:
            - critical
            - major
            - minor
            - warning
            - info
          nullable: true
          description: AI-suggested severity level
          example: "major"
        suggested_assignee_id:
          type: string
          format: uuid
          nullable: true
          description: AI-suggested assignee
        suggested_runbook_id:
          type: string
          format: uuid
          nullable: true
          description: AI-suggested runbook to execute
        suggested_remediation_id:
          type: string
          format: uuid
          nullable: true
          description: AI-suggested remediation to execute
        confidence_score:
          type: number
          description: Overall confidence score (0-100)
          example: 87
          minimum: 0
          maximum: 100
        summary:
          type: string
          description: AI-generated triage summary
          example: "This appears to be a networking-related incident affecting the API Gateway in us-east-1. Similar to incident INC-2024-05-31-001 which was resolved by scaling out the gateway instances."
        error:
          type: string
          nullable: true
          description: Error message if analysis failed
        escalation_id:
          type: string
          format: uuid
          nullable: true
          description: ID if this analysis was escalated
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - incident_id
        - status
        - created_at

    TriageRecommendation:
      type: object
      description: A single recommendation from the triage agent
      properties:
        type:
          type: string
          enum:
            - severity_change
            - assignee_change
            - runbook_execution
            - remediation_execution
            - notification
            - escalation
            - custom
          description: Type of recommendation
          example: "runbook_execution"
        priority:
          type: integer
          description: Priority of the recommendation (1 = highest)
          example: 1
          minimum: 1
          maximum: 10
        title:
          type: string
          description: Recommendation title
          example: "Execute API Gateway Recovery Runbook"
        description:
          type: string
          description: Detailed recommendation description
          example: "Based on the error patterns, executing the API Gateway Recovery runbook should mitigate the issue."
        confidence:
          type: number
          description: Confidence in this specific recommendation (0-100)
          example: 92
          minimum: 0
          maximum: 100
        target_id:
          type: string
          format: uuid
          nullable: true
          description: ID of the target resource (runbook/remediation/user)
        target_name:
          type: string
          nullable: true
          description: Human-readable target name
          example: "API Gateway Recovery"
        rationale:
          type: string
          description: AI rationale for the recommendation
          example: "Incident symptoms match 3 previous incidents that were resolved by this runbook."
        automated:
          type: boolean
          description: Whether this recommendation can be auto-applied
          default: false
      required:
        - type
        - title
        - confidence

    TriageListResponse:
      type: object
      description: Paginated list of triage analyses
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TriageResult"
        pagination:
          $ref: "#/components/schemas/PaginationInfo"
      required:
        - items
        - pagination

    # ==========================================================================
    # Workspace
    # ==========================================================================
    Workspace:
      type: object
      description: Local-first SRE workspace configuration
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Workspace display name
          example: "Production SRE Workspace"
        description:
          type: string
          description: Workspace description
        version:
          type: string
          description: Workspace schema version
          example: "1.0.0"
        settings:
          type: object
          description: Workspace settings
          properties:
            offline_mode:
              type: boolean
              description: Enable local-first offline operation
              default: true
            sync_interval_seconds:
              type: integer
              description: Automatic sync interval in seconds
              default: 300
              example: 300
            auto_sync:
              type: boolean
              description: Automatically sync when online
              default: true
            default_runbook_id:
              type: string
              format: uuid
              nullable: true
              description: Default runbook for new incidents
            timezone:
              type: string
              description: Workspace timezone
              example: "UTC"
            notification_preferences:
              type: object
              description: Notification settings
              properties:
                email:
                  type: boolean
                slack:
                  type: boolean
                pagerduty:
                  type: boolean
                webhook_url:
                  type: string
                  format: uri
                  nullable: true
        plugins:
          type: array
          items:
            $ref: "#/components/schemas/WorkspacePlugin"
          description: Installed plugins
        last_sync_at:
          type: string
          format: date-time
          nullable: true
          description: Timestamp of last successful sync
        last_sync_status:
          type: string
          enum:
            - synced
            - syncing
            - failed
            - never
          description: Status of the last sync
          example: "synced"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - name
        - version
        - created_at
        - updated_at

    WorkspaceUpdateRequest:
      type: object
      description: Payload for updating workspace configuration (partial update)
      properties:
        name:
          type: string
          description: Updated workspace name
        description:
          type: string
          description: Updated workspace description
        settings:
          type: object
          description: Updated settings (partial merge)
          properties:
            offline_mode:
              type: boolean
            sync_interval_seconds:
              type: integer
            auto_sync:
              type: boolean
            default_runbook_id:
              type: string
              format: uuid
              nullable: true
            timezone:
              type: string
            notification_preferences:
              type: object
              properties:
                email:
                  type: boolean
                slack:
                  type: boolean
                pagerduty:
                  type: boolean
                webhook_url:
                  type: string
                  format: uri
                  nullable: true

    WorkspaceStatus:
      type: object
      description: Workspace sync and health status
      properties:
        workspace_id:
          type: string
          format: uuid
        name:
          type: string
        connectivity:
          type: string
          enum:
            - online
            - offline
            - degraded
          description: Current connectivity status
          example: "online"
        sync_status:
          type: string
          enum:
            - synced
            - syncing
            - pending
            - failed
            - never
          description: Current sync status
          example: "synced"
        last_sync_at:
          type: string
          format: date-time
          nullable: true
        last_sync_duration_ms:
          type: integer
          nullable: true
          description: Duration of last sync in milliseconds
        pending_changes:
          type: integer
          description: Number of pending changes to sync
          example: 0
        offline_data_size_bytes:
          type: integer
          description: Size of locally cached data
          example: 52428800
        plugin_count:
          type: integer
          description: Number of installed plugins
          example: 5
        api_version:
          type: string
          description: API version compatibility
          example: "1.0.0"
        uptime_seconds:
          type: integer
          description: Workspace uptime in seconds
          example: 86400
        healthy:
          type: boolean
          description: Overall workspace health
          example: true
      required:
        - workspace_id
        - name
        - connectivity
        - sync_status
        - healthy

    WorkspaceSyncResult:
      type: object
      description: Result of a workspace sync operation
      properties:
        sync_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - synced
            - syncing
            - failed
          description: Final sync status
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
        duration_ms:
          type: integer
          nullable: true
        changes_pulled:
          type: integer
          description: Number of changes pulled from server
          example: 15
        changes_pushed:
          type: integer
          description: Number of changes pushed to server
          example: 3
        errors:
          type: array
          items:
            type: string
          description: Sync errors if any
      required:
        - sync_id
        - status
        - started_at

    WorkspacePlugin:
      type: object
      description: A plugin installed in the SRE workspace
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Plugin name
          example: "grafana-datasource"
        display_name:
          type: string
          description: Human-readable plugin name
          example: "Grafana Datasource"
        description:
          type: string
          description: Plugin description
        version:
          type: string
          description: Installed version (semver)
          example: "1.2.3"
        source:
          type: string
          format: uri
          description: Plugin source URL
          example: "https://plugins.rufkis.io/grafana-datasource"
        enabled:
          type: boolean
          description: Whether the plugin is active
          default: true
        config:
          type: object
          description: Plugin-specific configuration
          example:
            grafana_url: "https://grafana.internal.example.com"
            api_key_name: "grafana_api_key"
        permissions:
          type: array
          items:
            type: string
          description: Required permissions
          example:
            - "read:metrics"
            - "read:alerts"
        installed_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - name
        - version
        - source
        - installed_at

  responses:
    BadRequest:
      description: Bad request — invalid input parameters
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: "bad_request"
            message: "The request contains invalid parameters"
            code: "ERR_BAD_REQUEST"
            details:
              - field: "severity"
                reason: "must be one of: critical, major, minor, warning, info"
                value: "unknown"
            request_id: "req-a1b2c3d4-e5f6-7890-abcd-ef1234567890"

    Unauthorized:
      description: Unauthorized — missing or invalid authentication token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: "unauthorized"
            message: "Authentication is required. Provide a valid Bearer token in the Authorization header."
            code: "ERR_UNAUTHORIZED"
            request_id: "req-b2c3d4e5-f6a7-8901-bcde-f12345678901"

    Forbidden:
      description: Forbidden — the authenticated user lacks the required permissions
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: "forbidden"
            message: "You do not have permission to perform this action."
            code: "ERR_FORBIDDEN"
            request_id: "req-c3d4e5f6-a7b8-9012-cdef-123456789012"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: "not_found"
            message: "The requested resource was not found."
            code: "ERR_NOT_FOUND"
            request_id: "req-d4e5f6a7-b8c9-0123-defa-234567890123"

    Conflict:
      description: Conflict — the request conflicts with the current state
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: "conflict"
            message: "The resource cannot be modified due to a conflict with its current state."
            code: "ERR_CONFLICT"
            request_id: "req-e5f6a7b8-c9d0-1234-efab-345678901234"

    UnprocessableEntity:
      description: Unprocessable entity — validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: "validation_error"
            message: "The request body failed validation."
            code: "ERR_VALIDATION"
            details:
              - field: "title"
                reason: "is required"
              - field: "severity"
                reason: "must be one of: critical, major, minor, warning, info"
                value: "extreme"
            request_id: "req-f6a7b8c9-d0e1-2345-fabc-456789012345"

    RateLimited:
      description: Rate limit exceeded
      headers:
        Retry-After:
          description: Number of seconds to wait before retrying
          schema:
            type: integer
        X-RateLimit-Remaining:
          schema:
            type: integer
          description: Remaining requests in the current window (0)
        X-RateLimit-Reset:
          schema:
            type: integer
          description: Unix timestamp when the rate limit resets
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: "rate_limited"
            message: "API rate limit exceeded. Please wait before making further requests."
            code: "ERR_RATE_LIMITED"
            request_id: "req-a1b2c3d4-e5f6-7890-abcd-ef1234567890"

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: "internal_error"
            message: "An unexpected error occurred. Please try again later."
            code: "ERR_INTERNAL"
            request_id: "req-b2c3d4e5-f6a7-8901-bcde-f12345678901"

tags:
  - name: Incidents
    description: |
      Incident lifecycle management. Create, update, acknowledge, and resolve
      incidents. Attach notes and trigger autonomous triage.
  - name: Runbooks
    description: |
      Runbook automation. Define, execute, and track step-by-step response
      procedures. Runbooks can be triggered manually or automatically by policies.
  - name: Remediations
    description: |
      GitOps-native remediation pipelines. Remediations are declarative,
      version-controlled pipelines that can automatically fix infrastructure
      issues. Supports rollback and execution history.
  - name: Policies
    description: |
      Policy engine. Define automated reactions to system conditions.
      Policies can trigger runbooks, remediations, notifications, or triage.
  - name: FinOps
    description: |
      Automated FinOps ROI analysis. Track cloud costs, generate reports,
      and discover savings opportunities with confidence scoring and
      return-on-effort calculations.
  - name: Triage
    description: |
      Autonomous agent triage. AI-driven incident analysis that recommends
      severity, assignee, runbooks, and remediation steps with confidence scoring.
  - name: Workspace
    description: |
      Local-first SRE workspace management. Configure workspace settings,
      manage plugins, control sync behavior, and export/import configurations.
      Designed for offline-capable operation.
