    # ==========================================================================
    # Policy
    # ==========================================================================
    Policy:
      type: object
      description: A policy definition for automated reactions
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Policy name
          example: "Auto-remediate high error rates"
        description:
          type: string
          description: Policy purpose description
          example: "When error rate exceeds 5% for 10 minutes, trigger remediation"
        status:
          type: string
          enum:
            - enabled
            - disabled
            - dry_run
          description: Policy operational status
          example: "enabled"
        severity:
          type: string
          enum:
            - critical
            - major
            - minor
            - warning
            - info
          description: Target incident severity
        conditions:
          type: object
          description: Conditions that trigger the policy
          properties:
            metric:
              type: string
              description: Metric name to evaluate
              example: "error_rate"
            operator:
              type: string
              enum:
                - gt
                - gte
                - lt
                - lte
                - eq
                - neq
              description: Comparison operator
            threshold:
              type: number
              description: Threshold value
              example: 5.0
            duration_seconds:
              type: integer
              description: How long the condition must be true
              example: 600
            match_labels:
              type: object
              description: Labels to match against
              additionalProperties:
                type: string
          required:
            - metric
            - operator
            - threshold
        actions:
          type: array
          description: Actions to execute when conditions are met
          items:
            type: object
            properties:
              action_type:
                type: string
                enum:
                  - runbook
                  - remediation
                  - notification
                  - triage
                description: Type of action
              target_id:
                type: string
                format: uuid
                description: ID of the target (runbook/remediation/etc.)
              target_name:
                type: string
                description: Human-readable target name
              params:
                type: object
                description: Action-specific parameters
            required:
              - action_type
        cooldown_seconds:
          type: integer
          description: Minimum time between re-triggering
          default: 3600
          example: 3600
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - name
        - status
        - conditions
        - actions
        - created_at
        - updated_at

    PolicyCreateRequest:
      type: object
      description: Payload for creating a policy
      properties:
        name:
          type: string
          description: Policy name
          example: "Auto-remediate high error rates"
        description:
          type: string
          description: Policy purpose
        status:
          type: string
          enum:
            - enabled
            - disabled
            - dry_run
          default: disabled
        severity:
          type: string
          enum:
            - critical
            - major
            - minor
            - warning
            - info
        conditions:
          type: object
          properties:
            metric:
              type: string
            operator:
              type: string
              enum:
                - gt
                - gte
                - lt
                - lte
                - eq
                - neq
            threshold:
              type: number
            duration_seconds:
              type: integer
            match_labels:
              type: object
              additionalProperties:
                type: string
          required:
            - metric
            - operator
            - threshold
        actions:
          type: array
          items:
            type: object
            properties:
              action_type:
                type: string
                enum:
                  - runbook
                  - remediation
                  - notification
                  - triage
              target_id:
                type: string
                format: uuid
              target_name:
                type: string
              params:
                type: object
            required:
              - action_type
              - target_id
        cooldown_seconds:
          type: integer
          default: 3600
      required:
        - name
        - conditions
        - actions

    PolicyUpdateRequest:
      type: object
      description: Payload for updating a policy (full replacement)
      properties:
        name:
          type: string
        description:
          type: string
        status:
          type: string
          enum:
            - enabled
            - disabled
            - dry_run
        severity:
          type: string
          enum:
            - critical
            - major
            - minor
            - warning
            - info
        conditions:
          type: object
          properties:
            metric:
              type: string
            operator:
              type: string
              enum:
                - gt
                - gte
                - lt
                - lte
                - eq
                - neq
            threshold:
              type: number
            duration_seconds:
              type: integer
            match_labels:
              type: object
              additionalProperties:
                type: string
          required:
            - metric
            - operator
            - threshold
        actions:
          type: array
          items:
            type: object
            properties:
              action_type:
                type: string
                enum:
                  - runbook
                  - remediation
