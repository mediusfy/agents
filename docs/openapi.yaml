    # ==========================================================================
    # Cost Entry (FinOps)
    # ==========================================================================
    CostEntry:
      type: object
      description: A single cloud cost entry
      properties:
        id:
          type: string
          format: uuid
        provider:
          type: string
          enum:
            - aws
            - gcp
            - azure
            - other
          description: Cloud provider
          example: "aws"
        service:
          type: string
          description: Cloud service name
          example: "EC2"
        region:
          type: string
          description: Cloud region
          example: "us-east-1"
        account_id:
          type: string
          description: Cloud account/tenant identifier
          example: "123456789012"
        resource_id:
          type: string
          description: Specific resource identifier
          example: "i-0abcd1234efgh5678"
        cost_amount:
          type: number
          description: Cost amount in the currency unit
          example: 1234.56
        currency:
          type: string
          description: ISO 4217 currency code
          example: "USD"
        usage_quantity:
          type: number
          description: Quantity of usage
          example: 744.0
        usage_unit:
          type: string
          description: Unit of measurement
          example: "hours"
        cost_category:
          type: string
          enum:
            - compute
            - storage
            - networking
            - database
            - security
            - management
            - support
            - other
          description: Cost categorization
          example: "compute"
        date:
          type: string
          format: date
          description: The date this cost entry applies to
          example: "2026-06-02"
        tags:
          type: object
          description: Resource tags
          example:
            environment: "production"
            team: "platform"
        created_at:
          type: string
          format: date-time
      required:
        - id
        - provider
        - service
        - cost_amount
        - currency
        - date
        - created_at

    CostListResponse:
      type: object
      description: Paginated list of cost entries
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CostEntry"
        pagination:
          $ref: "#/components/schemas/PaginationInfo"
      required:
        - items
        - pagination

    CostSummary:
      type: object
      description: Aggregated cost summary
      properties:
        total_cost:
          type: number
          description: Total cost for the period
          example: 45231.89
        currency:
          type: string
          example: "USD"
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        groups:
          type: array
          description: Cost breakdown by the specified grouping
          items:
            type: object
            properties:
              key:
                type: string
                description: The grouping key (provider, service, region, or date)
                example: "EC2"
              cost:
                type: number
                description: Cost for this group
                example: 12345.67
              percentage:
                type: number
                description: Percentage of total cost
                example: 27.3
              trend:
                type: string
                enum:
                  - increasing
                  - stable
                  - decreasing
                description: Cost trend compared to previous period
            required:
              - key
              - cost
        provider_breakdown:
          type: object
          description: Breakdown by provider
          additionalProperties:
            type: number
          example:
            aws: 30000.00
            gcp: 10000.00
            azure: 5231.89
      required:
        - total_cost
        - currency
        - start_date
        - end_date
        - groups

    # ==========================================================================
    # Report (FinOps)
    # ==========================================================================
    Report:
      type: object
      description: A generated FinOps report
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          description: Report title
          example: "June 2026 FinOps Cost Analysis"
        description:
          type: string
          description: Report description
        report_type:
          type: string
          enum:
            - cost_analysis
            - savings_recommendations
            - roi_analysis
            - budget_comparison
            - custom
          description: Type of report
          example: "cost_analysis"
        status:
          type: string
          enum:
            - generating
            - completed
            - failed
          description: Report generation status
          example: "completed"
        parameters:
          type: object
          description: Report generation parameters used
          properties:
            start_date:
              type: string
              format: date
            end_date:
              type: string
              format: date
            group_by:
              type: string
            providers:
              type: array
              items:
                type: string
        total_cost:
          type: number
          nullable: true
          description: Total cost covered in the report
        potential_savings:
          type: number
          nullable: true
          description: Total potential savings identified
        file_size_bytes:
          type: integer
          nullable: true
          description: Size of the generated report file
        available_formats:
          type: array
          items:
            type: string
            enum:
              - csv
              - pdf
              - xlsx
          example:
            - csv
            - pdf
        generated_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
      required:
        - id
        - title
        - report_type
        - status
        - created_at

    ReportGenerateRequest:
      type: object
      description: Payload for generating a new FinOps report
      properties:
        title:
          type: string
          description: Report title
          example: "June 2026 FinOps Cost Analysis"
        description:
          type: string
          description: Report description
        report_type:
          type: string
          enum:
            - cost_analysis
            - savings_recommendations
            - roi_analysis
            - budget_comparison
            - custom
          description: Type of report to generate
          default: cost_analysis
        start_date:
          type: string
          format: date
          description: Start date for the report data
        end_date:
          type: string
          format: date
          description: End date for the report data
        group_by:
          type: string
          enum:
            - provider
            - service
            - region
            - daily
            - monthly
          default: service
          description: Grouping for cost breakdown
        providers:
          type: array
          items:
            type: string
            enum:
              - aws
              - gcp
              - azure
            description: Cloud providers to include (all if omitted)
        formats:
          type: array
          items:
            type: string
            enum:
              - csv
              - pdf
              - xlsx
          description: Desired output formats
          default:
            - csv
      required:
        - title
        - start_date
        - end_date

    ReportListResponse:
      type: object
      description: Paginated list of reports
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Report"
        pagination:
          $ref: "#/components/schemas/PaginationInfo"
      required:
        - items
        - pagination

    # ==========================================================================
    # Savings Recommendation (FinOps ROI)
    # ==========================================================================
    SavingsRecommendation:
      type: object
      description: A FinOps savings recommendation with ROI analysis
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          description: Recommendation title
          example: "Rightsize m5.xlarge to m5.large for dev instances"
        description:
          type: string
          description: Detailed recommendation description
        category:
          type: string
          enum:
            - compute_rightsizing
            - reserved_instances
            - storage_optimization
            - data_transfer
            - idle_resources
            - license_optimization
          description: Savings category
          example: "compute_rightsizing"
        provider:
          type: string
          enum:
            - aws
            - gcp
            - azure
            - other
          description: Cloud provider
          example: "aws"
        service:
          type: string
          description: Target service
          example: "EC2"
        region:
          type: string
          description: Target region
          example: "us-east-1"
        resource_id:
          type: string
          nullable: true
          description: Specific resource identifier
        current_cost_monthly:
          type: number
          description: Current monthly cost in USD
          example: 500.00
        estimated_savings_monthly:
          type: number
          description: Estimated monthly savings in USD
          example: 250.00
        savings_percentage:
          type: number
          description: Estimated savings as percentage
          example: 50.0
        estimated_annual_savings:
          type: number
          description: Estimated annual savings in USD
          example: 3000.00
        confidence_score:
          type: number
          description: Confidence score (0-100)
          example: 85
          minimum: 0
          maximum: 100
        implementation_cost:
          type: number
          nullable: true
          description: Estimated cost to implement in USD
          example: 50.00
        roe:
          type: number
          nullable: true
          description: Return on Effort (savings / implementation cost)
          example: 5.0
        status:
          type: string
          enum:
            - pending
            - applied
            - dismissed
            - in_progress
          description: Current status of the recommendation
          example: "pending"
        suggested_actions:
          type: array
          items:
            type: string
          description: Suggested steps to implement
          example:
            - "Modify instance type from m5.xlarge to m5.large"
            - "Schedule change during maintenance window"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - title
        - category
        - current_cost_monthly
        - estimated_savings_monthly
        - confidence_score
        - status
        - created_at

    SavingsListResponse:
      type: object
      description: Paginated list of savings recommendations
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SavingsRecommendation"
        pagination:
          $ref: "#/components/schemas/PaginationInfo"
        total_potential_savings:
          type: number
          description: Total potential monthly savings from all recommendations
          example: 12500.00
      required:
        - items
        - pagination
        - total_potential_savings

