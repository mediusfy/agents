  /api/v1/policies/{policy_id}/validate:
    post:
      tags:
        - Policies
      summary: Validate a policy (dry-run)
      description: |
        Validates a policy without enabling it. Simulates the conditions
        and actions to verify correctness before going live.
      operationId: policies_validate
      parameters:
        - name: policy_id
          in: path
          required: true
          description: The unique identifier of the policy to validate
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                simulation_context:
                  type: object
                  description: Optional simulated incident context for validation
                  properties:
                    severity:
                      type: string
                      enum: [critical, major, minor, warning, info]
                    source:
                      type: string
                    title:
                      type: string
      responses:
        "200":
          description: Policy validation (dry-run) result
          content:
            application/json:
              schema:
                type: object
                properties:
                  policy_id:
                    type: string
                    format: uuid
                  valid:
                    type: boolean
                  matched_conditions:
                    type: array
                    items:
                      type: string
                  would_trigger_actions:
                    type: array
                    items:
                      type: object
                      properties:
                        action_type:
                          type: string
                          enum:
                            - runbook
                            - remediation
                            - notification
                            - triage
                        target_id:
                          type: string
                          format: uuid
                        target_name:
                          type: string
                  errors:
                    type: array
                    items:
                      type: string
                required:
                  - policy_id
                  - valid
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalServerError"

