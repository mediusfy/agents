        - Triage
      summary: Get a triage analysis by ID
      description: Returns the full triage analysis result including recommendations.
      operationId: triage_get
      parameters:
        - name: triage_id
          in: path
          required: true
          description: The unique identifier of the triage analysis
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Triage analysis details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriageResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/triage/{triage_id}/escalate:
    post:
      tags:
        - Triage
      summary: Escalate a triage analysis
      description: |
        Escalates a triage analysis to a human operator or on-call team.
        This creates an escalation record and sends notifications.
      operationId: triage_escalate
      parameters:
        - name: triage_id
          in: path
          required: true
          description: The unique identifier of the triage analysis
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                escalation_reason:
                  type: string
                  description: Reason for escalation
                  example: "Agent confidence below threshold; manual review required"
                target_team:
                  type: string
                  description: Target team or on-call schedule
                priority:
                  type: string
                  enum:
                    - low
                    - normal
                    - high
                    - urgent
                  default: normal
      responses:
        "200":
          description: Escalation created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  escalation_id:
                    type: string
                    format: uuid
                  triage_id:
                    type: string
                    format: uuid
                  status:
                    type: string
                    enum:
                      - acknowledged
                      - pending
                      - resolved
                required:
                  - escalation_id
                  - triage_id
                  - status
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/triage/{triage_id}/resolve:
    post:
      tags:
        - Triage
      summary: Resolve a triage analysis
      description: |
        Marks a triage analysis as resolved. Can include feedback
        on the quality of the agent's recommendations to improve
        future triage accuracy.
      operationId: triage_resolve
      parameters:
        - name: triage_id
          in: path
          required: true
          description: The unique identifier of the triage analysis
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                resolution_notes:
                  type: string
                  description: Notes about the resolution
                agent_feedback:
                  type: object
                  description: Feedback on agent recommendations
                  properties:
                    accuracy_score:
                      type: integer
                      minimum: 1
                      maximum: 5
                      description: Rating of recommendation accuracy (1-5)
                    actionable:
                      type: boolean
                      description: Whether recommendations were actionable
                    comments:
                      type: string
                      description: Free-text feedback
      responses:
        "200":
          description: Triage resolved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriageResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/triage/{triage_id}/recommendations:
    get:
      tags:
        - Triage
      summary: Get triage recommendations
      description: |
        Returns the autonomous agent's recommendations for a specific
        triage analysis, including suggested severity, assignee,
        runbook attachments, and remediation steps.
      operationId: triage_get_recommendations
      parameters:
        - name: triage_id
          in: path
          required: true
          description: The unique identifier of the triage analysis
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Triage recommendations
          content:
            application/json:
              schema:
                type: object
                properties:
                  triage_id:
                    type: string
                    format: uuid
                  recommendations:
                    type: array
                    items:
                      $ref: "#/components/schemas/TriageRecommendation"
                required:
                  - triage_id
                  - recommendations
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # ============================================================================
  # WORKSPACE (Local-First SRE Workspace)
  # ============================================================================
  /api/v1/workspace:
    get:
      tags:
        - Workspace
      summary: Get workspace configuration
      description: |
        Returns the current workspace configuration.
        The workspace is a local-first concept that supports offline operation
        and syncs with the central platform when connectivity is available.
      operationId: workspace_get
      responses:
        "200":
          description: Workspace configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalServerError"
    patch:
      tags:
        - Workspace
      summary: Update workspace configuration
      description: |
        Partially updates the workspace configuration.
        Supports local-first settings such as offline mode, sync intervals,
        and plugin preferences.
      operationId: workspace_update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceUpdateRequest"
      responses:
        "200":
          description: Updated workspace configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/workspace/status:
    get:
      tags:
        - Workspace
      summary: Get workspace sync and health status
      description: |
        Returns the current sync status, connectivity state, and
        health metrics for the local-first SRE workspace.
      operationId: workspace_get_status
      responses:
        "200":
          description: Workspace status and health information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/workspace/sync:
    post:
      tags:
        - Workspace
      summary: Trigger workspace sync
      description: |
        Manually triggers a synchronization of the local workspace
        with the central Rufkis platform. Useful when returning from
        offline operation.
      operationId: workspace_trigger_sync
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                full_sync:
                  type: boolean
                  description: If true, performs a full resync instead of incremental
                  default: false
      responses:
        "200":
          description: Sync completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceSyncResult"
        "202":
          description: Sync accepted and running asynchronously
          content:
            application/json:
              schema:
                type: object
                properties:
                  sync_id:
                    type: string
                    format: uuid
                  status:
                    type: string
                    enum: [syncing]
                required:
                  - sync_id
                  - status
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/workspace/plugins:
    get:
      tags:
        - Workspace
      summary: List installed workspace plugins
      description: |
        Returns a list of plugins installed in the local-first SRE workspace.
        Plugins extend the workspace with custom capabilities, integrations,
        and UI components.
      operationId: workspace_list_plugins
      responses:
        "200":
          description: A list of installed plugins
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkspacePlugin"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags:
        - Workspace
      summary: Install a workspace plugin
      description: |
        Installs a new plugin into the local-first SRE workspace.
        Plugins are fetched from the plugin registry and activated locally.
      operationId: workspace_install_plugin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                plugin_name:
                  type: string
                  description: The name of the plugin to install
                version:
                  type: string
                  description: Plugin version (semver)
                source:
                  type: string
                  description: Plugin source (registry URL or local path)
                config:
                  type: object
                  description: Plugin-specific configuration
              required:
                - plugin_name
                - source
      responses:
        "201":
          description: Plugin installed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspacePlugin"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/workspace/export:
    post:
      tags:
        - Workspace
      summary: Export workspace configuration
      description: |
        Exports the workspace configuration and data as a downloadable
        archive. Useful for backup, migration, or sharing workspace
        configurations between team members.
      operationId: workspace_export
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                include_plugins:
                  type: boolean
                  description: Include plugin configurations in the export
                  default: true
                include_history:
                  type: boolean
                  description: Include execution and sync history
                  default: false
                format:
                  type: string
                  enum:
                    - json
                    - yaml
                  default: json
      responses:
        "200":
          description: Workspace export data
          content:
            application/json:
              schema:
                type: object
                description: Workspace export payload
            application/x-yaml:
              schema:
                type: string
                description: Workspace export as YAML
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Authenticate using a Bearer token issued by the Rufkis platform.
        Tokens are obtained via the Rufkis CLI or the platform dashboard.

  schemas:
    # ==========================================================================
    # Error Response
    # ==========================================================================
    ErrorResponse:
      type: object
      description: Standard error response for all API errors
      properties:
        error:
          type: string
          description: Short error code identifier
          example: "validation_error"
        message:
          type: string
          description: Human-readable error description
          example: "The request body contains invalid fields"
        code:
          type: string
          description: Optional machine-readable error code
          example: "ERR_INVALID_INPUT"
        details:
          type: array
          description: Detailed error information
          items:
            type: object
            properties:
              field:
                type: string
                description: The field that caused the error
                example: "severity"
              reason:
                type: string
                description: Why the field is invalid
                example: "must be one of: critical, major, minor, warning, info"
              value:
                description: The invalid value that was provided
            required:
              - field
              - reason
        request_id:
          type: string
          format: uuid
          description: Unique request identifier for tracing
      required:
        - error
        - message

    # ==========================================================================
    # Pagination
    # ==========================================================================
    PaginationInfo:
      type: object
      description: Pagination metadata
      properties:
        page:
          type: integer
          description: Current page number (1-indexed)
          example: 1
        page_size:
          type: integer
          description: Number of items per page
          example: 25
        total:
          type: integer
          description: Total number of items across all pages
          example: 142
        total_pages:
          type: integer
          description: Total number of pages
          example: 6
      required:
        - page
        - page_size
        - total
        - total_pages

    # ==========================================================================
    # Incident
    # ==========================================================================
    Incident:
      type: object
      description: A complete incident record
      properties:
        id:
          type: string
          format: uuid
          description: Unique incident identifier
          example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        title:
          type: string
          description: Incident title
          example: "Elevated error rate in API Gateway"
        description:
          type: string
          description: Detailed incident description
          example: "Error rate on api-gateway has exceeded 5% threshold for 10 minutes"
        status:
          type: string
          enum:
            - open
            - acknowledged
            - investigating
            - resolved
            - closed
          description: Current incident status
          example: "open"
        severity:
          type: string
          enum:
            - critical
            - major
            - minor
            - warning
            - info
          description: Incident severity level
          example: "critical"
        source:
          type: string
          description: Source system that reported the incident
          example: "prometheus"
        assignee_id:
          type: string
          format: uuid
          nullable: true
          description: ID of the assigned user
          example: "b2c3d4e5-f6a7-8901-bcde-f12345678901"
        runbook_id:
          type: string
          format: uuid
          nullable: true
          description: ID of the attached runbook
          example: "c3d4e5f6-a7b8-9012-cdef-123456789012"
        remediation_id:
          type: string
          format: uuid
          nullable: true
          description: ID of the attached remediation
          example: "d4e5f6a7-b8c9-0123-defa-234567890123"
        policy_id:
          type: string
          format: uuid
          nullable: true
          description: ID of the policy that triggered this incident
          example: "e5f6a7b8-c9d0-1234-efab-345678901234"
        triage_id:
          type: string
          format: uuid
          nullable: true
          description: ID of the autonomous triage analysis
          example: "f6a7b8c9-d0e1-2345-fabc-456789012345"
        tags:
          type: array
          description: Incident tags for categorization
          items:
            type: string
          example:
            - "networking"
            - "production"
        metadata:
          type: object
          description: Arbitrary metadata key-value pairs
          example:
            region: "us-east-1"
            service: "api-gateway"
            environment: "production"
        created_at:
          type: string
          format: date-time
          description: Timestamp when the incident was created
          example: "2026-06-03T01:30:00Z"
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the incident was last updated
          example: "2026-06-03T02:00:00Z"
        resolved_at:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when the incident was resolved
          example: "2026-06-03T03:00:00Z"
        closed_at:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when the incident was closed
      required:
        - id
        - title
        - status
        - severity
        - source
        - created_at
        - updated_at

    IncidentCreateRequest:
      type: object
      description: Payload for creating a new incident
      properties:
        title:
          type: string
          description: Incident title
          example: "Elevated error rate in API Gateway"
        description:
          type: string
          description: Detailed incident description
          example: "Error rate on api-gateway has exceeded 5% threshold for 10 minutes"
        severity:
          type: string
          enum:
            - critical
            - major
            - minor
            - warning
            - info
          description: Incident severity level
          example: "critical"
        source:
          type: string
          description: Source system that detected the incident
          example: "prometheus"
        assignee_id:
          type: string
          format: uuid
          description: ID of the user to assign
        tags:
          type: array
          items:
            type: string
          description: Tags for categorization
          example:
            - "networking"
        metadata:
          type: object
          description: Arbitrary metadata key-value pairs
          example:
            region: "us-east-1"
      required:
        - title
        - severity
        - source

    IncidentUpdateRequest:
      type: object
      description: Payload for updating an existing incident (partial update)
      properties:
        title:
          type: string
          description: Updated title
        description:
          type: string
          description: Updated description
        status:
          type: string
          enum:
            - open
            - acknowledged
            - investigating
            - resolved
            - closed
          description: Updated status
        severity:
          type: string
          enum:
            - critical
            - major
            - minor
            - warning
            - info
          description: Updated severity
        assignee_id:
          type: string
          format: uuid
          nullable: true
          description: Updated assignee (null to unassign)
        tags:
          type: array
          items:
            type: string
          description: Updated tags
        metadata:
          type: object
          description: Updated metadata

    IncidentListResponse:
      type: object
      description: Paginated list of incidents
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Incident"
        pagination:
          $ref: "#/components/schemas/PaginationInfo"
      required:
        - items
        - pagination

    # ==========================================================================
    # Incident Note
    # ==========================================================================
    IncidentNote:
      type: object
      description: A note attached to an incident
      properties:
        id:
          type: string
          format: uuid
          description: Unique note identifier
        incident_id:
          type: string
          format: uuid
          description: The incident this note belongs to
        author_id:
          type: string
          format: uuid
          description: ID of the user who wrote the note
        author_name:
          type: string
          description: Display name of the author
          example: "Alice SRE"
        content:
          type: string
          description: Note content
          example: "Rolled back api-gateway to v2.1.3. Error rate dropping."
        note_type:
          type: string
          enum:
            - manual
            - automated
            - system
          description: Type of note
          example: "manual"
        created_at:
          type: string
          format: date-time
          description: Timestamp when the note was created
      required:
        - id
        - incident_id
        - content
        - created_at

    IncidentNoteCreateRequest:
      type: object
      description: Payload for creating a new incident note
      properties:
        content:
          type: string
          description: Note content
          example: "Rolled back api-gateway to v2.1.3. Error rate dropping."
        note_type:
          type: string
          enum:
            - manual
            - automated
            - system
          default: manual
          description: Type of note
      required:
        - content

    # ==========================================================================
    # Runbook
    # ==========================================================================
    Runbook:
      type: object
      description: A runbook definition
      properties:
        id:
          type: string
          format: uuid
          description: Unique runbook identifier
        name:
          type: string
          description: Human-readable runbook name
          example: "API Gateway Recovery"
        description:
          type: string
          description: Description of the runbook's purpose
          example: "Steps to recover API Gateway from elevated error rates"
        category:
          type: string
          description: Runbook category for organization
          example: "networking"
        status:
          type: string
          enum:
            - active
            - draft
            - archived
          description: Current runbook status
          example: "active"
        version:
          type: string
          description: Runbook version (semver)
          example: "1.2.0"
        steps:
          type: array
          description: Ordered list of runbook steps
          items:
            $ref: "#/components/schemas/RunbookStep"
        git_source:
          type: object
          description: Git repository source (GitOps-native)
          properties:
            repo_url:
              type: string
              format: uri
              description: Git repository URL
              example: "https://github.com/rufkis/runbooks"
            path:
              type: string
              description: Path within the repository
              example: "runbooks/api-gateway-recovery.yaml"
            commit_sha:
              type: string
              description: Current pinned commit SHA
              example: "a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0"
        timeout_seconds:
          type: integer
          description: Maximum execution time in seconds
          example: 600
        tags:
          type: array
          items:
            type: string
          description: Tags for categorization
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - name
        - status
        - steps
        - created_at
        - updated_at

    RunbookStep:
      type: object
      description: A single step within a runbook
      properties:
        id:
          type: string
          description: Step identifier
          example: "step-1"
        name:
          type: string
          description: Step name
          example: "Verify API Gateway health"
        description:
          type: string
          description: Detailed step instructions
          example: "Check /health endpoint and verify 200 response"
        action:
          type: string
          enum:
            - manual
            - script
            - api_call
            - webhook
            - approval
            - notification
          description: Type of action for this step
        command:
          type: string
          description: Script or command to execute (for script actions)
        api_endpoint:
          type: string
          format: uri
          description: API endpoint URL (for api_call actions)
        api_method:
          type: string
          enum:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
          description: HTTP method (for api_call actions)
        expected_result:
          type: string
          description: Expected result or output
        timeout_seconds:
          type: integer
          description: Step timeout in seconds
          default: 300
        on_failure:
          type: string
          enum:
            - stop
            - skip
            - continue
            - notify
          description: Behavior when step fails
          default: stop
        approval_required:
          type: boolean
          description: Whether human approval is needed before this step
          default: false
      required:
        - id
        - name
        - action

    RunbookCreateRequest:
      type: object
      description: Payload for creating a runbook
      properties:
        name:
          type: string
          description: Runbook name
          example: "API Gateway Recovery"
        description:
          type: string
          description: Runbook description
        category:
          type: string
          description: Runbook category
          example: "networking"
        steps:
          type: array
          items:
            $ref: "#/components/schemas/RunbookStep"
          description: Ordered list of runbook steps
