    # ==========================================================================
    # Remediation
    # ==========================================================================
    Remediation:
      type: object
      description: A GitOps-native remediation pipeline definition
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Remediation name
          example: "Scale Down Unused Compute"
        description:
          type: string
          description: Description of the remediation's purpose
          example: "Automatically scale down compute instances with < 5% CPU utilization for 7 days"
        status:
          type: string
          enum:
            - active
            - inactive
            - draft
            - deprecated
          example: "active"
        source_repo:
          type: string
          format: uri
          description: Git repository URL for the pipeline definition
          example: "https://github.com/rufkis/remediations"
        source_path:
          type: string
          description: Path within the repository to the pipeline definition
          example: "remediations/scale-down-unused-compute.yaml"
        source_commit:
          type: string
          description: Current pinned commit SHA
          example: "b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1"
        pipeline_type:
          type: string
          enum:
            - terraform
            - helm
            - shell
            - kubernetes
            - custom
          description: Type of pipeline engine
          example: "kubernetes"
        parameters_schema:
          type: object
          description: JSON Schema defining valid input parameters
        auto_approve:
          type: boolean
          description: Whether the remediation can run without approval
          default: false
        rollback_enabled:
          type: boolean
          description: Whether rollback is supported
          default: true
        timeout_seconds:
          type: integer
          description: Maximum execution time
          example: 900
        tags:
          type: array
          items:
            type: string
        last_execution_id:
          type: string
          format: uuid
          nullable: true
        last_execution_status:
          type: string
          nullable: true
          enum:
            - succeeded
            - failed
            - rolled_back
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - name
        - status
        - pipeline_type
        - created_at
        - updated_at

    RemediationCreateRequest:
      type: object
      description: Payload for creating a remediation
      properties:
        name:
          type: string
          description: Remediation name
          example: "Scale Down Unused Compute"
        description:
          type: string
          description: Purpose description
        source_repo:
          type: string
          format: uri
          description: Git repository URL
        source_path:
          type: string
          description: Path to pipeline definition in the repo
        pipeline_type:
          type: string
          enum:
            - terraform
            - helm
            - shell
            - kubernetes
            - custom
          description: Pipeline engine type
        parameters_schema:
          type: object
          description: JSON Schema for input parameters
        auto_approve:
          type: boolean
          default: false
        rollback_enabled:
          type: boolean
          default: true
        timeout_seconds:
          type: integer
          default: 600
        tags:
          type: array
          items:
            type: string
      required:
        - name
        - pipeline_type

    RemediationUpdateRequest:
      type: object
      description: Payload for updating a remediation (full replacement)
      properties:
        name:
          type: string
        description:
          type: string
        source_repo:
          type: string
          format: uri
        source_path:
          type: string
        pipeline_type:
          type: string
          enum:
            - terraform
            - helm
            - shell
            - kubernetes
            - custom
        parameters_schema:
          type: object
        auto_approve:
          type: boolean
        rollback_enabled:
          type: boolean
        timeout_seconds:
          type: integer
        tags:
          type: array
          items:
            type: string
      required:
        - name
        - pipeline_type

    RemediationListResponse:
