# Redis Configuration for Runbook Registry API Cache
# GITOPS-02: Declarative Runbook Definitions Stored in Git
#
# Purpose: Cache runbook registry data for fast API responses.
# Runbooks are mutable (updated via Git), so we use TTL-based caching
# with proactive invalidation on specific events.

maxmemory 256mb
maxmemory-policy allkeys-lru
appendonly yes
appendfsync everysec

# --- Runbook Registry Cache ---

# Runbook detail cache (individual runbook by slug/id)
# TTL: 300 seconds (5 minutes) - runbooks update via git PR merges
# Pattern: runbook:{slug}
# Example: runbook:database-failover
# Invalidation events: gitops.RunbookCommitted, gitops.RunbookRegistered

# Runbook list cache (paginated results)
# TTL: 60 seconds - short TTL for list views to ensure freshness
# Pattern: runbook:list:{page}:{per_page}:{filter}
# Example: runbook:list:1:20:category=database
# Invalidation events: gitops.RunbookRegistered, gitops.RunbookVersionTagged

# Runbook search cache (search results)
# TTL: 120 seconds
# Pattern: runbook:search:{query}:{page}
# Example: runbook:search:databa:1
# Invalidation events: gitops.RunbookRegistered

# Runbook version cache (version history)
# TTL: 600 seconds (10 minutes) - versions change less frequently
# Pattern: runbook:{slug}:versions
# Invalidation events: gitops.RunbookVersionTagged

# Runbook trigger cache (triggers for a runbook)
# TTL: 300 seconds
# Pattern: runbook:{slug}:triggers
# Invalidation events: gitops.RunbookCommitted

# --- Cache Key Templates ---
# {slug} is derived from the runbook YAML metadata.name
# All keys prefixed with "runbook:" for namespacing

# --- Invalidation Strategy ---
# On gitops.RunbookCommitted:
#   DEL runbook:{slug}
#   DEL runbook:list:*
#
# On gitops.RunbookVersionTagged:
#   DEL runbook:{slug}
#   DEL runbook:{slug}:versions
#
# On gitops.RunbookRegistered:
#   DEL runbook:{slug}
#   DEL runbook:list:*
#   DEL runbook:search:*
