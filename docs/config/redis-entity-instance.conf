# Redis Caching Configuration — ENT-02 Entity Instance Management
# This configuration is optimized for the Entity instance caching use case.
# Entity instances are read-heavy (API queries for lists and individual entities)
# and write-moderate (entities are created and updated regularly).

# ============================================================================
# Memory Management
# ============================================================================
maxmemory 256mb
maxmemory-policy allkeys-lru

# ============================================================================
# Persistence
# Entities are the source of truth in PostgreSQL. Redis is a cache layer.
# RDB snapshots provide a reasonable balance of durability and performance.
# ============================================================================
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename entity-instance-cache.rdb

# ============================================================================
# Networking
# ============================================================================
bind 0.0.0.0
port 6380
tcp-backlog 511
timeout 0
tcp-keepalive 300

# ============================================================================
# Cache Key Naming Convention
#
# entity:{entity_id}                         — Full entity instance
# entity:schema:{schema_id}:v{version}       — Schema definition with fields
# entity:schema:slug:{slug}                  — Schema lookup by slug
# entity:list:{schema_id}:{status}:{page}    — Paginated entity list
# entity:list:region:{region}:{page}         — Entities by region
# entity:count:{schema_id}:{status}          — Entity count by schema+status
# entity:zone:{data_residency_zone}          — Entities by data residency zone
# entity:version:{entity_id}                 — Current version for cache invalidation
# ============================================================================

# ============================================================================
# Client Output
# ============================================================================
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# ============================================================================
# Lazy Freeing
# ============================================================================
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes

# ============================================================================
# Keyspace Notifications (for cache invalidation events)
# ============================================================================
notify-keyspace-events Ex

# ============================================================================
# Security
# ============================================================================
requirepass "${REDIS_ENTITY_PASSWORD}"
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command CONFIG ""

# ============================================================================
# Additional Security — Restrict Commands
# ============================================================================
rename-command KEYS ""
rename-command EVAL ""

# ============================================================================
# Logging
# ============================================================================
loglevel notice
logfile /var/log/redis/entity-instance-cache.log
