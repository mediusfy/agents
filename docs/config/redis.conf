# Rufkis SRE Platform — Redis / Cache Configuration
# ===================================================
# Baseline + domain-specific cache strategies

# -------- BASELINE --------
maxmemory 512mb
maxmemory-policy allkeys-lru
appendonly yes
appendfsync everysec
save 900 1
save 300 10
save 60 10000

# -------- DOMAIN-SPECIFIC CACHE KEYS & TTLs --------

# Domain 1: GitOps Remediation
#   Cache runbook definitions (infrequently changing YAML parsed from Git)
#   Key pattern: runbook:def:{id}
#   TTL: 5 minutes (or invalidate on webhook from Git)
#   Cache runbook execution status for active requests
#   Key pattern: runbook:exec:{id}  TTL: 30s (hot path polling)

# Domain 2: FinOps
#   Cache FinOps dashboard summaries (expensive aggregation query)
#   Key pattern: finops:dashboard:{workspace_id}:{period}
#   TTL: 15 minutes
#   Cache cost-vs-reliability scores (computed daily)
#   Key pattern: finops:cvr:{service_id}:{date}
#   TTL: 1 hour
#   Rate-limit anomaly detection API calls
#   Key pattern: finops:ratelimit:{ip}  TTL: 60s

# Domain 3: Autonomous Triage
#   Cache active incident state for the triage agent's hot-path
#   Key pattern: triage:incident:{id}:active
#   TTL: 30s (agent polls frequently)
#   Cache escalation policy tree (small, rarely changes)
#   Key pattern: triage:escalation:{workspace_id}
#   TTL: 10 minutes
#   Distributed lock for self-healing execution (prevent duplicate runs)
#   Key pattern: triage:lock:{incident_id}  TTL: 120s  (NX)

# Domain 4: Local-First Workspace
#   Cache P2P sync session tokens (short-lived)
#   Key pattern: sync:session:{device_id}  TTL: 300s
#   Cache workspace settings (small, frequently read)
#   Key pattern: workspace:settings:{workspace_id}  TTL: 60s
#   Rate-limit P2P sync payloads per device
#   Key pattern: sync:ratelimit:{device_id}  TTL: 1s (burst 10)

# -------- STREAMS (for real-time event bus) --------
# Stream: triage:events  — Incident status changes, new classifications
# Stream: remediation:events — Runbook execution progress
# Stream: finops:anomalies — New cost anomalies detected
# Stream: sync:outbox:{workspace_id} — P2P sync operations to broadcast

# -------- SORTED SETS --------
# finops:recommendations:by_roi  — Scoreboard of recs sorted by ROI
# triage:incidents:by_severity  — Severity-ranked active incidents
# workspace:{id}:activity  — Recent activity timestamps (ZADD)

# -----LOCK CONFIG -----
# Use Redlock-style distributed locks via SET NX EX for:
#   - Self-healing dedup
#   - Cost anomaly computation (prevent concurrent runs)
#   - P2P sync conflict resolution
