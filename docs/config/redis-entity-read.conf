# Redis Caching Configuration — ENTITYMGMT-03 Entity Read (with Observability)
# Bounded Context: Entity Management
#
# This configuration extends the ENTITYMGMT-02 entity instance caching
# with read-through caching and observability tracking.
#
# Entity reads are the most frequent operation. Every GET /api/v1/entities/:id
# triggers:
#   1. A cache lookup (entity:{entity_id})
#   2. On cache HIT: return cached payload, log audit asynchronously
#   3. On cache MISS: fetch from PostgreSQL, populate cache, log audit,
#      enqueue entitymanagement.entity.read event (fire-and-forget)
#
# ============================================================================
# Gherkin Compliance
# ============================================================================
#
# SCENARIO 1 (Successful read):
#   - Cache hit: return cached full payload, fire read event asynchronously
#   - Cache miss: read from PostgreSQL, warm cache, fire read event
#   - Always return: id, schema_id, region, status, version, created_at, updated_at
#
# SCENARIO 2 (Not found):
#   - Cache never stores 404s (no negative caching by default)
#   - Return 404, no entity.read event published
#
# ============================================================================
# Memory Management
# ============================================================================
maxmemory 256mb
maxmemory-policy allkeys-lru

# ============================================================================
# Persistence
# Entities are the source of truth in PostgreSQL. Redis is a cache layer.
# RDB snapshots provide a reasonable balance of durability and performance.
# Since read caches are ephemeral, aggressive saving is not required.
# ============================================================================
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename entity-read-cache.rdb

# ============================================================================
# Networking
# ============================================================================
bind 0.0.0.0
port 6383
tcp-backlog 511
timeout 0
tcp-keepalive 300

# ============================================================================
# Cache Key Naming Convention (ENTITYMGMT-03 Read Caching)
#
# Read Cache (TTL-managed):
#   entity:{entity_id}                         — Full entity payload inc. version (TTL: 5 min)
#                                                  Keyed by UUID or human-readable ID.
#                                                  Value: JSON with all entity fields
#                                                  including version for stale detection.
#
#   entity:list:{schema_id}:{status}:{page}    — Paginated entity list (TTL: 2 min)
#   entity:list:region:{region}:{page}         — Entities by region (TTL: 2 min)
#   entity:count:{schema_id}:{status}          — Entity count by schema+status (TTL: 2 min)
#   entity:zone:{data_residency_zone}          — Entities by residency zone (TTL: 5 min)
#
# Version/Staleness (no expiry):
#   entity:version:{entity_id}                 — Current version number (no expiry)
#                                                Used for read-repair stale detection.
#                                                Compared against cached entity's version.
#
# Cache Invalidation:
#   entity:lock:{entity_id}                    — Distributed lock for read-repair (TTL: 3s)
#                                                Prevents thundering herd on cache miss.
# ============================================================================

# ============================================================================
# Read-Through Cache Flow (ENTITYMGMT-03)
#
# GET /api/v1/entities/{id}:
#
#   [Check Cache]
#   GET entity:{entity_id}
#   ├── HIT: Compare cached version vs entity:version:{entity_id}
#   │   ├── Match → Return cached (fresh)
#   │   └── Mismatch → Stale, read-repair from DB
#   └── MISS: Read from PostgreSQL
#
#   [Read from PostgreSQL]
#   SELECT * FROM get_entity_by_id_with_audit(id, request_id, read_by, origin);
#   ├── found=TRUE → Warm cache, return entity
#   │   SETEX entity:{entity_id} 300 {full_payload}
#   │   SET entity:version:{entity_id} {version}
#   │   Return HTTP 200 with full payload
#   └── found=FALSE → Return HTTP 404 NOT_FOUND
#
#   [Fire-and-Forget Event]
#   On SCENARIO 1 (found): Publish entitymanagement.entity.read via EventBus
#   On SCENARIO 2 (404):    No event published
#
# Cache Invalidation Triggers:
#   - ENTITYMGMT-02 (entity created): SET entity:{entity_id} + entity:version:{entity_id}
#   - ENTITYMGMT-04 (entity updated): DEL entity:{entity_id}; INCR entity:version:{entity_id}
#   - ENTITYMGMT-05 (entity deleted): DEL entity:{entity_id}; INCR entity:version:{entity_id}
#
# Concurrency:
#   Use SETNX entity:lock:{entity_id} for distributed read-repair locking
#   to prevent multiple concurrent reads from all hitting the database.
# ============================================================================

# ============================================================================
# Client Output Buffers
# ============================================================================
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# ============================================================================
# Lazy Freeing
# Entity payloads can be large (JSONB with nested attributes, metadata).
# Lazy freeing prevents latency spikes when evicting large cached objects.
# ============================================================================
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes

# ============================================================================
# Keyspace Notifications
# Ex = Expired events (key eviction)
# g$ = Generic commands + String commands
# K  = Keyspace events (for key-level monitoring)
# ============================================================================
notify-keyspace-events Eg$

# ============================================================================
# Security
# ============================================================================
requirepass "${REDIS_ENTITY_READ_PASSWORD}"
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command CONFIG ""
rename-command KEYS ""
rename-command EVAL ""

# ============================================================================
# Logging
# ============================================================================
loglevel notice
logfile /var/log/redis/entity-read-cache.log

# ============================================================================
# Performance Tuning
# ============================================================================
# Active memory defragmentation for large JSON entity payloads
activedefrag yes
active-defrag-threshold-lower 10
active-defrag-threshold-upper 100
active-defrag-cycle-min 1
active-defrag-cycle-max 25

