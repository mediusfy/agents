# Redis Caching Configuration — ENTITY-04 Optimistic Concurrency Update
# Bounded Context: Entity Management
#
# This configuration extends the ENT-02/ENT-03 caching strategies with
# version-based stale detection for optimistic concurrency control.
#
# When an entity is updated via the optimistic concurrency mechanism:
#   1. The version-checked UPDATE succeeds in PostgreSQL
#   2. Cache entries for the entity are invalidated
#   3. The entity:version:{entity_id} key is INCRemented
#   4. A Pub/Sub message is broadcast for cross-instance invalidation
#
# Version-based stale detection (read-repair):
#   Each cached entity payload stores the `version` field.
#   On GET, compare entity:version:{entity_id} against cached version.
#   If stale → fetch from PostgreSQL, rewrite cache, bump version.

# ============================================================================
# Memory Management
# ============================================================================
maxmemory 256mb
maxmemory-policy allkeys-lru

# ============================================================================
# Persistence
# Entities are the source of truth in PostgreSQL. Redis is a cache layer.
# RDB snapshots provide balance of durability and performance.
# AOF is disabled since cache can be rebuilt from DB on restart.
# ============================================================================
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename entity-update-cache.rdb

# ============================================================================
# Networking
# ============================================================================
bind 0.0.0.0
port 6382
tcp-backlog 511
timeout 0
tcp-keepalive 300

# ============================================================================
# Cache Key Naming Convention (ENTITY-04 Optimistic Concurrency Update)
#
# Read Cache:
#   entity:{entity_id}                         — Full entity payload inc. version (TTL: 5 min)
#   entity:list:{schema_id}:{status}:{page}    — Paginated entity list (TTL: 2 min)
#   entity:list:region:{region}:{page}         — Entities by region (TTL: 2 min)
#   entity:count:{schema_id}:{status}          — Entity count by schema+status (TTL: 2 min)
#   entity:zone:{data_residency_zone}          — Entities by residency zone (TTL: 5 min)
#
# Version-Based Stale Detection (ENTITY-04):
#   entity:version:{entity_id}                 — Current version number (no expiry, INCR on update)
#                                                Used for read-repair stale detection.
#   entity:version:lock:{entity_id}            — Distributed lock for version check (TTL: 10s)
#                                                Prevents race conditions in read-repair.
#
# Invalidation Support:
#   entity:update:{entity_id}                  — Pub/Sub channel for cross-instance invalidation
#                                                { "entityId", "oldVersion", "newVersion", "changedFields" }
#   entity:schema:{schema_id}:cache_keys       — SET of cache keys for the schema's entities
#   entity:stale:{schema_id}                   — SET of entity IDs with stale caches per schema
#
# Optimistic Concurrency Helpers:
#   entity:lock:{entity_id}                    — Optimistic lock for distributed write-through (TTL: 5s)
#                                                Used when app-layer wants distributed coordination.
# ============================================================================

# ============================================================================
# Optimistic Concurrency Cache Flow
#
# UPDATE PATH (write-through):
#   1. Application calls update_entity_optimistic() in PostgreSQL
#   2. On success (ROW_COUNT = 1, version incremented):
#      a. DEL entity:{entity_id}
#      b. INCR entity:version:{entity_id}
#      c. SCAN 0 MATCH entity:list:{schema_id}:* → DEL each matched key
#      d. SCAN 0 MATCH entity:list:region:{region}:* → DEL each matched key
#      e. DEL entity:count:{schema_id}:{OLD_status}
#      f. DEL entity:count:{schema_id}:{NEW_status}
#      g. PUBLISH entity:update:{entity_id} "{ event_payload }"
#
# READ PATH (lazy invalidation / read-repair):
#   1. GET entity:{entity_id}
#   2. If MISS → fetch from PostgreSQL, SET with version, SET entity:version:{entity_id}
#   3. If HIT → compare cached.version vs GET entity:version:{entity_id}
#      a. If equal → return cached (fresh)
#      b. If different → fetch from PostgreSQL, SET with version, return
#
# CONCURRENCY SAFETY:
#   The version check happens atomically in PostgreSQL:
#     UPDATE entities SET ... version = version + 1 WHERE id = $1 AND version = $2
#   This provides serializable isolation for the actual data mutation.
#   Cache operations are best-effort and eventual consistent.
# ============================================================================

# ============================================================================
# Client Output Buffers
# ============================================================================
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# ============================================================================
# Lazy Freeing
# Entity payloads can be large (JSONB with nested attributes).
# Lazy freeing prevents latency spikes when deleting large cached objects.
# ============================================================================
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes

# ============================================================================
# Keyspace Notifications
# Ex = Expired events
# g$ = Generic commands + String commands
# K  = Keyspace events (for key-level monitoring)
# ============================================================================
notify-keyspace-events Eg$

# ============================================================================
# Security
# ============================================================================
requirepass "${REDIS_ENTITY_UPDATE_PASSWORD}"
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command CONFIG ""
rename-command KEYS ""
rename-command EVAL ""

# ============================================================================
# Logging
# ============================================================================
loglevel notice
logfile /var/log/redis/entity-update-cache.log

# ============================================================================
# Performance Tuning
# ============================================================================
# Active memory defragmentation for large JSON entities
activedefrag yes
active-defrag-threshold-lower 10
active-defrag-threshold-upper 100
active-defrag-cycle-min 1
active-defrag-cycle-max 25

