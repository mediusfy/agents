# Redis Caching Configuration — ENT-03 Entity Update Invalidation
# This configuration extends the ENT-02 entity instance caching configuration
# with cache invalidation strategies for entity updates.
#
# When an entity is updated (PUT /api/v1/entities/:id), the following cache
# entries must be invalidated to ensure consistency:
#
#   1. entity:{entity_id}           — Individual entity cache
#   2. entity:list:{schema_id}:*    — All paginated list caches for the schema
#   3. entity:list:region:{region}:* — All paginated list caches for the region
#   4. entity:version:{entity_id}   — Version marker for stale detection
#   5. entity:count:{schema_id}:*   — Entity count caches
#   6. entity:zone:{data_residency_zone} — Residency zone sets

# ============================================================================
# Memory Management
# ============================================================================
maxmemory 256mb
maxmemory-policy allkeys-lru

# ============================================================================
# Persistence
# Entities are the source of truth in PostgreSQL. Redis is a cache layer.
# RDB snapshots provide a reasonable balance of durability and performance.
# ============================================================================
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename entity-instance-cache.rdb

# ============================================================================
# Networking
# ============================================================================
bind 0.0.0.0
port 6381
tcp-backlog 511
timeout 0
tcp-keepalive 300

# ============================================================================
# Cache Key Naming Convention (ENT-02 + ENT-03 Update Invalidation)
#
# Read Cache:
#   entity:{entity_id}                         — Full entity instance (TTL: 5 min)
#   entity:list:{schema_id}:{status}:{page}    — Paginated entity list (TTL: 2 min)
#   entity:list:region:{region}:{page}         — Entities by region (TTL: 2 min)
#   entity:count:{schema_id}:{status}          — Entity count by schema+status (TTL: 2 min)
#   entity:zone:{data_residency_zone}          — Entities by residency zone (TTL: 5 min)
#
# Invalidation Support:
#   entity:version:{entity_id}                 — Monotonically increasing version (no expiry)
#   entity:update:lock:{entity_id}             — Distributed lock for concurrent updates (TTL: 10s)
#   entity:invalidated:{entity_id}             — Set of cache keys invalidated for entity (TTL: 30s)
#   entity:schema:{schema_id}:cache_keys       — Set of all cache key patterns for a schema
#
# Stale Detection (read-repair):
#   entity:stale:{schema_id}                   — Set of entity IDs with stale caches
#   entity:stale:region:{region}               — Set of stale entity IDs in a region
# ============================================================================

# ============================================================================
# Update Cache Invalidation Strategy
#
# Write-through Invalidation (synchronous, in the update transaction):
#   After a successful entity update:
#   1. DEL entity:{entity_id}
#   2. For each cached list that could contain this entity:
#      a. Use SCAN 0 MATCH entity:list:{schema_id}:* to find affected keys
#      b. DEL each matched key
#   3. INCR entity:version:{entity_id}  (bumps version for stale detection)
#   4. PUBLISH entity:update:{entity_id} "{entityId, changedFields[], updatedAt}"
#      (Pub/Sub notification for cross-instance cache invalidation)
#
# Lazy Invalidation (read-repair on GET):
#   When reading an entity, compare entity:version:{entity_id} against the
#   version stored in the cached entity payload. If stale:
#   1. Fetch fresh data from PostgreSQL
#   2. Rewrite cache
#   3. Update version marker
#
# Pub/Sub Invalidation (cross-instance):
#   The CacheInvalidation consumer of entity.EntityUpdated listens for events
#   and performs cache invalidation across all cache nodes:
#   1. Subscribe to entity:update:* channel
#   2. On message: DEL entity:{entityId}; SCAN + DEL list caches
#   3. Propagate to all regional cache replicas
# ============================================================================

# ============================================================================
# Client Output Buffers
# ============================================================================
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# ============================================================================
# Lazy Freeing (important for large cached entity payloads)
# ============================================================================
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes

# ============================================================================
# Keyspace Notifications (for cache invalidation events)
# Ex = Expired events (key eviction)
# g$ = Generic commands + String commands (for SET/DEL monitoring)
# ============================================================================
notify-keyspace-events Eg$

# ============================================================================
# Security
# ============================================================================
requirepass "${REDIS_ENTITY_PASSWORD}"
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command CONFIG ""
rename-command KEYS ""
rename-command EVAL ""

# ============================================================================
# Logging
# ============================================================================
loglevel notice
logfile /var/log/redis/entity-instance-cache.log

# ============================================================================
# Performance Tuning
# ============================================================================
# Active memory defragmentation for large JSON entities
activedefrag yes
active-defrag-threshold-lower 10
active-defrag-threshold-upper 100
active-defrag-cycle-min 1
active-defrag-cycle-max 25
