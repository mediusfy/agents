name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Authenticate git for private pydantic_agents dependency
        run: |
          git config --global url."https://x-access-token:${PYDANTIC_AGENTS_PAT}@github.com/mediusfy/pydantic_agents.git".insteadOf "ssh://git@github.com/mediusfy/pydantic_agents.git"
        env:
          PYDANTIC_AGENTS_PAT: ${{ secrets.PYDANTIC_AGENTS_PAT }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check src/ tests/
      - name: Ruff format check
        run: ruff format --check src/ tests/
      - name: MyPy type check
        run: mypy src/orchestration

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Authenticate git for private pydantic_agents dependency
        run: |
          git config --global url."https://x-access-token:${PYDANTIC_AGENTS_PAT}@github.com/mediusfy/pydantic_agents.git".insteadOf "ssh://git@github.com/mediusfy/pydantic_agents.git"
        env:
          PYDANTIC_AGENTS_PAT: ${{ secrets.PYDANTIC_AGENTS_PAT }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run python tests
        run: pytest tests/ -v --cov=src/orchestration --cov-report=term-missing --cov-report=xml
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
      - name: build
        run: |
          make build
      - name: test
        run: |
          make test

  mcp-test:
    name: MCP server smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Authenticate git for private pydantic_agents dependency
        run: |
          git config --global url."https://x-access-token:${PYDANTIC_AGENTS_PAT}@github.com/mediusfy/pydantic_agents.git".insteadOf "ssh://git@github.com/mediusfy/pydantic_agents.git"
        env:
          PYDANTIC_AGENTS_PAT: ${{ secrets.PYDANTIC_AGENTS_PAT }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Verify MCP server imports
        run: python -c "from orchestration.mcp_server import mcp; print('MCP server imports OK')"
      - name: Verify MCP server initialize handshake
        # Catches regressions that import-only checking would miss: broken tool
        # registration, mismatched MCP protocol version, missing transport deps.
        run: python scripts/mcp_handshake_check.py
