syntax = "proto3";

package entitymanagement.v1;

option go_package = "entity-management/api/protobuf/entitymanagement/v1;entitymanagementv1";

// EntitySchema defines the structure of a type of entity.
message EntitySchema {
  string id = 1;
  string name = 2;
  int32 version = 3;
  repeated AttributeDefinition attributes = 4;
  string created_at = 5;
  string updated_at = 6;
}

// AttributeDefinition describes a single field within an entity schema.
message AttributeDefinition {
  string name = 1;
  string type = 2;
  bool required = 3;
  optional Constraint constraint = 4;
}

// Constraint holds optional validation rules applied to an attribute.
message Constraint {
  repeated string enum = 1;
  optional int32 min = 2;
  optional int32 max = 3;
  string pattern = 4;
}

// Entity is a concrete instance conforming to an EntitySchema.
message Entity {
  string id = 1;
  string schema_id = 2;
  string name = 3;
  string type = 4;
  string region = 5;
  string data_residency_zone = 6;
  string status = 7;
  int32 version = 8;
  bytes attributes = 9;
  bytes metadata = 10;
  string created_at = 11;
  string updated_at = 12;
  optional string deleted_at = 13;
}

// DefineSchemaRequest is the input for defining a new schema.
message DefineSchemaRequest {
  string name = 1;
  repeated AttributeDefinition attributes = 2;
}

// DefineSchemaResponse is the output for a successful schema definition.
message DefineSchemaResponse {
  string id = 1;
  string name = 2;
  int32 version = 3;
}

// CreateEntityRequest is the input for creating a new entity.
message CreateEntityRequest {
  string schema_id = 1;
  string name = 2;
  string type = 3;
  string region = 4;
  bytes attributes = 5;
  bytes metadata = 6;
  string idempotency_key = 7;
}

// CreateEntityResponse is the output for a successful entity creation.
message CreateEntityResponse {
  string id = 1;
  string schema_id = 2;
  string name = 3;
  string type = 4;
  string region = 5;
  string data_residency_zone = 6;
  string status = 7;
  int32 version = 8;
  string created_at = 9;
  string updated_at = 10;
  bool created = 11;
}

// GetEntityRequest is the input for retrieving an entity.
message GetEntityRequest {
  string id = 1;
}

// UpdateEntityRequest is the input for updating an entity.
message UpdateEntityRequest {
  string id = 1;
  int32 expected_version = 2;
  optional string name = 3;
  optional string status = 4;
  optional string region = 5;
  optional bytes attributes = 6;
  optional bytes metadata = 7;
}

// DeleteEntityRequest is the input for deleting an entity.
message DeleteEntityRequest {
  string id = 1;
  bool permanent = 2;
}

// ListEntitiesRequest is the input for listing entities.
message ListEntitiesRequest {
  string schema_id = 1;
  int32 limit = 2;
  string cursor = 3;
  repeated string filters = 4;
  bool include_deleted = 5;
}

// ListEntitiesResponse is the output for listing entities.
message ListEntitiesResponse {
  repeated EntityListItem entities = 1;
  string next_cursor = 2;
  int32 total_count = 3;
}

// EntityListItem is a summary view of an entity for listing purposes.
message EntityListItem {
  string id = 1;
  string schema_id = 2;
  string name = 3;
  string type = 4;
  string region = 5;
  string status = 6;
  string created_at = 7;
  string updated_at = 8;
  optional string deleted_at = 9;
}

// EntityManagementService is the gRPC service for managing entities and schemas.
service EntityManagementService {
  rpc DefineSchema(DefineSchemaRequest) returns (DefineSchemaResponse);
  rpc GetSchema(GetEntityRequest) returns (EntitySchema);
  rpc ListSchemas(GetEntityRequest) returns (stream EntitySchema);
  rpc CreateEntity(CreateEntityRequest) returns (CreateEntityResponse);
  rpc GetEntity(GetEntityRequest) returns (Entity);
  rpc UpdateEntity(UpdateEntityRequest) returns (Entity);
  rpc DeleteEntity(DeleteEntityRequest) returns (Entity);
  rpc ListEntities(ListEntitiesRequest) returns (ListEntitiesResponse);
  rpc RestoreEntity(GetEntityRequest) returns (Entity);
}
