# =============================================================================
# Entity Management - Docker Compose Override (Local Development)
# =============================================================================
# Overrides the base docker-compose.yml for local development.
# Enables hot-reload with Air, exposes debug ports, mounts source code.
# =============================================================================

version: "3.8"

services:
  entity-management:
    # Use hot-reload in development (via Air)
    entrypoint: []
    command:
      - "sh"
      - "-c"
      - |
        go install github.com/air-verse/air@latest
        air \
          --build.cmd "go build -o /tmp/entity-management ./cmd/server/main.go" \
          --build.bin "/tmp/entity-management" \
          --build.delay "1" \
          --build.exclude_dir "bin,dist,node_modules,tmp" \
          --build.include_ext "go,env,yaml,yml" \
          --build.stop_on_error "false" \
          --log.time_format "2006-01-02 15:04:05" \
          --live_reload "true"

    # Mount source code for hot-reload
    volumes:
      - .:/app
    working_dir: /app

    # Debug port (Delve)
    ports:
      - "2345:2345"   # Delve debugger

    environment:
      # Debug mode
      GO_DEBUG: "true"
      LOG_LEVEL: "debug"
