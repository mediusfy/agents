# Redis cache configuration for Entity Management
# Bounded Context: Entity Management
#
# This Redis instance is used for:
#   1. ValidatorCache — Compile and cache schema validation rules
#      (Consumer of entitymanagement.schema.defined events)
#   2. ResidencyContext — Tag schema region and cache zone mappings
#   3. Schema rule caching — Reduce DB load on entity validation
#   4. Entity cache — Reduce DB load on entity reads (idempotent replays)
#   5. Idempotency key cache — Fast lookup for idempotent request replays
#
# Memory policy: allkeys-lru
#   Schema validation rules have uniform access patterns; LRU eviction
#   works well since older/less-frequently-used schemas can be evicted
#   and re-compiled on demand from the source of truth (PostgreSQL).
#
# Persistence: append-only file with every-second fsync
#   Cache can be rebuilt from DB, but AOF reduces warm-up time after
#   restart. every-second fsync offers good performance/durability balance.

# ============================================================================
# Memory Configuration
# ============================================================================

# Max memory: 256 MB (tune based on expected number of schemas × rules size)
# Schema validation rules are typically small (< 1 KB each).
# 256 MB accommodates ~250K schemas with room for key overhead.
maxmemory 256mb

# Eviction policy: Least Recently Used across all keys
# Schema rules are independent — no key grouping needed.
maxmemory-policy allkeys-lru

# ============================================================================
# Persistence (Append-Only File)
# ============================================================================

# Enable AOF for faster warm-up after restart
appendonly yes

# fsync every second (good balance of performance vs durability)
appendfsync everysec

# Rewrite the AOF when it grows to 100% of the previous size
# (i.e., double the original size before triggering rewrite)
auto-aof-rewrite-percentage 100

# Minimum AOF size before rewrite is considered (64 MB)
auto-aof-rewrite-min-size 64mb

# ============================================================================
# Connection Settings
# ============================================================================

# Listen on all interfaces (containerized deployment)
bind 0.0.0.0

# Protected mode: disabled in container/trusted networks
protected-mode no

# Port (standard Redis port)
port 6379

# TCP backlog (how many connections can queue)
tcp-backlog 511

# Timeout: close idle connections after 300 seconds (5 minutes)
timeout 300

# TCP keepalive: 60 seconds
tcp-keepalive 60

# ============================================================================
# Cache Key Naming Convention
# ============================================================================
#
# -- Existing keys (from ENTITYMGMT-01) --
#
# Schema validation rule cache:
#   Key:   schema:rules:{schema_id}
#   Value: JSON-serialized compiled validation rules
#   TTL:   1 hour (3600 seconds) — re-fetched from DB on miss
#
# Schema existence check:
#   Key:   schema:exists:{schema_name}
#   Value: "1" if exists, "0" if not
#   TTL:   5 minutes (300 seconds) — short-lived to avoid stale negatives
#
# Residency zone mapping:
#   Key:   residency:zone:{region}
#   Value: JSON { zone: "us-east-1", ... }
#   TTL:   1 hour (3600 seconds)
#
# Event deduplication:
#   Key:   event:dedup:{event_id}
#   Value: "1" if processed
#   TTL:   7 days (604800 seconds) — matches idempotency TTL in PostgreSQL
#
# -- New keys (from ENTITYMGMT-02) --
#
# Entity cache (for GET queries and idempotent replays):
#   Key:   entity:{entity_id}
#   Value: JSON-serialized entity (includes all fields)
#   TTL:   5 minutes (300 seconds) — entities can be updated, keep TTL short
#
# Idempotency key cache (fast path for SCENARIO 2 replays):
#   Key:   idempotency:req:{request_key}
#   Value: JSON { entity_id, expires_at }
#   TTL:   7 days (604800 seconds) — matches PostgreSQL TTL
#          Set on entity creation and read on idempotent replays
#
# Entity list cache (for listing entities by schema):
#   Key:   entities:schema:{schema_id}:status:{status}:page:{page_token}
#   Value: JSON array of entity summaries
#   TTL:   1 minute (60 seconds) — lists change frequently
#
# Data residency zone cache (for region-to-zone mapping):
#   Key:   residency:zone:{region}
#   Value: JSON { zone: "eu", region: "eu-west-1" }
#   TTL:   1 day (86400 seconds) — mapping is immutable
#
# Entity count cache (dashboard metrics):
#   Key:   entities:count:{schema_id}:{status}
#   Value: Integer count
#   TTL:   1 minute (60 seconds) — counts are near-real-time

# ============================================================================
# Lazy Freeing (non-blocking DEL/UNLINK)
# ============================================================================

# Use asynchronous deletion to avoid blocking the event loop
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes

# ============================================================================
# Logging
# ============================================================================

# Log level: notice (informational + warnings + errors)
loglevel notice

# Log to stdout (containerized deployment)
logfile ""

# ============================================================================
# Advanced Configuration
# ============================================================================

# Hash-max-ziplist-entries: 512 entries before switching to hash table
hash-max-ziplist-entries 512
hash-max-ziplist-value 64

# Set-max-intset-entries: 512 entries before switching to hash table
set-max-intset-entries 512

# Active defragmentation (disabled by default — enable if needed)
activedefrag no
