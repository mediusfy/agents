# =============================================================================
# OpenTelemetry Collector Configuration
# =============================================================================
# ENTITYMGMT-03: Read observability events
# ENTITYMGMT-10: Domain event monitoring via NATS
# ENTITYMGMT-12: App startup health, traces, metrics
# =============================================================================

receivers:
  # Receives traces/metrics/logs via OTLP gRPC (port 4317)
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # Scrape Prometheus metrics from the entity-management /metrics endpoint
  prometheus:
    config:
      scrape_configs:
        - job_name: "entity-management"
          scrape_interval: 10s
          static_configs:
            - targets: ["entity-management:8080"]

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024

  memory_limiter:
    check_interval: 1s
    limit_mib: 500
    spike_limit_mib: 100

  attributes:
    actions:
      - key: service.name
        value: entity-management
        action: upsert

  # Sampler: only keep 10% of traces for cost management
  probabilistic_sampler:
    sampling_percentage: 10

exporters:
  # Debug console output (for local dev)
  debug:
    verbosity: detailed

  # OTLP exporter to your observability backend (e.g., Grafana, Datadog, Honeycomb)
  otlp:
    endpoint: "${OTLP_ENDPOINT:-localhost:4317}"
    tls:
      insecure: true

  # Prometheus exporter for metrics
  prometheus:
    endpoint: 0.0.0.0:8889

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug, otlp]

    metrics:
      receivers: [otlp, prometheus]
      processors: [memory_limiter, batch]
      exporters: [debug, otlp, prometheus]

    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug, otlp]
