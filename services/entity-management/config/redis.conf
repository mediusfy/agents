# Redis Configuration for Entity Management Service
# ==================================================
# Optimized for cursor-based pagination caching and query result caching.
#
# ENTITYMGMT-09: Cursor tokens are cached for quick decode/validation
# without hitting the database. This reduces latency for paginated queries.
#
# Architecture:
#   - Cursor tokens → TTL 24h (cursor keyspace: "cursor:{schema_id}:{encoded_cursor}")
#   - Query results (frequently accessed pages) → TTL 60s (result keyspace: "page:{schema_id}:{filters_hash}")
#   - Rate limiting → TTL varies (ratelimit keyspace)
#   - Session data → TTL 1h (session keyspace)

# ============================================================================
# General Configuration
# ============================================================================

# Max memory: 256MB — sufficient for cursor caching + moderate query caching
maxmemory 256mb

# Eviction policy: allkeys-lru — evict least recently used keys when full.
# Cursor tokens have a TTL, so expired keys are naturally evicted.
# LRU ensures frequently used cursors stay cached.
maxmemory-policy allkeys-lru

# Persistence: Append-Only File for durability.
# Cursor cache can be rebuilt from DB on restart, but AOF provides
# faster warm-up for frequently accessed cursors.
appendonly yes
appendfsync everysec

# ============================================================================
# Performance Tuning
# ============================================================================

# Timeout: close idle connections after 300 seconds to free resources
timeout 300

# TCP keepalive: detect dead peers every 300 seconds
tcp-keepalive 300

# Max connected clients
maxclients 10000

# ============================================================================
# Keyspace Configuration (Documentation Only)
# ============================================================================
#
# Key naming conventions for the Entity Management service:
#
# --- Cursor Cache ---
# Key:   cursor:{schema_id}:{md5_of_cursor_value}
# Value: JSON { created_at, entity_id }
# TTL:   86400 (24 hours)
# Notes: Used by the application to quickly validate and decode cursor tokens
#        without base64 decode + DB lookup. Cached on first decode.
#
# --- Entity Page Cache (Optional) ---
# Key:   page:{schema_id}:{filters_hash}:{limit}:{cursor_hash}
# Value: JSON array of entity summaries
# TTL:   60 (60 seconds — short TTL for eventual consistency)
# Notes: Caches the result of a paginated query. Only suitable for data that
#        changes infrequently. Invalidate on entity create/update/delete.
#
# --- Rate Limiting ---
# Key:   ratelimit:{client_ip}:{endpoint}
# Value: Counter (INCR)
# TTL:   1 (sliding window)
# Notes: Used by the rate limiter middleware.
#
# --- Request Idempotency (Secondary Cache) ---
# Key:   idempotency:{request_key}
# Value: entity_id
# TTL:   604800 (7 days — matches DB TTL)
# Notes: Warm cache for idempotency key lookups. DB is the source of truth.

# ============================================================================
# Lazy Freeing (for large caches)
# ============================================================================

# Use lazy free for all evictions to avoid blocking the main event loop
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
