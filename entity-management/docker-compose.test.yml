# =============================================================================
# Entity Management - Test Docker Compose
# =============================================================================
# Overrides docker-compose.yml for CI / local test runs.
# Provides ephemeral Postgres + NATS with no volume persistence.
# =============================================================================

version: "3.8"

services:
  entity-management:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder  # Use builder stage for test compilation
    container_name: entity-management-test
    environment:
      HTTP_PORT: "8080"
      DATABASE_URL: "postgres://postgres:postgres@postgres-test:5432/entity_management_test?sslmode=disable"
      NATS_URL: "nats://nats-test:4222"
      ENTITYMGMT_DEFAULT_REGION: "us-east-1"
      ENTITYMGMT_ALLOWED_REGIONS: "us-east-1,eu-west-1"
      ENTITYMGMT_IDEMPOTENCY_TTL_HOURS: "168"
      GO_TEST_FLAGS: "-v -race -count=1 -coverprofile=coverage.out"
    command:
      - "sh"
      - "-c"
      - |
        echo "Running tests..."
        go test -v -race -count=1 -coverprofile=coverage.out ./...
        echo "Test exit code: $$?"
    depends_on:
      postgres-test:
        condition: service_healthy
      nats-test:
        condition: service_healthy

  postgres-test:
    image: postgres:16-alpine
    container_name: entity-management-postgres-test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: entity_management_test
    ports:
      - "5433:5432"  # Different port to avoid conflict with dev DB
    tmpfs:
      - /var/lib/postgresql/data:rw  # Ephemeral storage
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d entity_management_test"]
      interval: 1s
      timeout: 2s
      retries: 10
    networks:
      - test-network

  nats-test:
    image: nats:2.10-alpine
    container_name: entity-management-nats-test
    ports:
      - "4223:4222"  # Different port to avoid conflict
    command:
      - "--jetstream"
      - "--max_payload=1MB"
    tmpfs:
      - /data/nats:rw  # Ephemeral storage
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8222/healthz || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 5
    networks:
      - test-network

networks:
  test-network:
    driver: bridge
