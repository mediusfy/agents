# ============================================================================
# Redis Configuration — Entity Management Caching
# Story: ENTITYMGMT-05 — Soft-Delete and Restore Entities
# Bounded Context: Entity Management
#
# This configuration handles cache invalidation for soft-deleted and
# restored entities. Key design principles:
#   1. Soft-deleted entities MUST be evicted from cache immediately
#   2. Restored entities MUST be cacheable after restoration
#   3. Default listing queries (excluding deleted) use cache-aside
#   4. Admin queries (include_deleted=true) bypass or invalidate cache
# ============================================================================

# --- Baseline Configuration ---
maxmemory 256mb
maxmemory-policy allkeys-lru
appendonly yes
appendfsync everysec

# --- Key Naming Conventions ---
# Entity by ID:         entity:{entity_id}
# Entity list (schema): entity:list:{schema_id}:{status_filter}
# Soft-delete marker:   entity:deleted:{entity_id}
# Deleted entity list:  entity:deleted:list:{schema_id}

# --- TTL Policies ---
# Active entities:    TTL = 300s (5 minutes)
# List results:       TTL = 60s  (1 minute, for pagination freshness)
# Soft-delete marker: TTL = 86400s (24 hours, for immediate re-delete detection)
# Restored entity:    Inherits active entity TTL after refresh

# --- Cache Invalidation Rules ---
# On soft-delete (DELETE /api/v1/entities/{id}):
#   DEL entity:{entity_id}          — Evict the entity cache
#   DEL entity:list:{schema_id}:*   — Evict all list caches for this schema
#   SET entity:deleted:{entity_id} "1" EX 86400 — Mark as deleted in cache
#
# On restore (POST /api/v1/entities/{id}/restore):
#   DEL entity:deleted:{entity_id}  — Remove deletion marker
#   DEL entity:list:{schema_id}:*   — Evict all list caches (entity now qualifies)
#
# On entity creation (POST /api/v1/entities):
#   DEL entity:list:{schema_id}:*   — Evict relevant lists
#
# On entity update (PUT /api/v1/entities/{id}):
#   DEL entity:{entity_id}          — Evict the specific entity
#   DEL entity:list:{schema_id}:*   — Evict list caches (status may have changed)

# --- Cache-Aside Pattern for List Queries ---
# GET /api/v1/entities?schema_id=X
#   1. Check cache: EXISTS entity:list:{schema_id}:{page}:{limit}
#   2. If hit → return cached JSON (TTL = 60s)
#   3. If miss → query list_entities_by_schema(schema_id, include_deleted=FALSE)
#       → Cache result: SETEX entity:list:{schema_id}:{page}:{limit} 60 <json>
#       → Return result
#
# Note: The list query ALWAYS excludes soft-deleted entities by default
# (include_deleted=FALSE). This is enforced by the database function
# list_entities_by_schema() and the corresponding cache key does NOT
# include the include_deleted parameter for default queries.

# --- Cache-Aside Pattern for Individual Entity Reads ---
# GET /api/v1/entities/{id}
#   1. Check cache: EXISTS entity:{entity_id}
#   2. If hit → check soft-delete marker: EXISTS entity:deleted:{entity_id}
#      a. If marker exists → entity is soft-deleted, return 200 with
#         deleted status (still readable by ID, just not in lists)
#      b. If no marker → return cached entity JSON
#   3. If miss → query get_entity_by_id(entity_id, include_deleted=TRUE)
#       → Set cache: SETEX entity:{entity_id} 300 <json>
#       → If entity.deleted_at IS NOT NULL:
#         Set marker: SETEX entity:deleted:{entity_id} 86400 "1"
#       → Return result

# --- Error Handling ---
# Cache failures should be non-blocking:
#   - If Redis is down, fall through to the database query
#   - Log the error but do NOT return an HTTP error
#   - Use circuit breaker pattern for Redis connections
#   - Max retries: 3 with exponential backoff (100ms, 200ms, 400ms)

# --- Pipelining for Bulk Operations ---
# When soft-deleting or restoring multiple entities in a batch:
#   PIPELINE:
#     DEL entity:{id1} entity:{id2} entity:{id3}
#     DEL entity:list:{schema_id}:*
#     SET entity:deleted:{id1} "1" EX 86400
#     SET entity:deleted:{id2} "1" EX 86400
#   EXEC
#
# This ensures atomic cache invalidation across batch operations.

# --- Monitoring ---
# Track cache hit/miss ratios for entity lookups:
#   - entity:cache:hits:{entity_id}
#   - entity:cache:misses:{entity_id}
#
# Track soft-delete/restore cache invalidations:
#   - entity:cache:invalidate:soft_delete
#   - entity:cache:invalidate:restore
