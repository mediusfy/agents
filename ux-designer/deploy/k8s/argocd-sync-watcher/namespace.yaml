# ArgoCD Sync Watcher
# Monitors ArgoCD sync events and exposes Prometheus metrics for GitOps-native remediation.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-sync-watcher
  namespace: argocd
  labels:
    app: argocd-sync-watcher
    component: gitops
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: argocd-sync-watcher
  template:
    metadata:
      labels:
        app: argocd-sync-watcher
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      serviceAccountName: argocd-sync-watcher
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: watcher
        image: ghcr.io/drewjocham/argocd-sync-watcher:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 9090
          name: metrics
        env:
        - name: ARGOCD_SERVER
          value: "argocd-server.argocd.svc.cluster.local:443"
        - name: ARGOCD_INSECURE
          value: "false"
        - name: WATCHER_PORT
          value: "8080"
        - name: METRICS_PORT
          value: "9090"
        - name: LOG_LEVEL
          value: "info"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: argocd-sync-watcher
  namespace: argocd
  labels:
    app: argocd-sync-watcher
spec:
  selector:
    app: argocd-sync-watcher
  ports:
  - port: 8080
    targetPort: http
    name: http
  - port: 9090
    targetPort: metrics
    name: metrics
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argocd-sync-watcher
  namespace: argocd
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argocd-sync-watcher
  namespace: argocd
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-sync-watcher
  namespace: argocd
subjects:
- kind: ServiceAccount
  name: argocd-sync-watcher
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argocd-sync-watcher
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: argocd-sync-watcher
  namespace: argocd
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: argocd-sync-watcher
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: argocd-sync-watcher
  namespace: argocd
spec:
  podSelector:
    matchLabels:
      app: argocd-sync-watcher
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: argocd
    ports:
    - port: 8080
      protocol: TCP
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: argocd
    ports:
    - port: 443
      protocol: TCP
  - to:
    - namespaceSelector: {}
    ports:
    - port: 9090
      protocol: TCP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-sync-watcher
  namespace: argocd
data:
  config.yaml: |
    webhook:
      port: 8080
      path: /webhook
    ring_buffer_size: 100
    metrics:
      port: 9090
      prefix: argocd_watcher
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: argocd-sync-watcher
  namespace: argocd
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: argocd-sync-watcher
  minReplicas: 1
  maxReplicas: 3
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 80
