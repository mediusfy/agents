<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=1440"><title>AI Chat — Rufkis</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:rgba(0,0,0,0.3);display:flex;align-items:flex-end;justify-content:flex-end;min-height:100vh;font-size:14px;color:#1A1A1A;padding-bottom:0;padding-right:20px}
.panel{width:420px;height:560px;background:#FFFFFF;border-radius:12px 12px 0 0;border:1px solid #E8E8EC;border-bottom:none;box-shadow:0 -4px 32px rgba(0,0,0,0.08);display:flex;flex-direction:column;overflow:hidden}
.panel:focus-visible{outline:2px solid #6C31FF;outline-offset:2px}
.header{padding:12px 16px;border-bottom:1px solid #E8E8EC;display:flex;align-items:center;gap:8px}
.header .avatar{width:28px;height:28px;border-radius:8px;background:#E8E6FF;color:#6C31FF;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
.header .name{font-size:13px;font-weight:600;color:#1A1A1A}
.header .version{font-size:10px;padding:2px 6px;border-radius:4px;background:#E3F5E5;color:#1B8A2F;font-weight:500}
.messages{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:10px;scrollbar-width:thin;scrollbar-color:#D0D0D4 transparent}
.msg{max-width:85%;padding:10px 14px;border-radius:12px;font-size:12.5px;line-height:1.5}
.msg.user{background:#6C31FF;color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.msg.ai{background:#F5F5F7;color:#1A1A1A;align-self:flex-start;border-bottom-left-radius:4px;border:1px solid #E8E8EC}
.msg .warning-block{margin-top:6px;padding:6px 10px;border-radius:8px;background:#FFF1E0;color:#E57800;font-size:11px;border:1px solid rgba(255,173,66,0.2)}
.input-bar{display:flex;gap:8px;padding:10px 12px;border-top:1px solid #E8E8EC;background:#FAFAFC}
.input-bar input{flex:1;padding:8px 12px;border-radius:6px;border:1px solid #E2E2E5;background:#fff;font-size:12.5px;font-family:'Inter',sans-serif;outline:none;color:#1A1A1A}
.input-bar input:focus{border-color:#6C31FF}
.input-bar input:focus-visible{outline:2px solid #6C31FF;outline-offset:1px}
.input-bar button{padding:8px 14px;border-radius:6px;border:0;background:#6C31FF;color:#fff;font-size:12.5px;cursor:pointer;font-family:'Inter',sans-serif;font-weight:500}
.input-bar button:hover{background:#5B28E0}
.input-bar button:focus-visible{outline:2px solid #6C31FF;outline-offset:2px}
</style>
</head>
<body>
<div class="panel" role="dialog" aria-label="AI Chat" aria-modal="true" data-testid="ai-chat-panel">
  <div class="header">
    <div class="avatar">Ai</div>
    <span class="name">Rufkis AI</span>
    <span class="version">v2.3</span>
  </div>
  <div class="messages" aria-label="Chat messages" data-testid="chat-messages">
    <div class="msg ai" data-testid="msg-0">Hello! I'm your Kubernetes assistant. How can I help?</div>
    <div class="msg user" data-testid="msg-1">What's causing the memory pressure in kube-system?</div>
    <div class="msg ai" data-testid="msg-2">
      The kube-apiserver-1 pod is using 92% of its memory limit. This correlates with the recent etcd compaction backlog.<br><br>
      <div class="warning-block">Suggestion: Increase --memory-limit to 6Gi</div>
    </div>
  </div>
  <div class="input-bar">
    <input type="text" placeholder="Ask Rufkis anything..." value="Show recent events" aria-label="Chat input" data-testid="chat-input">
    <button aria-label="Send message" data-testid="chat-send">Send</button>
  </div>
</div>
</body>
</html>
