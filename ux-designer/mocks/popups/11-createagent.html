<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=1440"><title>Create Agent — Rufkis</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:rgba(0,0,0,0.3);display:flex;align-items:center;justify-content:center;min-height:100vh;font-size:14px;color:#1A1A1A}
.dialog{width:520px;background:#FFFFFF;border-radius:12px;border:1px solid #E8E8EC;box-shadow:0 8px 32px rgba(0,0,0,0.12);padding:24px}
.dialog:focus-visible{outline:2px solid #6C31FF;outline-offset:2px}
.dialog h3{font-size:16px;font-weight:600;color:#1A1A1A;margin-bottom:6px}
.dialog .subtitle{font-size:12px;color:#7A7A80;margin-bottom:20px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:11px;font-weight:600;color:#999;text-transform:uppercase;letter-spacing:.04em}
.field input,.field select{height:34px;padding:0 10px;border-radius:6px;border:1px solid #E2E2E5;background:#fff;font-size:13px;font-family:'Inter',sans-serif;outline:none;color:#1A1A1A}
.field input:focus,.field select:focus{border-color:#6C31FF}
.field input:focus-visible,.field select:focus-visible{outline:2px solid #6C31FF;outline-offset:1px}
.field textarea{height:80px;padding:8px 10px;border-radius:6px;border:1px solid #E2E2E5;background:#fff;font-size:13px;font-family:'Inter',sans-serif;outline:none;resize:none;color:#1A1A1A}
.field textarea:focus{border-color:#6C31FF}
.field textarea:focus-visible{outline:2px solid #6C31FF;outline-offset:1px}
.field .hint{font-size:10px;color:#999;margin-top:2px}
.field.full{grid-column:1/-1}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.chip{display:flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;background:#E8E6FF;color:#6C31FF;font-size:11px;font-weight:500}
.chip .remove{cursor:pointer;opacity:0.6;display:flex;align-items:center}
.chip .remove:hover{opacity:1}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
.btn{padding:9px 20px;border-radius:6px;border:1px solid #E2E2E5;background:#fff;color:#555;font-size:13px;font-family:'Inter',sans-serif;cursor:pointer;font-weight:500}
.btn:hover{background:#F5F5F7;border-color:#C0C0C6}
.btn:focus-visible{outline:2px solid #6C31FF;outline-offset:2px}
.btn.primary{background:#6C31FF;color:#fff;border-color:#6C31FF}
.btn.primary:hover{background:#5B28E0}
</style>
</head>
<body>
<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="create-agent-title" data-testid="create-agent-dialog">
  <h3 id="create-agent-title">Create Agent</h3>
  <p class="subtitle">Define a new autonomous agent for your cluster.</p>

  <div class="form-row">
    <div class="field">
      <label for="agent-name">Name</label>
      <input type="text" id="agent-name" value="Cost Optimizer" placeholder="e.g. Cost Optimizer" data-testid="create-agent-name">
    </div>
    <div class="field">
      <label for="agent-type">Type</label>
      <select id="agent-type" data-testid="create-agent-type">
        <option value="watcher">Watcher</option>
        <option value="scheduler">Scheduler</option>
        <option value="analyzer" selected>Analyzer</option>
        <option value="integration">Integration</option>
      </select>
    </div>
  </div>

  <div class="field full">
    <label for="agent-desc">Description</label>
    <textarea id="agent-desc" data-testid="create-agent-desc">Monitor cloud costs and recommend savings</textarea>
  </div>

  <div class="field full">
    <label for="agent-namespaces">Target Namespaces</label>
    <input type="text" id="agent-namespaces" value="production, staging" placeholder="Comma-separated namespaces" data-testid="create-agent-ns">
    <div class="hint">Leave empty for cluster-wide scope</div>
    <div class="chips">
      <span class="chip" data-testid="ns-chip-production">production <span class="remove" role="button" tabindex="0" aria-label="Remove production">×</span></span>
      <span class="chip" data-testid="ns-chip-staging">staging <span class="remove" role="button" tabindex="0" aria-label="Remove staging">×</span></span>
    </div>
  </div>

  <div class="field full">
    <label for="agent-model">Model</label>
    <select id="agent-model" data-testid="create-agent-model">
      <option value="default">Default (auto)</option>
      <option value="claude-sonnet">Claude Sonnet 4</option>
      <option value="deepseek-chat">DeepSeek Chat</option>
      <option value="gpt-4o">GPT-4o</option>
    </select>
  </div>

  <div class="actions">
    <button class="btn" data-testid="create-agent-cancel">Cancel</button>
    <button class="btn primary" data-testid="create-agent-submit">Create Agent</button>
  </div>
</div>
</body>
</html>
