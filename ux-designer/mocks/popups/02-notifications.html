<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=1440"><title>Notifications — Rufkis</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:rgba(0,0,0,0.3);display:flex;align-items:flex-start;justify-content:flex-end;min-height:100vh;font-size:14px;color:#1A1A1A;padding-top:52px;padding-right:80px}
.popup{width:420px;background:#FFFFFF;border-radius:12px;border:1px solid #E8E8EC;box-shadow:0 8px 32px rgba(0,0,0,0.12);overflow:hidden}
.header{padding:14px 16px;border-bottom:1px solid #E8E8EC;display:flex;align-items:center}
.header h2{font-size:14px;font-weight:600;color:#1A1A1A}
.header .badge{font-size:10px;font-weight:600;padding:1px 6px;border-radius:999px;background:rgba(217,48,37,0.1);color:#D93025;margin-left:6px}
.header .mark-read{font-size:11px;color:#6C31FF;margin-left:auto;cursor:pointer}
.header .mark-read:hover{text-decoration:underline}
.list{max-height:400px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#D0D0D4 transparent}
.notif{display:flex;gap:10px;padding:12px 16px;border-bottom:1px solid #F2F2F4}
.notif:last-child{border-bottom:none}
.notif .dot{width:8px;height:8px;border-radius:999px;margin-top:5px;flex-shrink:0}
.notif .dot.critical{background:#D93025}
.notif .dot.warning{background:#FFAD42}
.notif .dot.info{background:#6C31FF}
.notif .body{flex:1}
.notif .body .title{font-size:12.5px;color:#1A1A1A;font-weight:500}
.notif .body .sub{font-size:11px;color:#7A7A80;margin-top:2px}
.notif .time{font-size:10px;color:#999;white-space:nowrap}
</style>
</head>
<body>
<div class="popup" role="dialog" aria-label="Notifications" aria-modal="true" data-testid="notifications-popup">
  <div class="header">
    <h2>Notifications</h2>
    <span class="badge" data-testid="notif-count">5</span>
    <span class="mark-read" role="button" tabindex="0" aria-label="Mark all as read" data-testid="mark-all-read">Mark all read</span>
  </div>
  <div class="list" role="list" aria-label="Notification list">
    <div class="notif" role="listitem" data-testid="notif-1">
      <div class="dot critical" aria-label="Critical severity"></div>
      <div class="body">
        <div class="title">CRITICAL: Memory pressure in kube-system</div>
        <div class="sub">kube-apiserver-1 using 92%</div>
      </div>
      <span class="time">2m ago</span>
    </div>
    <div class="notif" role="listitem" data-testid="notif-2">
      <div class="dot critical" aria-label="Critical severity"></div>
      <div class="body">
        <div class="title">CRITICAL: Node NotReady</div>
        <div class="sub">ip-10-0-12-34 unresponsive</div>
      </div>
      <span class="time">13m ago</span>
    </div>
    <div class="notif" role="listitem" data-testid="notif-3">
      <div class="dot warning" aria-label="Warning severity"></div>
      <div class="body">
        <div class="title">WARNING: Error rate high</div>
        <div class="sub">ingress/api-gateway 5.2%</div>
      </div>
      <span class="time">22m ago</span>
    </div>
    <div class="notif" role="listitem" data-testid="notif-4">
      <div class="dot info" aria-label="Info severity"></div>
      <div class="body">
        <div class="title">Certificate nearing expiry</div>
        <div class="sub">secret/tls-ingress</div>
      </div>
      <span class="time">2h ago</span>
    </div>
  </div>
</div>
</body>
</html>
