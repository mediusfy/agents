<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=1440"><title>Toast — Rufkis</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:rgba(0,0,0,0.3);display:flex;justify-content:flex-end;padding-top:16px;padding-right:16px;min-height:100vh;font-size:14px;color:#1A1A1A}
.toast-container{width:360px;display:flex;flex-direction:column;gap:8px}
.toast{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:10px;border:1px solid #E8E8EC;box-shadow:0 4px 16px rgba(0,0,0,0.08);animation:slideIn 0.2s ease-out}
@keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
.toast:focus-visible{outline:2px solid #6C31FF;outline-offset:2px}
.toast.success{background:#E3F5E5;border-color:#00C875;color:#1B8A2F}
.toast.info{background:#E8E6FF;border-color:#6C31FF;color:#6C31FF}
.toast.warning{background:#FFF1E0;border-color:#FFAD42;color:#E57800}
.toast.error{background:#FFE8E8;border-color:#D93025;color:#D93025}
.toast .icon{width:16px;height:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.toast .message{font-size:12.5px;font-weight:500;flex:1;line-height:1.4}
.toast .dismiss{width:16px;height:16px;cursor:pointer;opacity:0.5;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.toast .dismiss:hover{opacity:1}
</style>
</head>
<body>
<div class="toast-container" role="status" aria-live="polite" aria-label="Notifications" data-testid="toast-container">
  <div class="toast success" role="alert" data-testid="toast-success">
    <div class="icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg></div>
    <span class="message">Pod api-gateway updated successfully</span>
    <div class="dismiss" role="button" tabindex="0" aria-label="Dismiss" data-testid="toast-dismiss-1"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></div>
  </div>
  <div class="toast info" role="alert" data-testid="toast-info">
    <div class="icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12.01" y2="16"/><line x1="12" y1="8" x2="12" y2="12"/></svg></div>
    <span class="message">Ingress migration 3 of 4 steps complete</span>
    <div class="dismiss" role="button" tabindex="0" aria-label="Dismiss" data-testid="toast-dismiss-2"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></div>
  </div>
  <div class="toast warning" role="alert" data-testid="toast-warning">
    <div class="icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg></div>
    <span class="message">CPU threshold exceeded on node-3 (85%)</span>
    <div class="dismiss" role="button" tabindex="0" aria-label="Dismiss" data-testid="toast-dismiss-3"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></div>
  </div>
  <div class="toast error" role="alert" data-testid="toast-error">
    <div class="icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg></div>
    <span class="message">Failed to deploy frontend: image pull backoff</span>
    <div class="dismiss" role="button" tabindex="0" aria-label="Dismiss" data-testid="toast-dismiss-4"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></div>
  </div>
</div>
</body>
</html>
