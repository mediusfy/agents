<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=1440"><title>Command Palette — Rufkis</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:rgba(0,0,0,0.3);display:flex;align-items:center;justify-content:center;min-height:100vh;font-size:14px;color:#1A1A1A}
.palette{width:560px;background:#FFFFFF;border-radius:12px;border:1px solid #E8E8EC;box-shadow:0 8px 32px rgba(0,0,0,0.12);overflow:hidden}
.palette input{width:100%;padding:16px 16px 14px;border:0;font-size:15px;font-family:'Inter',sans-serif;outline:none;color:#1A1A1A;background:#FFFFFF;border-bottom:1px solid #E8E8EC}
.palette input::placeholder{color:#999}
.palette input:focus-visible{outline:2px solid #6C31FF;outline-offset:-2px;border-radius:12px 12px 0 0}
.results{max-height:360px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#D0D0D4 transparent}
.result-item{display:flex;align-items:center;gap:10px;padding:10px 16px;cursor:pointer;border-bottom:1px solid #F2F2F4}
.result-item:hover,.result-item.selected{background:rgba(108,49,255,0.04)}
.result-item:focus-visible{outline:2px solid #6C31FF;outline-offset:-2px}
.result-item .icon-wrap{width:28px;height:28px;border-radius:6px;background:#F5F5F7;color:#7A7A80;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.result-item .label{font-size:13px;font-weight:500;color:#1A1A1A;flex:1}
.result-item .desc{font-size:11px;color:#7A7A80}
.result-item .key-hint{font-size:9px;color:#999;background:#F5F5F7;padding:1px 5px;border-radius:4px}
.footer{font-size:11px;color:#999;padding:8px 16px;display:flex;gap:16px;border-top:1px solid #F2F2F4;background:#FAFAFC}
.category-label{padding:8px 16px 4px;font-size:10px;font-weight:600;color:#999;text-transform:uppercase;letter-spacing:.04em}
</style>
</head>
<body>
<div class="palette" role="dialog" aria-label="Command palette" aria-modal="true">
  <input type="text" placeholder="Search commands or type ? for help..." value="monitoring" aria-label="Search commands" data-testid="cmd-search">
  <div class="results" role="listbox" aria-label="Commands">
    <div class="category-label">Navigation</div>
    <div class="result-item selected" role="option" aria-selected="true" tabindex="0" data-testid="cmd-item-1">
      <div class="icon-wrap"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 20v-6M6 20V10M18 20V4"/></svg></div>
      <div class="label">Monitoring Dashboard</div>
      <div class="desc">Navigate to Monitoring</div>
      <span class="key-hint">Enter</span>
    </div>
    <div class="result-item" role="option" aria-selected="false" tabindex="0" data-testid="cmd-item-2">
      <div class="icon-wrap"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 20v-6M6 20V10M18 20V4"/></svg></div>
      <div class="label">Create Alert</div>
      <div class="desc">New monitoring alert rule</div>
    </div>
    <div class="category-label">Search</div>
    <div class="result-item" role="option" aria-selected="false" tabindex="0" data-testid="cmd-item-3">
      <div class="icon-wrap"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></div>
      <div class="label">Search: monitoring config</div>
      <div class="desc">Search across Knowledge</div>
    </div>
  </div>
  <div class="footer">
    <span>↑↓ Navigate</span>
    <span>Enter Select</span>
    <span>Esc Close</span>
  </div>
</div>
</body>
</html>
