<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=1440"><title>Context Menu — Rufkis</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:rgba(0,0,0,0.3);display:flex;align-items:flex-start;justify-content:flex-start;min-height:100vh;font-size:14px;color:#1A1A1A;padding-top:200px;padding-left:300px}
.menu{width:200px;background:#FFFFFF;border-radius:10px;border:1px solid #E8E8EC;box-shadow:0 8px 32px rgba(0,0,0,0.12);overflow:hidden}
.menu:focus-visible{outline:2px solid #6C31FF;outline-offset:2px}
.item{display:flex;align-items:center;gap:8px;padding:8px 14px;font-size:12.5px;color:#555;cursor:pointer}
.item:hover{background:rgba(108,49,255,0.04);color:#6C31FF}
.item:focus-visible{outline:2px solid #6C31FF;outline-offset:-2px}
.item .icon{width:16px;height:16px;color:#999;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.item:hover .icon{color:#6C31FF}
.separator{height:1px;background:#F2F2F4;margin:4px 8px}
.item.danger{color:#D93025}
.item.danger:hover{background:rgba(217,48,37,0.04);color:#D93025}
.item.danger:hover .icon{color:#D93025}
</style>
</head>
<body>
<div class="menu" role="menu" aria-label="Context menu" data-testid="context-menu">
  <div class="item" role="menuitem" tabindex="0" data-testid="ctx-view-details">
    <div class="icon"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg></div>
    View details
  </div>
  <div class="item" role="menuitem" tabindex="0" data-testid="ctx-edit">
    <div class="icon"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 20h9M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg></div>
    Edit
  </div>
  <div class="item" role="menuitem" tabindex="0" data-testid="ctx-add-fav">
    <div class="icon"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></div>
    Add to favorites
  </div>
  <div class="separator"></div>
  <div class="item danger" role="menuitem" tabindex="0" data-testid="ctx-delete">
    <div class="icon"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><ellipse cx="12" cy="5" rx="3" ry="1"/><path d="M17 5l-1 14H8L7 5"/><path d="M5 5h14"/></svg></div>
    Delete
  </div>
</div>
</body>
</html>
