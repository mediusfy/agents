<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=1440"><title>Passkey — Rufkis</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:rgba(0,0,0,0.3);display:flex;align-items:center;justify-content:center;min-height:100vh;font-size:14px;color:#1A1A1A}
.dialog{width:440px;background:#FFFFFF;border-radius:12px;border:1px solid #E8E8EC;box-shadow:0 8px 32px rgba(0,0,0,0.12);padding:24px}
.dialog:focus-visible{outline:2px solid #6C31FF;outline-offset:2px}
.title{font-size:16px;font-weight:600;color:#1A1A1A;margin-bottom:20px;display:flex;align-items:center;gap:8px}
.title svg{color:#6C31FF}
.key-card{display:flex;align-items:center;gap:12px;padding:12px;border-radius:10px;border:1px solid #E8E8EC;margin-bottom:8px}
.key-card:focus-visible{outline:2px solid #6C31FF;outline-offset:2px}
.key-card .icon-box{width:36px;height:36px;border-radius:8px;background:#E3F5E5;color:#1B8A2F;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:12px;font-weight:600}
.key-card .info{flex:1}
.key-card .info .name{font-size:13px;font-weight:500;color:#1A1A1A}
.key-card .info .source{font-size:11px;color:#7A7A80}
.key-card .remove{font-size:11px;color:#999;cursor:pointer}
.key-card .remove:hover{color:#D93025}
.actions{display:flex;gap:8px;margin-top:16px}
.actions button{flex:1;padding:9px;border-radius:6px;border:1px solid #E2E2E5;font-size:12.5px;font-family:'Inter',sans-serif;cursor:pointer;background:#fff;color:#555;font-weight:500}
.actions button:hover{background:#F5F5F7;border-color:#C0C0C6}
.actions button:focus-visible{outline:2px solid #6C31FF;outline-offset:2px}
.actions button.primary{border-color:#6C31FF;background:rgba(108,49,255,0.06);color:#6C31FF}
.actions button.primary:hover{background:rgba(108,49,255,0.1)}
</style>
</head>
<body>
<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="passkey-title" data-testid="passkey-dialog">
  <div class="title" id="passkey-title">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    Passkeys
  </div>
  <div class="key-card" data-testid="passkey-1">
    <div class="icon-box">L</div>
    <div class="info">
      <div class="name">Drew's MacBook Pro</div>
      <div class="source">iCloud Keychain</div>
    </div>
    <span class="remove" role="button" tabindex="0" aria-label="Remove passkey for MacBook Pro" data-testid="remove-passkey-1">Remove</span>
  </div>
  <div class="key-card" data-testid="passkey-2">
    <div class="icon-box">P</div>
    <div class="info">
      <div class="name">iPhone 16 Pro</div>
      <div class="source">iCloud Keychain</div>
    </div>
    <span class="remove" role="button" tabindex="0" aria-label="Remove passkey for iPhone" data-testid="remove-passkey-2">Remove</span>
  </div>
  <div class="actions">
    <button data-testid="passkey-cancel">Cancel</button>
    <button class="primary" data-testid="passkey-register">Register new passkey</button>
  </div>
</div>
</body>
</html>
