<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=1440"><title>Favorites — Rufkis</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:rgba(0,0,0,0.3);display:flex;align-items:flex-start;justify-content:flex-start;min-height:100vh;font-size:14px;color:#1A1A1A;padding-top:50px;padding-left:60px}
.popup{width:280px;background:#FFFFFF;border-radius:12px;border:1px solid #E8E8EC;box-shadow:0 8px 32px rgba(0,0,0,0.12);overflow:hidden}
.popup:focus-visible{outline:2px solid #6C31FF;outline-offset:2px}
.header{padding:10px 12px;font-size:10px;font-weight:600;color:#999;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid #F2F2F4}
.item{display:flex;align-items:center;gap:8px;padding:8px 12px;cursor:pointer;border-bottom:1px solid #F2F2F4}
.item:last-child{border-bottom:none}
.item:hover{background:rgba(108,49,255,0.03)}
.item:focus-visible{outline:2px solid #6C31FF;outline-offset:-2px}
.item .icon-wrap{width:24px;height:24px;border-radius:6px;background:#F5F5F7;color:#7A7A80;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.item .label{font-size:12.5px;color:#1A1A1A;flex:1}
.item .key-hint{font-size:9px;color:#999;background:#F5F5F7;padding:1px 4px;border-radius:3px}
.edit-footer{display:flex;align-items:center;justify-content:center;gap:4px;padding:10px;color:#999;cursor:pointer;font-size:11px;border-top:1px solid #F2F2F4}
.edit-footer:hover{color:#6C31FF;background:rgba(108,49,255,0.03)}
.edit-footer:focus-visible{outline:2px solid #6C31FF;outline-offset:-2px}
</style>
</head>
<body>
<div class="popup" role="dialog" aria-label="Favorites" aria-modal="true" data-testid="favorites-popup">
  <div class="header">Favorites</div>
  <div class="item" role="listitem" tabindex="0" data-testid="fav-1">
    <div class="icon-wrap"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg></div>
    <div class="label">Cluster Overview</div>
    <span class="key-hint">Cmd1</span>
  </div>
  <div class="item" role="listitem" tabindex="0" data-testid="fav-2">
    <div class="icon-wrap"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 20v-6M6 20V10M18 20V4"/></svg></div>
    <div class="label">Active Alerts</div>
    <span class="key-hint">Cmd2</span>
  </div>
  <div class="item" role="listitem" tabindex="0" data-testid="fav-3">
    <div class="icon-wrap"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg></div>
    <div class="label">Deployments</div>
    <span class="key-hint">Cmd3</span>
  </div>
  <div class="edit-footer" role="button" tabindex="0" aria-label="Edit favorites" data-testid="edit-favorites">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polygon points="16 3 21 8 8 21 3 21 3 16 16 3"/></svg> Edit favorites
  </div>
</div>
</body>
</html>
