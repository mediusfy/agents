name: Build Agent Controller
on:
  push:
    branches: [main]
    paths:
      - 'internal/agents/**'
      - 'cmd/agent-controller/**'
  pull_request:
    paths:
      - 'internal/agents/**'
      - 'cmd/agent-controller/**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: '1.22'
        cache: true
    - name: Vet and Lint
      run: |
        go vet ./internal/agents/...
        go vet ./cmd/agent-controller/...
    - name: Test
      run: go test -v -race -count=1 ./internal/agents/... ./cmd/agent-controller/...
    - name: Security Scan
      uses: securego/gosec@master
      with:
        args: ./internal/agents/... ./cmd/agent-controller/...
    - name: Build
      run: go build -o bin/agent-controller ./cmd/agent-controller/
    - name: Docker Build and Push
      if: github.ref == 'refs/heads/main'
      uses: docker/build-push-action@v5
      with:
        context: .
        file: cmd/agent-controller/Dockerfile
        push: true
        tags: |
          ghcr.io/${{ github.repository }}/agent-controller:latest
          ghcr.io/${{ github.repository }}/agent-controller:${{ github.sha }}
