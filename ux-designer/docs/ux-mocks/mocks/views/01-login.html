<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=1200"><title>Rufkis Login — Light</title>
<style>*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;background:#F2F4F8;display:flex;align-items:center;justify-content:center;min-height:100vh}
.shell{width:440px;display:flex;flex-direction:column;gap:0}
.login-card{padding:40px 36px 32px;background:#fff;border-radius:16px;border:1px solid rgba(0,0,0,0.06);box-shadow:0 2px 12px rgba(0,0,0,0.04);display:flex;flex-direction:column;gap:20px}
.brand{text-align:center;display:flex;flex-direction:column;gap:4px}
.logo{font-size:36px;line-height:1;margin-bottom:4px;color:#2264D1}
.brand h1{font-size:22px;font-weight:700;color:#1C1C1E}
.subtitle{font-size:12px;color:#999}
.tab-row{display:flex;gap:0;border-bottom:1px solid rgba(0,0,0,0.06)}
.tab{flex:1;padding:10px 0;text-align:center;font-size:13px;font-weight:500;color:#999;background:transparent;border:0;border-bottom:2px solid transparent;cursor:pointer;font-family:inherit}
.tab.active{color:#2264D1;border-bottom-color:#2264D1}
.form{display:flex;flex-direction:column;gap:12px}
.form label{display:flex;flex-direction:column;gap:4px}
.form label span{font-size:11px;font-weight:600;color:#999;text-transform:uppercase;letter-spacing:0.04em}
.form input{background:rgba(0,0,0,0.03);border:1px solid rgba(0,0,0,0.06);border-radius:10px;padding:10px 12px;color:#1C1C1E;font-size:14px;font-family:inherit;outline:none}
.form input:focus{border-color:#2264D1;box-shadow:0 0 0 3px rgba(34,100,209,0.1)}
.form .eye-btn{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:transparent;border:0;color:#999;cursor:pointer;font-size:16px}
.pw-wrap{position:relative}
.primary{background:#2264D1;color:#fff;border:0;border-radius:10px;padding:11px 0;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;width:100%}
.primary:hover{background:#1A54B8}
.link{background:transparent;border:0;color:#999;font-size:12px;cursor:pointer;font-family:inherit;text-align:center}
.link:hover{color:#555}
.error{background:rgba(255,59,48,0.06);border:1px solid rgba(255,59,48,0.15);color:#FF3B30;padding:10px 12px;border-radius:10px;font-size:12px;text-align:center}
.divider{position:relative;text-align:center;margin:4px 0}
.divider::before{content:'';position:absolute;top:50%;left:0;right:0;height:1px;background:rgba(0,0,0,0.06)}
.divider span{position:relative;background:#fff;padding:0 12px;font-size:11px;color:#999}
.oauth-row{display:flex;gap:8px}
.oauth-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:10px;border-radius:10px;border:1px solid rgba(0,0,0,0.06);background:#fff;color:#555;font-size:13px;font-family:inherit;cursor:pointer}
.oauth-btn:hover{background:rgba(0,0,0,0.02)}.oauth-btn.apple{background:#000;color:#fff;border-color:#000}
.passkey-cta{display:flex;align-items:center;justify-content:center;gap:8px;font-size:12px;color:#2264D1;cursor:pointer;background:transparent;border:0;font-family:inherit}
.one-tap{display:flex;flex-direction:column;gap:16px;text-align:center}
.one-tap .welcome-back{font-size:13px;color:#999}
</style></head><body>
<div class="shell">
  <div class="login-card">
    <div class="brand"><div class="logo">⌬</div><h1>Rufkis</h1><p class="subtitle">Kubernetes Console</p></div>
    <!-- State B: full form -->
    <div class="tab-row"><button class="tab active">Sign in</button><button class="tab">Create account</button></div>
    <form class="form">
      <label><span>Email</span><input type="email" placeholder="you@company.com" value="drew@example.com"></label>
      <label><span>Password</span><div class="pw-wrap"><input type="password" value="••••••••••••" style="width:100%;padding-right:32px"><button class="eye-btn" type="button">👁</button></div></label>
      <button class="primary" type="submit">Sign in</button>
    </form>
    <div class="divider"><span>or continue with</span></div>
    <div class="oauth-row">
      <button class="oauth-btn"><svg width="16" height="16" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>Google</button>
      <button class="oauth-btn"><svg width="16" height="16" viewBox="0 0 24 24"><path d="M12 2C6.477 2 2 6.477 2 12c0 4.991 3.657 9.128 8.438 9.879v-6.99h-2.54V12h2.54V9.797c0-2.506 1.492-3.89 3.777-3.89 1.094 0 2.238.195 2.238.195v2.46h-1.26c-1.243 0-1.63.771-1.63 1.562V12h2.773l-.443 2.89h-2.33v6.99C18.343 21.128 22 16.991 22 12c0-5.523-4.477-10-10-10z" fill="#000"/></svg>GitHub</button>
    </div>
    <div class="oauth-row"><button class="oauth-btn apple"><svg width="16" height="16" viewBox="0 0 24 24"><path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z" fill="#fff"/></svg>Sign in with Apple</button></div>
    <button class="passkey-cta"><span style="font-size:16px">🔑</span> Sign in with a passkey</button>
  </div>
</div>
</body></html>
