<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=1200"><title>05-favorites</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"SF Pro Display","SF Pro Text","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;background:rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;min-height:100vh}
.p{width:280px;background:#fff;border-radius:12px;border:1px solid rgba(0,0,0,0.08);box-shadow:0 8px 32px rgba(0,0,0,0.12);overflow:hidden;margin-left:60px;margin-top:50px}
.h5{padding:10px 12px;font-size:12px;font-weight:600;color:#999;text-transform:uppercase;letter-spacing:0.04em}
.f5{display:flex;align-items:center;gap:8px;padding:8px 12px;cursor:pointer;border-bottom:1px solid rgba(0,0,0,0.03)}
.f5:hover{background:rgba(34,100,209,0.03)}.f5 .i5{width:24px;height:24px;border-radius:6px;background:rgba(0,0,0,0.03);color:#999;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.f5 .n5{font-size:12.5px;color:#1C1C1E;flex:1}.f5 .k5{font-size:9px;color:#999;background:rgba(0,0,0,0.04);padding:1px 4px;border-radius:3px}

</style></head><body><div class="p"><div class="h5">Favorites</div>
<div class="f5"><div class="i5"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg></div><div class="n5">Cluster Overview</div><span class="k5">Cmd1</span></div>
<div class="f5"><div class="i5"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20v-6M6 20V10M18 20V4"/></svg></div><div class="n5">Active Alerts</div><span class="k5">Cmd2</span></div>
<div class="f5"><div class="i5"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg></div><div class="n5">Deployments</div><span class="k5">Cmd3</span></div>
<div class="f5" style="color:#999;cursor:pointer;justify-content:center;padding:10px;gap:4px"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="16 3 21 8 8 21 3 21 3 16 16 3"/></svg> Edit favorites</div></div></body></html>
