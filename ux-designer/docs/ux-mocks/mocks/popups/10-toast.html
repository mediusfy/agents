<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=1200"><title>10-toast</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"SF Pro Display","SF Pro Text","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;background:rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;min-height:100vh}

<div class="t10 b"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12.01" y2="16"/><line x1="12" y1="8" x2="12" y2="12"/></svg><span class="m10">Ingress migration 3 of 4 steps complete</span></div></div></body></html>
