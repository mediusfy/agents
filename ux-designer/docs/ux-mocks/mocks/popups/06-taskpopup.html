<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=1200"><title>06-taskpopup</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"SF Pro Display","SF Pro Text","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;background:rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;min-height:100vh}
.p{width:480px;background:#fff;border-radius:16px;border:1px solid rgba(0,0,0,0.08);box-shadow:0 8px 40px rgba(0,0,0,0.15);overflow:hidden}
.h6{padding:14px 16px;border-bottom:1px solid rgba(0,0,0,0.04);display:flex;align-items:center}.h6 h2{font-size:14px;font-weight:600;color:#1C1C1E;flex:1}
.t6{padding:12px 16px;display:flex;gap:12px;border-bottom:1px solid rgba(0,0,0,0.03)}.t6 .b6{width:4px;border-radius:2px;flex-shrink:0}.t6 .b6.g{background:#34C759}.t6 .b6.b{background:#2264D1}.t6 .b6.y{background:#FF9500}
.t6 .c6{flex:1}.t6 .c6 .l6{font-size:12.5px;font-weight:500;color:#1C1C1E}.t6 .c6 .s6{font-size:11px;color:#999;margin-top:2px}.t6 .p6{font-size:10px;padding:2px 6px;border-radius:4px;height:fit-content}
.p6.i{background:rgba(34,100,209,0.06);color:#2264D1}.p6.s{background:rgba(52,199,89,0.06);color:#34C759}.p6.f{background:rgba(255,149,0,0.06);color:#FF9500}

</style></head><body><div class="p"><div class="h6"><h2>Task: ingress migration</h2><span style="font-size:10px;padding:2px 8px;border-radius:999px;background:rgba(52,199,89,0.08);color:#34C759;font-weight:600">In progress</span></div>
<div class="t6"><div class="b6 g"></div><div class="c6"><div class="l6">Verify nginx ingress controller</div><div class="s6">Check deployment status and readiness</div></div><span class="p6 s">Done</span></div>
<div class="t6"><div class="b6 b"></div><div class="c6"><div class="l6">Create new ingress resources</div><div class="s6">api-gateway, webapp, admin-panel</div></div><span class="p6 i">Active</span></div>
<div class="t6"><div class="b6 y"></div><div class="c6"><div class="l6">Test canary deployment</div><div class="s6">Route 10% traffic, verify 200s</div></div><span class="p6 f">Pending</span></div>
<div class="t6"><div class="b6 y"></div><div class="c6"><div class="l6">Update DNS records</div><div class="s6">Point *.example.com to new LB</div></div><span class="p6 f">Pending</span></div>
<div style="padding:10px 16px;display:flex;gap:6px"><button class="pb" style="font-size:11px;padding:5px 12px;flex:1">Add step</button><button class="pb p" style="font-size:11px;padding:5px 12px;flex:1">Mark complete</button></div></div></body></html>
