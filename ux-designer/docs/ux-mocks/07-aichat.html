<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=1200"><title>07-aichat</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"SF Pro Display","SF Pro Text","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;background:rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;min-height:100vh}
.p{width:420px;height:560px;background:#fff;border-radius:16px;border:1px solid rgba(0,0,0,0.08);box-shadow:0 8px 40px rgba(0,0,0,0.15);display:flex;flex-direction:column;overflow:hidden}
.h7{padding:12px 16px;border-bottom:1px solid rgba(0,0,0,0.04);display:flex;align-items:center;gap:8px}.h7 .a7{width:28px;height:28px;border-radius:8px;background:rgba(34,100,209,0.08);color:#2264D1;display:flex;align-items:center;justify-content:center;font-size:14px}
.msg{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.msg .m{max-width:85%;padding:10px 14px;border-radius:12px;font-size:12.5px;line-height:1.5}.msg .m.u{background:#2264D1;color:#fff;align-self:flex-end;border-bottom-right-radius:4px}.msg .m.a{background:rgba(0,0,0,0.03);color:#1C1C1E;align-self:flex-start;border-bottom-left-radius:4px}.msg .m .warn{margin-top:6px;padding:6px 10px;border-radius:8px;background:rgba(255,149,0,0.08);color:#FF9500;font-size:11px}
.i7{display:flex;gap:8px;padding:10px 12px;border-top:1px solid rgba(0,0,0,0.04)}.i7 input{flex:1;padding:8px 12px;border-radius:10px;border:1px solid rgba(0,0,0,0.06);background:rgba(0,0,0,0.02);font-size:12.5px;font-family:inherit;outline:none;color:#1C1C1E}
.i7 input:focus{border-color:#2264D1}.i7 button{padding:8px 14px;border-radius:10px;border:0;background:#2264D1;color:#fff;font-size:12.5px;cursor:pointer;font-family:inherit}

</style></head><body><div class="p"><div class="h7"><div class="a7">Ai</div><span style="font-size:13px;font-weight:600;color:#1C1C1E">Rufkis AI</span><span style="font-size:10px;padding:2px 6px;border-radius:4px;background:rgba(52,199,89,0.08);color:#34C759">v2.3</span></div>
<div class="msg">
<div class="m a">Hello! I'm your Kubernetes assistant. How can I help?</div>
<div class="m u">What's causing the memory pressure in kube-system?</div>
<div class="m a">The kube-apiserver-1 pod is using 92% of its memory limit. This correlates with the recent etcd compaction backlog.<br><br><div class="warn">Suggestion: Increase --memory-limit to 6Gi</div></div>
</div>
<div class="i7"><input type="text" placeholder="Ask Rufkis anything..." value="Show recent events"><button>Send</button></div></div></body></html>
