<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=1200"><title>02-notifications</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"SF Pro Display","SF Pro Text","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;background:rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;min-height:100vh}
.p{width:420px;background:#fff;border-radius:16px;border:1px solid rgba(0,0,0,0.08);box-shadow:0 8px 40px rgba(0,0,0,0.15);overflow:hidden;margin-left:750px;margin-top:52px}
.h{padding:14px 16px;border-bottom:1px solid rgba(0,0,0,0.04);display:flex;align-items:center}
.h h2{font-size:14px;font-weight:600;color:#1C1C1E}.h .b{font-size:10px;font-weight:600;padding:1px 6px;border-radius:999px;background:rgba(223,82,100,0.1);color:#DF5264;margin-left:6px}.h .c2{font-size:11px;color:#2264D1;margin-left:auto;cursor:pointer}
.l{max-height:400px;overflow-y:auto}.n2{display:flex;gap:10px;padding:12px 16px;border-bottom:1px solid rgba(0,0,0,0.03)}
.n2 .d2{width:8px;height:8px;border-radius:999px;margin-top:5px;flex-shrink:0}.n2 .d2.c{background:#FF3B30}.n2 .d2.w{background:#FF9500}.n2 .d2.i{background:#2264D1}
.n2 .t2{flex:1}.n2 .t2 .ti{font-size:12.5px;color:#1C1C1E;font-weight:500}.n2 .t2 .ts{font-size:11px;color:#999;margin-top:2px}.n2 .tm{font-size:10px;color:#999;white-space:nowrap}

</style></head><body><div class="p"><div class="h"><h2>Notifications</h2><span class="b">5</span><span class="c2">Mark all read</span></div>
<div class="l">
<div class="n2"><div class="d2 c"></div><div class="t2"><div class="ti">CRITICAL: Memory pressure in kube-system</div><div class="ts">kube-apiserver-1 using 92%</div></div><span class="tm">2m ago</span></div>
<div class="n2"><div class="d2 c"></div><div class="t2"><div class="ti">CRITICAL: Node NotReady</div><div class="ts">ip-10-0-12-34 unresponsive</div></div><span class="tm">13m ago</span></div>
<div class="n2"><div class="d2 w"></div><div class="t2"><div class="ti">WARNING: Error rate high</div><div class="ts">ingress/api-gateway 5.2%</div></div><span class="tm">22m ago</span></div>
<div class="n2"><div class="d2 i"></div><div class="t2"><div class="ti">Certificate nearing expiry</div><div class="ts">secret/tls-ingress</div></div><span class="tm">2h ago</span></div>
</div></div></body></html>
