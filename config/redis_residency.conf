# Redis Caching Configuration for ENTITYMGMT-11 (Multi-Region Data Residency)
# ============================================================================
# Story: ENTITYMGMT-11 — System enforces multi-region data residency
# Bounded Context: Entity Management
#
# This Redis configuration supports the data residency caching requirements:
#   1. ResolveZone cache (region → data_residency_zone mapping)
#   2. Entity zone lookup cache (entity_id → zone metadata)
#   3. Region routing table cache (for RoutingContext)
#   4. Observability span enrichment cache
# ============================================================================

# ============================================================================
# Memory Management
# ============================================================================
maxmemory 512mb
maxmemory-policy allkeys-lru
maxmemory-samples 10

# ============================================================================
# Persistence
# ============================================================================
appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# ============================================================================
# Connection
# ============================================================================
timeout 300
tcp-keepalive 60

# ============================================================================
# Cache Key Patterns for ENTITYMGMT-11
# ============================================================================
#
# | Cache Key Pattern                              | TTL     | Purpose
# |------------------------------------------------|---------|----------------------------------------
# | residency:zone:{region}                        | 1 hour  | Region → DataResidencyZone resolution
# | residency:entity:{entity_id}:zone              | 5 min   | Entity's resolved zone + routing decision
# | residency:routing_table:{zone}                 | 30 sec  | Regional routing table (for RoutingContext)
# | residency:observability:{entity_id}            | 2 min   | Obs span enrichment data (region, zone)
# | residency:zone_counts                          | 1 min   | Cached count_entities_by_zone() results
# | residency:zone_entities:{zone}:{status}        | 30 sec  | Cached list_entities_by_zone() results
# | residency:region_lookup:{region}               | 1 hour  | DirectMap lookup cache
# | residency:idempotency:{entity_id}              | 7 days  | Idempotency key with zone metadata
#
# ============================================================================

# ============================================================================
# Eviction Policies for Critical Residency Caches
# ============================================================================
#
# The following caches use a higher priority (volatile-lru) to ensure
# residency zone resolution data is evicted last:
#
#   residency:zone:*          — Zone resolution mapping (expensive to recompute)
#   residency:routing_table:* — Active routing decisions (latency-critical)
#   residency:entity:*:zone   — Entity-specific zone data (frequently accessed)
#
# We rely on the default allkeys-lru policy but tag critical keys with
# "residency:" prefix for monitoring and alerting purposes.
#

# ============================================================================
# Cache Invalidation Triggers
# ============================================================================
#
# The following events trigger cache invalidation:
#
#   entitymanagement.residency.region_routed
#     → DEL residency:zone:{region}
#     → DEL residency:entity:{entity_id}:zone
#     → DEL residency:routing_table:{zone}
#     → DEL residency:observability:{entity_id}
#     → DEL residency:zone_entities:{zone}:*
#
#   entitymanagement.entity.created
#     → DEL residency:zone_counts
#     → DEL residency:zone_entities:{zone}:*
#
#   entitymanagement.entity.soft_deleted
#     → DEL residency:zone_entities:{zone}:*
#     → DEL residency:zone_counts
#
# ============================================================================

# ============================================================================
# Redis Keyspace Notification Configuration
# ============================================================================
# Enable keyspace events for cache invalidation listeners
notify-keyspace-events Ex

# ============================================================================
# Custom Lua Scripts for Atomic Residency Operations
# ============================================================================
#
# Script: resolve_zone_cached
# Description: Atomically resolves a region to its data residency zone,
#              using cache if available, falling back to DB.
#
# KEYS[1] = residency:zone:{region}
# ARGV[1] = region
# ARGV[2] = zone (from DB resolution)
# ARGV[3] = TTL in seconds
#
# Returns: zone string
#
# Usage in Go:
#   script := redis.NewScript(`
#     local cached = redis.call('GET', KEYS[1])
#     if cached then return cached end
#     redis.call('SET', KEYS[1], ARGV[2], 'EX', ARGV[3])
#     return ARGV[2]
#   `)
#   zone, err := script.Run(ctx, rdb, []string{"residency:zone:eu-west-1"}, "eu-west-1", "eu-west-1", 3600).Result()

# ============================================================================
# Monitoring & Alerting Thresholds
# ============================================================================
#
# Key metrics for ObservabilityContext:
#   - residency_cache_hit_rate   — Zone resolution cache hit ratio
#   - residency_cache_latency_ms — Cache lookup latency
#   - residency_routing_table_size — Number of active routing entries
#   - residency_zone_distribution — Entity count per zone
#
# Alert thresholds:
#   - residency_cache_hit_rate < 0.8  → Warning: zone cache may be too small
#   - residency_routing_table_size > 10000 → Warning: consider partitioning
#   - residency_zone_entity_skew > 0.7  → Warning: entity distribution imbalance
