# Redis configuration for ENTITYMGMT-10 outbox relay caching
# Bounded Context: Entity Management
# Story: ENTITYMGMT-10 — Domain events are reliably published via transactional outbox pattern over NATS

# ============================================================================
# General Redis Configuration
# ============================================================================
maxmemory 256mb
maxmemory-policy allkeys-lru
appendonly yes
appendfsync everysec

# ============================================================================
# Outbox Relay Cache Keys
# ============================================================================
# The following key patterns are used by the outbox relay for:
#   - Preventing duplicate relay cycles
#   - Circuit breaker for consecutive failures
#   - Rate limiting lifecycle events
#   - Tracking last published timestamps per event type
#
# Gherkin SCENARIO 2: FIFO ordering is maintained by DB ORDER BY created_at,
# not by Redis. Redis is used for auxiliary metadata only.
#
# Gherkin SCENARIO 3: Exponential backoff is computed in Go code
# (outbox_relay.go), not stored in Redis. Redis tracks consecutive failures
# for circuit breaker decisions.
# ============================================================================

# --- Relay Cycle Lock ---
# Key:     outbox:relay:last_poll
# Type:    String (timestamp)
# TTL:     10 seconds
# Purpose: Prevents duplicate relay cycles when multiple relay instances
#          are running. The relay checks this before starting a poll cycle.
#          If the value is less than (NOW - poll_interval), the relay proceeds.
#          Otherwise, it skips the cycle (another instance is handling it).

# --- Stall Detection ---
# Key:     outbox:relay:stall_count
# Type:    Counter (integer)
# TTL:     60 seconds
# Purpose: Running count of events that have been picked up by the relay
#          (processed_at set) but not yet published within the threshold.
#          Reset on each successful cycle. If count exceeds threshold,
#          trigger a critical alert.

# --- Circuit Breaker ---
# Key:     outbox:relay:consecutive_failures
# Type:    Counter (integer)
# TTL:     300 seconds (5 minutes)
# Purpose: Tracks consecutive publish failures across all event types.
#          If this counter exceeds 10 within 5 minutes, the relay enters
#          circuit-breaker mode and pauses polling for 30 seconds.
#          Reset on first successful publish after a failure.
#
# Circuit breaker states:
#   - CLOSED (normal): 0-9 failures, relay polls normally
#   - OPEN (tripped):  10+ failures, relay pauses for 30s
#   - HALF_OPEN:       After 30s pause, relay tries one batch
#                       → success → CLOSED (reset counter)
#                       → failure → OPEN (another 30s wait)

# --- Last Published Timestamp ---
# Key:     outbox:relay:last_published:{event_type}
# Type:    String (ISO 8601 timestamp)
# TTL:     3600 seconds (1 hour)
# Purpose: Tracks the most recent successful publish timestamp per event type.
#          Used by ObservabilityContext to detect event type staleness.
#          If an event type hasn't been published in > 1 hour, alert.
#
# Examples:
#   outbox:relay:last_published:entity.created          → "2026-01-15T10:30:00Z"
#   outbox:relay:last_published:entity.updated          → "2026-01-15T10:29:00Z"
#   outbox:relay:last_published:entitymanagement.outbox.event_published → "2026-01-15T10:30:05Z"

# --- Rate Limiter for Lifecycle Events ---
# Key:     outbox:relay:rate_limit:{event_type}
# Type:    Counter (integer) with TTL
# TTL:     1 second
# Purpose: Rate-limits the emission of lifecycle events (event_published,
#          event_failed) to prevent flooding NATS with observability events.
#          Maximum 10 lifecycle events per second per event type.
#
# Gherkin: ObservabilityContext consumes event_published for latency metrics.
#          If there are 1000 domain events published in a second, we don't
#          need 1000 event_published lifecycle events — a sampled rate is
#          sufficient for monitoring purposes.
#
# Values (Redis INCR):
#   0-9:   Allow the lifecycle event (increment counter)
#   10+:   Skip the lifecycle event (this one will be sampled)

# --- Event Type Throughput ---
# Key:     outbox:relay:throughput:{event_type}:{yyyy-mm-dd-HH}
# Type:    Counter (integer)
# TTL:     Rolling (expires after 2 hours)
# Purpose: Per-hour throughput counter per event type.
#          Used by ObservabilityContext for throughput dashboards.
#          Incremented each time a domain event is successfully published.
#
# Examples:
#   outbox:relay:throughput:entity.created:2026-01-15-10  → 42
#   outbox:relay:throughput:entity.updated:2026-01-15-10  → 17

# --- Failed Event Replay Queue ---
# Key:     outbox:relay:replay_queue
# Type:    List (FIFO)
# TTL:     No expiry (persistent)
# Purpose: Queue of outbox event IDs that have been manually queued for
#          replay via the DeadLetterQueue admin UI. The relay checks this
#          list before each poll cycle and processes replay requests first.
#
# LPUSH adds a failed event ID for replay.
# RPOP retrieves the next event ID to replay.
#
# Usage:
#   LPUSH outbox:relay:replay_queue "outbox-0006-0000-4000-8000-000000000006"
#   RPOP outbox:relay:replay_queue  → "outbox-0006-0000-4000-8000-000000000006"
