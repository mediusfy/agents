# Redis Cache Configuration for ENTITYMGMT-08 — Entity Status Lifecycle
# Bounded Context: Entity Management
#
# Purpose: Cache entity data with status-aware invalidation.
# Status transitions (active↔inactive) should invalidate cached entity data.
# Soft-deleted entities should be evicted from cache.
#
# ============================================================================
# General Redis Configuration
# ============================================================================
maxmemory 256mb
maxmemory-policy allkeys-lru
appendonly yes
appendfsync everysec

# ============================================================================
# Connection Settings
# ============================================================================
# Bind to localhost for security (adjust for networked deployments)
bind 127.0.0.1
port 6379
# Timeout in seconds (0 = disabled)
timeout 0
# TCP keepalive
tcp-keepalive 300

# ============================================================================
# Entity Cache Key Patterns
# ============================================================================
# Entity data is cached by ID with status in the key for targeted invalidation.
#
# Key pattern:
#   entity:{entity_id}:data        — Full entity data (JSON)
#   entity:{schema_id}:list        — Paginated entity list results
#   entity:{entity_id}:status      — Current status only (for quick checks)
#
# TTLs are deliberately short for entities due to frequent status transitions.
#
# Cache TTLs:
#   Full entity data:   5 minutes (300 seconds)
#   Entity list:        2 minutes (120 seconds)
#   Status-only:        10 minutes (600 seconds) — changes less frequently

# ============================================================================
# Cache Key Definitions
# ============================================================================

# --- Full entity data ---
# Cache the complete entity JSON after reads.
# Invalidated on any update (including status transitions).
# TTL: 300 seconds (5 min)
#
# SET entity:{entity_id}:data <json> EX 300
# GET entity:{entity_id}:data
# DEL entity:{entity_id}:data  (on update/delete)

# --- Entity list results ---
# Cache paginated list results with schema-specific keys.
# Invalidated when any entity in the schema changes status.
# TTL: 120 seconds (2 min) — lists are ephemeral
#
# SET entity:{schema_id}:list:{cursor_hash} <json> EX 120
# GET entity:{schema_id}:list:{cursor_hash}
# DEL entity:{schema_id}:list:*  (on any entity change in schema)

# --- Status-only cache ---
# Quick status lookup without fetching the full entity.
# Useful for the WorkflowEngine to check current status.
# TTL: 600 seconds (10 min)
#
# SET entity:{entity_id}:status <status> EX 600
# GET entity:{entity_id}:status
# DEL entity:{entity_id}:status (on status transition)

# ============================================================================
# Invalidation Strategy for Status Transitions
# ============================================================================
#
# When an entity transitions status (active↔inactive), the following
# caches MUST be invalidated:
#
# 1. Full entity cache:
#    DEL entity:{entity_id}:data
#
# 2. Status-only cache:
#    DEL entity:{entity_id}:status
#
# 3. List caches for the entity's schema:
#    EVAL "return redis.call('del', unpack(redis.call('keys', 'entity:'..ARGV[1]..':list:*')))" 0 {schema_id}
#
# When an entity is soft-deleted:
#    - All caches above are invalidated
#    - Additionally, the entity is removed from any "active entities" cached sets
#
# When an entity is restored (deleted → active):
#    - All caches above are invalidated
#    - The entity should be re-cached on the next read

# ============================================================================
# Rate Limiting (optional)
# ============================================================================
# Use Redis for rate limiting status transition API calls.
# Key pattern: ratelimit:status_update:{user_id}:{entity_id}
# Window: 1 minute, Max: 10 transitions per minute
#
# SET ratelimit:status_update:{user_id}:{entity_id} 1 EX 60 NX
# INCR ratelimit:status_update:{user_id}:{entity_id}
# GET ratelimit:status_update:{user_id}:{entity_id}
# (Check value <= 10 before allowing transition)

