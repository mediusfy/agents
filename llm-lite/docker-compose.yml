services:
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "4000:4000"
    environment:
      - DATABASE_URL=postgresql://litellm:litellm@postgres:5432/litellm
      - REDIS_URL=redis://redis:6379/0
      - LITELLM_MASTER_KEY=sk-MPQ3A_kKYzNrhTpL6tYUVg
      - STORE_MODEL_IN_DB=True
      # API keys are globally set
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-empty}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-empty}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-empty}
      - TOGETHERAI_API_KEY=${TOGETHERAI_API_KEY:-empty}
      - XAI_API_KEY=${XAI_API_KEY:-empty}
      - OLLAMA_API_BASE=${OLLAMA_API_BASE:-http://host.docker.internal:11434}
    volumes:
      - ./config.yaml:/app/config.yaml
    command: [ "--config", "/app/config.yaml", "--detailed_debug" ]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=litellm
      - POSTGRES_PASSWORD=litellm
      - POSTGRES_DB=litellm
    ports:
      - "5432:5432"
    volumes:
      - litellm_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - litellm_redis_data:/data
    command: redis-server --appendonly yes

  nats:
    image: nats:2.10-alpine
    ports:
      - "4222:4222"
      - "8222:8222" # HTTP monitoring port
    command: "-m 8222" # Enable HTTP monitoring

volumes:
  litellm_pg_data:
  litellm_redis_data:
