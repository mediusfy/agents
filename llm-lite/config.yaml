model_list:
  # === ORCHESTRATOR LAYER (Heavy Lifting)
  - model_name: orchestrator
    litellm_params:
      model: together_ai/deepseek-ai/DeepSeek-V4-Pro
      api_key: os.environ/TOGETHERAI_API_KEY
  - model_name: orchestrator
    litellm_params:
      model: gemini/gemini-2.5-pro
      api_key: os.environ/GEMINI_API_KEY
  - model_name: orchestrator
    litellm_params:
      model: xai/grok-4.3
      api_key: os.environ/XAI_API_KEY

  # === SUBAGENT LAYER (Volume Tasks)
  - model_name: subagent
    litellm_params:
      model: ollama/qwen2.5-coder:7b
      api_base: http://host.docker.internal:11434
  - model_name: subagent
    litellm_params:
      model: deepseek/deepseek-v4-flash
      api_key: os.environ/DEEPSEEK_API_KEY
  - model_name: subagent
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY

  # === EXPLICIT MODELS (Guaranteed routing)
  - model_name: gemini-2.5-pro
    litellm_params:
      model: gemini/gemini-2.5-pro
      api_key: os.environ/GEMINI_API_KEY
  - model_name: gemini-2.5-flash
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY
  - model_name: deepseek-v4-pro
    litellm_params:
      model: together_ai/deepseek-ai/DeepSeek-V4-Pro
      api_key: os.environ/TOGETHERAI_API_KEY
  - model_name: grok-4.3
    litellm_params:
      model: xai/grok-4.3
      api_key: os.environ/XAI_API_KEY
  - model_name: qwen2.5-coder:7b
    litellm_params:
      model: ollama/qwen2.5-coder:7b
      api_base: http://host.docker.internal:11434

litellm_settings:
  drop_params: true
  success_callback: ["prometheus"]
  failure_callback: ["prometheus"]

router_settings:
  routing_strategy: usage-based-routing-v2
  model_group_alias:
    "gpt-4o": "orchestrator"
    "gpt-4": "orchestrator"
    "gpt-4-turbo": "orchestrator"
    "gpt-3.5-turbo": "subagent"
    "gpt-4o-mini": "subagent"
    "claude-3-opus-20240229": "orchestrator"
    "claude-3-5-sonnet-20241022": "orchestrator"
    "claude-3-5-sonnet-20240620": "orchestrator"
    "claude-3-7-sonnet-20250219": "orchestrator"
    "claude-3-haiku-20240307": "subagent"
    "claude-3-5-haiku-20241022": "subagent"
    "gemini-1.5-pro": "orchestrator"
    "gemini-1.5-flash": "subagent"
    "deepseek-reasoner": "orchestrator"
    "deepseek-chat": "subagent"
    "sonnet": "orchestrator"
    "opus": "orchestrator"

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  redis_url: os.environ/REDIS_URL
  store_model_in_db: true